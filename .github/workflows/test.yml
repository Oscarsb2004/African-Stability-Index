# Edition 2's checks, on every push and pull request to a branch that carries this file (edition-2 and its work).
#
# The Pages deploy is pages.yml on phase-a-foundation (edition 1); this file neither builds nor publishes the site.
# Every output in data/ and web/public/ is committed, so no step needs the store or the network beyond installing.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python -m verify.run --gate-only
      - run: python -m athena.components check .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
