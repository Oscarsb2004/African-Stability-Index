# Publish the dashboard to GitHub Pages.
#
# The published site is static files. The dashboard's Python runs in the
# visitor's browser under Pyodide, and a small shim answers Dash's requests from
# the app's own Flask test client — see scripts/build_pages.py. Nothing here is a
# server, so there is nothing to keep awake and nothing to attack.
#
# Deploys from phase-a-foundation, the working line, rather than main, which is
# deliberately behind (methodology/TODO.md K4). The github-pages environment
# allows this branch explicitly; every other branch is refused by GitHub.
#
# The pipeline does not run here: the panel in data/ is committed, so a deploy is
# a pure build of what is already in the repository.
name: Pages

on:
  push:
    branches: [phase-a-foundation]
  workflow_dispatch:

# One deploy at a time; let an in-flight deploy finish rather than leave Pages
# mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pages.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pages.txt

      # A project site is served from /<repo>/. Derived from the repository name
      # rather than typed, so a rename or fork cannot ship a site whose every
      # asset 404s (the same rule as canada-economic-atlas's deploy).
      - name: Build
        run: python scripts/build_pages.py --base "/${{ github.event.repository.name }}/" --out build/pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
