# Every source the MDG replications read. `kind` picks the reader; `edition` is what P25 compares: every value
# input of an indicator must come from one edition. Terms are read and dated before any data is used.
# Addresses under web.archive.org are Internet Archive captures, fetched raw (the id_ form).

[ipu-2015-02]
title = "IPU world classification of women in national parliaments, 1 February 2015"
url = "http://archive.ipu.org/wmn-e/arc/classif010215.htm"
kind = "ipu-classification"
edition = "IPU 2015-02-01"
year = 2015
terms = "https://www.ipu.org/terms-use; read 2026-09-25; research or personal use, not commercial"

