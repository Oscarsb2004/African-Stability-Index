# methodology/references.yaml
# Machine-readable citation registry for the African Stability Index (ASI).
# Every methodological decision must have an entry here.
# NOTE: Not yet wired into the dashboard (07_dashboard.py builds its methodology panel
#       from bundle["method_guide"] in 06_qualitative.py). This file is the standalone
#       machine-readable registry; the human-readable equivalent is references.md.
#       Keep both in sync until this is consumed by the dashboard / Athena UI.
#
# Fields:
#   id:          short slug used in code comments and YAML cross-references
#   authors:     list of Last, Initials strings
#   year:        publication year (int)
#   title:       article / chapter / book title
#   venue:       journal, publisher, or institution
#   doi:         DOI if available (null if not)
#   url:         direct URL if no DOI
#   used_in:     list of pipeline stages / files that rely on this source
#   justifies:   brief description of what design decision this source supports
#   limitations: honest notes on where our implementation deviates or where
#                the source's guidance has known gaps

sources:

  - id: oecd_handbook_2008
    authors:
      - "Nardo, M."
      - "Saisana, M."
      - "Saltelli, A."
      - "Tarantola, S."
      - "Hoffmann, A."
      - "Giovannini, E."
    year: 2008
    title: "Handbook on Constructing Composite Indicators: Methodology and User Guide"
    venue: "OECD Publishing, Paris"
    doi: "10.1787/9789264043466-en"
    url: "https://doi.org/10.1787/9789264043466-en"
    used_in:
      - "02_clean.py"
      - "03_normalize.py"
      - "04_score.py"
      - "05_robustness.py"
    justifies: >
      Primary methodological authority for the entire pipeline.
      Grounds: min-max normalization (§6.1), log transforms for skewed data (§6.2),
      polarity inversion at normalization step (§5.3), IQR Winsorization (§5.2),
      three-stage imputation hierarchy (§5.4), equal weights as reference case (§7.1),
      PCA-derived weights (§7.3), and robustness testing (§8).
    limitations: >
      Handbook recommends z-score normalization as an alternative to min-max.
      We deviate toward min-max for interpretability (fixed [0,100] range).

  - id: cherchye_2007_bod
    authors:
      - "Cherchye, L."
      - "Moesen, W."
      - "Rogge, N."
      - "Van Puyenbroeck, T."
    year: 2007
    title: "An Introduction to 'Benefit of the Doubt' Composite Indicators"
    venue: "Social Indicators Research"
    doi: "10.1007/s11205-006-9029-7"
    url: "https://doi.org/10.1007/s11205-006-9029-7"
    used_in:
      - "04_score.py"
    justifies: >
      Benefit of Doubt (BoD) LP formulation: per-country DEA-CCR that maximises
      each country's own composite score subject to global pillar weight bounds.
      Implemented in score_bod() using PuLP CBC solver.
    limitations: >
      Original formulation has no explicit upper weight bounds. We add WEIGHT_MAX=0.25
      to prevent degenerate single-pillar solutions, following Rogge (2018).

  - id: rogge_2018_bod_extended
    authors:
      - "Rogge, N."
    year: 2018
    title: "Composite Indicators as Generalized Benefit-of-the-Doubt Weighted Averages"
    venue: "European Journal of Operational Research"
    doi: "10.1016/j.ejor.2017.12.009"
    url: "https://doi.org/10.1016/j.ejor.2017.12.009"
    used_in:
      - "04_score.py"
    justifies: >
      Justifies adding per-pillar upper weight bounds to the standard BoD LP
      to prevent degenerate solutions (one pillar receiving near-100% weight).
    limitations: null

  - id: munda_nardo_2009_geometric
    authors:
      - "Munda, G."
      - "Nardo, M."
    year: 2009
    title: "Noncompensatory/nonlinear composite indicators for ranking countries: a defensible setting"
    venue: "Applied Economics"
    doi: "10.1080/00036840601019364"
    url: "https://doi.org/10.1080/00036840601019364"
    used_in:
      - "04_score.py"
    justifies: >
      Grounds the use of geometric mean aggregation as a partially non-compensatory
      method. Low pillar scores cannot be fully offset by high scores elsewhere,
      which is methodologically appropriate for a stability index.
    limitations: >
      Geometric mean penalises uneven development more harshly than arithmetic mean.
      Rankings may shift significantly between equal-weight and geometric-mean methods.

  - id: undp_hdr_2010
    authors:
      - "UNDP"
    year: 2010
    title: "Human Development Report 2010: The Real Wealth of Nations"
    venue: "United Nations Development Programme, New York"
    doi: null
    url: "https://hdr.undp.org/content/human-development-report-2010"
    used_in:
      - "04_score.py"
    justifies: >
      Precedent for geometric mean adoption in a widely-used country index (HDI).
      The 2010 switch from arithmetic to geometric mean in the HDI is the most
      prominent real-world application of partial compensability reasoning.
    limitations: >
      HDI is a simpler 3-dimension index; ASI has 7 pillars. The rationale transfers
      but the magnitude of the compensability effect differs.

  - id: zhou_2007_entropy
    authors:
      - "Zhou, P."
      - "Ang, B.W."
      - "Poh, K.L."
    year: 2007
    title: "A mathematical programming approach to constructing composite indicators"
    venue: "Ecological Economics"
    doi: "10.1016/j.ecolecon.2006.12.020"
    url: "https://doi.org/10.1016/j.ecolecon.2006.12.020"
    used_in:
      - "04_score.py"
    justifies: >
      Grounds the Shannon entropy weighting approach for composite indicators:
      H_j = -sum(p_ij * ln(p_ij)), divergence e_j = 1 - H_j/ln(n), weights
      normalised to sum to 1. Pillars with higher cross-country variance receive
      more weight.
    limitations: >
      Entropy weights are sensitive to sample composition — adding or removing
      countries changes the weights. Results are not directly comparable across
      ASI versions with different country lists.

  - id: shannon_1948
    authors:
      - "Shannon, C.E."
    year: 1948
    title: "A mathematical theory of communication"
    venue: "The Bell System Technical Journal"
    doi: "10.1002/j.1538-7305.1948.tb01338.x"
    url: "https://doi.org/10.1002/j.1538-7305.1948.tb01338.x"
    used_in:
      - "04_score.py"
    justifies: >
      Foundational source for Shannon entropy H = -sum(p * ln(p)).
      The composite indicator application (zhou_2007_entropy) derives from this.
    limitations: null

  - id: nardo_2005_pca
    authors:
      - "Nardo, M."
      - "Saisana, M."
      - "Saltelli, A."
      - "Tarantola, S."
    year: 2005
    title: "Tools for Composite Indicators Building"
    venue: "EUR 21682 EN. European Commission, Joint Research Centre, Ispra"
    doi: null
    url: "https://publications.jrc.ec.europa.eu/repository/handle/JRC31473"
    used_in:
      - "04_score.py"
    justifies: >
      Grounds PCA-derived weights: first principal component loadings used as
      pillar weights, capturing the direction of maximum variance across countries.
    limitations: >
      When pillars are highly correlated, PC1 may not capture structure beyond
      a single "overall development" axis. PCA weights are descriptive of the
      sample, not prescriptive. Treat as sensitivity check, not preferred method.

  - id: cronbach_1951
    authors:
      - "Cronbach, L.J."
    year: 1951
    title: "Coefficient alpha and the internal structure of tests"
    venue: "Psychometrika"
    doi: "10.1007/BF02310555"
    url: "https://doi.org/10.1007/BF02310555"
    used_in:
      - "02_clean.py"
    justifies: >
      Cronbach's alpha as the pillar internal consistency diagnostic. Conventional
      minimum alpha >= 0.70; pipeline gates leniently at MIN_CRONBACH_ALPHA = 0.60
      (constants.py) because alpha is computed on raw mixed-polarity values, which
      deflates it. Polarity-corrected computation is scheduled as ROADMAP Phase 3.
    limitations: >
      Alpha assumes tau-equivalence (equal loadings) and is inflated by large pillar
      size. Pillar C (8 indicators) will mechanically produce higher alpha than
      Pillar E (4 indicators). Deflated by mixed polarity on raw values. Flag, not verdict.

  - id: tukey_1977
    authors:
      - "Tukey, J.W."
    year: 1977
    title: "Exploratory Data Analysis"
    venue: "Addison-Wesley, Reading, MA"
    doi: null
    url: null
    used_in:
      - "02_clean.py"
    justifies: >
      Tukey's fences for IQR Winsorization. ASI deliberately widens k from Tukey's
      1.5 to IQR_MULTIPLIER = 2.0 (constants.py): at n=54, 1.5x clips too aggressively
      and compresses mid-distribution differentiation; 2.0x caps genuine outliers
      without truncating moderate variation. Winsorization retains observations (unlike
      trimming). Applied to scoring indicators only.
    limitations: >
      k=2.0 is a deliberate deviation from the Tukey 1.5 default, documented in
      constants.py.

  - id: saisana_2005_robustness
    authors:
      - "Saisana, M."
      - "Saltelli, A."
      - "Tarantola, S."
    year: 2005
    title: "Uncertainty and sensitivity analysis techniques as tools for the quality assessment of composite indicators"
    venue: "Journal of the Royal Statistical Society: Series A"
    doi: "10.1111/j.1467-985X.2005.00359.x"
    url: "https://doi.org/10.1111/j.1467-985X.2005.00359.x"
    used_in:
      - "05_robustness.py"
    justifies: >
      Grounds the robustness framework (05_robustness.py, implemented): MaxS worst-case
      weight search, fill/island-exclusion sensitivity, and rank-shift analysis across
      methods. MaxS uses random-restart grid search (deterministic pillar corners +
      Dirichlet samples), not SLSQP — the rank-based objective is non-differentiable.
    limitations: >
      Per-assumption sensitivity is implemented; a joint Monte Carlo over all assumptions
      (imputation x winsorization x normalization x weighting) is scheduled as ROADMAP
      Phase 3.

  - id: saltelli_2008_sensitivity
    authors:
      - "Saltelli, A."
      - "Ratto, M."
      - "Andres, T."
      - "Campolongo, F."
      - "Cariboni, J."
      - "Gatelli, D."
      - "Saisana, M."
      - "Tarantola, S."
    year: 2008
    title: "Global Sensitivity Analysis: The Primer"
    venue: "John Wiley & Sons"
    doi: null
    url: null
    used_in:
      - "05_robustness.py"
    justifies: >
      Sensitivity band methodology for Monte Carlo weight perturbation in Stage 05.
    limitations: >
      Weight-perturbation sensitivity is implemented in 05_robustness.py; the full joint
      Monte Carlo across all assumptions is scheduled as ROADMAP Phase 3.

  - id: kaufmann_2010_wgi
    authors:
      - "Kaufmann, D."
      - "Kraay, A."
      - "Mastruzzi, M."
    year: 2010
    title: "The Worldwide Governance Indicators: Methodology and Analytical Issues"
    venue: "Hague Journal on the Rule of Law"
    doi: "10.1017/S1876404511200046"
    url: "https://doi.org/10.1017/S1876404511200046"
    used_in:
      - "01_pull.py"
      - "indicators_list/pillar_a.yaml"
    justifies: >
      Authoritative documentation of WGI data construction. Grounds choice to use
      estimated scores (.EST) rather than percentile ranks (.PER.RNK) — estimated
      scores preserve cardinal distance; percentile ranks introduce rank compression.
    limitations: >
      WGI dimensions are highly intercorrelated (structural feature of methodology).
      This limits the independence assumption behind multi-pillar composite design.
      The ASI partially mitigates this by distributing WGI indicators across pillars
      where they are conceptually relevant, not concentrating all six in Pillar A.

  - id: spearman_1904
    authors:
      - "Spearman, C."
    year: 1904
    title: "The Proof and Measurement of Association between Two Things"
    venue: "The American Journal of Psychology"
    doi: "10.2307/1412159"
    url: "https://doi.org/10.2307/1412159"
    used_in:
      - "02_clean.py"
    justifies: >
      Spearman rank correlation matrices computed per pillar to identify redundant
      indicator pairs (rho > 0.90) and potential pillar misclassifications (rho < 0.30).
    limitations: null
