[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-core"
version = "0.1.0.dev0"
description = "The contracts every Athena project is built on: definitions, frames, steps and validation."
requires-python = ">=3.13"
dependencies = [
    "pydantic==2.13.5",
    "pyarrow==25.0.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
