[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-core"
version = "0.2.0.dev0"
description = "Published statistics in one common format, rebuilt by their publishers' methods and checked against them."
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
dependencies = [
    "pandas==3.0.6",
    "pandera==0.33.1",
    "requests-cache==1.3.3",
    "pypdf==6.19.0",
    "pdfminer.six==20260107",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["athena", "adapters", "mdg"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
