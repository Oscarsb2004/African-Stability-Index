# Every source the ASI reads, with its terms as read and dated. `python 00_ingest.py <key> ...` ingests one;
# `sources.lock` holds the hash of every address fetched (athena-kit's athena.fetch). Moved from athena-core's
# adapters/sources.toml on 2026-10-20 (P107), the ASI's sources only.

[usgs-africa-gis]
title = "USGS, Compilation of Geospatial Data (GIS) for the Mineral Industries and Related Infrastructure of Africa (2021), the geodatabase"
url = "https://www.sciencebase.gov/catalog/file/get/607611a9d34e018b3201cbbf?f=__disk__30%2F8a%2Fb1%2F308ab140de2e0a1384172068209374d19ae4a65a"
kind = "usgs-africa-gis"
edition = "2021"
terms = "https://doi.org/10.5066/P97EQWXP; read 2026-10-18; USGS data release, U.S. public domain; access and use constraints 'None' in the FGDC metadata; provided 'as is'; the rail and road layers carry OpenStreetMap IDs and keep ODbL; each layer names its data source"

[wb-africa-grid]
title = "World Bank, Africa Electricity Transmission and Distribution Grid Map (2017), existing and planned lines"
url = "https://datacatalogfiles.worldbank.org/ddh-published/0040465/DR0050466/africagrid20170906final.geojson"
kind = "wb-africa-grid"
edition = "2017-09-06"
terms = "https://energydata.info/dataset/africa-electricity-transmission-and-distribution-grid-map-2017; read 2026-10-18; CC BY 4.0; World Bank Group (author C. Arderne); completeness varies widely by country, as the record says"

[wdi-bulk]
title = "World Development Indicators, bulk download"
url = "https://databank.worldbank.org/data/download/WDI_CSV.zip"
kind = "worldbank-bulk"
database = "WDI"
terms = "https://www.worldbank.org/ext/en/legal/terms-conditions/datasets; read 2026-10-17; CC BY 4.0 unless a series' License Type says otherwise; attribute as 'The World Bank: Dataset name: Data source'"

[wgi-bulk]
title = "Worldwide Governance Indicators, bulk download"
url = "https://databank.worldbank.org/data/download/WGI_CSV.zip"
kind = "worldbank-bulk"
database = "WGI"
terms = "https://www.worldbank.org/ext/en/legal/terms-conditions/datasets; read 2026-10-17; CC BY 4.0 unless a series' License Type says otherwise; attribute as 'The World Bank: Dataset name: Data source'"

# The ASI's legacy inputs: its own pull through the World Bank API, frozen as a workbook in its folder. A file:
# address is a path inside this repository, read from disk and locked like any other source.

[asi-pull]
title = "The ASI's frozen pull of its 33 WDI and WGI series (the inputs of every score published so far)"
url = "file:data/baseline/01_raw_pull_BASELINE.xlsx"
kind = "asi-pull"
terms = "World Bank data under CC BY 4.0, read 2026-10-17 (see wdi-bulk and wgi-bulk); the workbook is the ASI's own"

