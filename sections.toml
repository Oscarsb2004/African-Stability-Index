# The ASI's binding to athena-kit's section templates (P54): which series fills each measure.
# 04_sections.py reads it with the datasets named on its command line. The templates are in athena/sections/, and
# each belongs to a dimension (P64): stability, economy, finance or infrastructure.

project = "asi"
sections = [
    "appraisals",                                                                      # stability
    "outlook", "output", "prices", "public_finances", "structure", "jobs",              # economy
    "monetary", "currency", "banks", "capital_markets", "sovereign", "capital_flows",   # finance
    "services", "power", "logistics", "resources",                                      # infrastructure
]

[datasets.wdi]
publisher = "World Bank"
licence = "CC BY 4.0"
attribution = "The World Bank: World Development Indicators"
link = "https://datacatalog.worldbank.org/search/dataset/0037712"

[datasets.wgi]
publisher = "World Bank"
licence = "CC BY 4.0"
attribution = "The World Bank: Worldwide Governance Indicators"
link = "https://www.worldbank.org/en/publication/worldwide-governance-indicators"

[datasets.hdr]
publisher = "UNDP Human Development Report Office"
licence = "CC BY 3.0 IGO"
attribution = "UNDP Human Development Report Office: Human Development Report data, 2025 edition"
link = "https://hdr.undp.org/data-center"

[datasets.cpi]
publisher = "Transparency International"
licence = "CC BY 4.0"
attribution = "Corruption Perceptions Index (2025) by Transparency International is licensed under CC BY 4.0"
link = "https://www.transparency.org/en/cpi/2025"

[datasets.weo]
publisher = "International Monetary Fund"
licence = "IMF terms for data: publish with the citation; commercial reuse needs the IMF's permission"
attribution = "Source: International Monetary Fund, World Economic Outlook database, October 2026"
link = "https://www.imf.org/en/Publications/SPROLLs/world-economic-outlook-databases"

[measures]
# ── economy ───────────────────────────────────────────────────────────────────────────────────────────────────────
# outlook: the IMF's projections only, the years after each state's last actual data (marked F by the adapter)
growth_projected = { dataset = "weo", series = "NGDP_RPCH", where = { OBS_STATUS = "F" } }
inflation_projected = { dataset = "weo", series = "PCPIPCH", where = { OBS_STATUS = "F" } }
debt_projected = { dataset = "weo", series = "GGXWDG_NGDP", where = { OBS_STATUS = "F" } }
# output
gdp = { dataset = "wdi", series = "NY.GDP.MKTP.CD" }
gdp_per_person = { dataset = "wdi", series = "NY.GDP.PCAP.PP.CD" }
real_growth = { dataset = "wdi", series = "NY.GDP.MKTP.KD.ZG" }
# prices
inflation = { dataset = "wdi", series = "FP.CPI.TOTL.ZG" }
# public finances
tax_revenue = { dataset = "wdi", series = "GC.TAX.TOTL.GD.ZS" }
fiscal_balance = { dataset = "wdi", series = "GC.NLD.TOTL.GD.ZS" }
# structure
agriculture = { dataset = "wdi", series = "NV.AGR.TOTL.ZS" }
industry = { dataset = "wdi", series = "NV.IND.TOTL.ZS" }
manufacturing = { dataset = "wdi", series = "NV.IND.MANF.ZS" }
services = { dataset = "wdi", series = "NV.SRV.TOTL.ZS" }
fuel_exports = { dataset = "wdi", series = "TX.VAL.FUEL.ZS.UN" }
ore_exports = { dataset = "wdi", series = "TX.VAL.MMTL.ZS.UN" }
resource_rents = { dataset = "wdi", series = "NY.GDP.TOTL.RT.ZS" }
# jobs
unemployment = { dataset = "wdi", series = "SL.UEM.TOTL.ZS" }
youth_unemployment = { dataset = "wdi", series = "SL.UEM.1524.ZS" }
participation = { dataset = "wdi", series = "SL.TLF.CACT.ZS" }
vulnerable_employment = { dataset = "wdi", series = "SL.EMP.VULN.ZS" }
# ── finance ───────────────────────────────────────────────────────────────────────────────────────────────────────
# monetary conditions
real_interest_rate = { dataset = "wdi", series = "FR.INR.RINR" }
lending_rate = { dataset = "wdi", series = "FR.INR.LEND" }
deposit_rate = { dataset = "wdi", series = "FR.INR.DPST" }
broad_money = { dataset = "wdi", series = "FM.LBL.BMNY.GD.ZS" }
broad_money_growth = { dataset = "wdi", series = "FM.LBL.BMNY.ZG" }
# currency and reserves
exchange_rate = { dataset = "wdi", series = "PA.NUS.FCRF" }
real_effective_rate = { dataset = "wdi", series = "PX.REX.REER" }
reserves_months = { dataset = "wdi", series = "FI.RES.TOTL.MO" }
short_term_debt_reserves = { dataset = "wdi", series = "DT.DOD.DSTC.IR.ZS" }
current_account = { dataset = "wdi", series = "BN.CAB.XOKA.GD.ZS" }
# banks
bad_loans = { dataset = "wdi", series = "FB.AST.NPER.ZS" }
capital_to_assets = { dataset = "wdi", series = "FB.BNK.CAPA.ZS" }
private_credit = { dataset = "wdi", series = "FS.AST.PRVT.GD.ZS" }
interest_spread = { dataset = "wdi", series = "FR.INR.LNDP" }
accounts = { dataset = "wdi", series = "FX.OWN.TOTL.ZS" }
# capital markets
market_cap = { dataset = "wdi", series = "CM.MKT.LCAP.GD.ZS" }
turnover = { dataset = "wdi", series = "CM.MKT.TRNR" }
listed = { dataset = "wdi", series = "CM.MKT.LDOM.NO" }
equity_index = { dataset = "wdi", series = "CM.MKT.INDX.ZG" }
# sovereign and external debt
interest_revenue = { dataset = "wdi", series = "GC.XPN.INTP.RV.ZS" }
external_debt = { dataset = "wdi", series = "DT.DOD.DECT.GN.ZS" }
debt_service_gni = { dataset = "wdi", series = "DT.TDS.DECT.GN.ZS" }
debt_service_exports = { dataset = "wdi", series = "DT.TDS.DECT.EX.ZS" }
# capital flows
fdi = { dataset = "wdi", series = "BX.KLT.DINV.WD.GD.ZS" }
portfolio_equity = { dataset = "wdi", series = "BX.PEF.TOTL.CD.WD" }
portfolio_net = { dataset = "wdi", series = "BN.KLT.PTXL.CD" }
remittances = { dataset = "wdi", series = "BX.TRF.PWKR.DT.GD.ZS" }
aid = { dataset = "wdi", series = "DT.ODA.ODAT.GN.ZS" }
# ── stability: other appraisals ───────────────────────────────────────────────────────────────────────────────────
wgi_va = { dataset = "wgi", series = "GOV_WGI_VA.SC" }
wgi_va_lower = { dataset = "wgi", series = "GOV_WGI_VA.SC_LB" }
wgi_va_upper = { dataset = "wgi", series = "GOV_WGI_VA.SC_UB" }
wgi_pv = { dataset = "wgi", series = "GOV_WGI_PV.SC" }
wgi_pv_lower = { dataset = "wgi", series = "GOV_WGI_PV.SC_LB" }
wgi_pv_upper = { dataset = "wgi", series = "GOV_WGI_PV.SC_UB" }
wgi_ge = { dataset = "wgi", series = "GOV_WGI_GE.SC" }
wgi_ge_lower = { dataset = "wgi", series = "GOV_WGI_GE.SC_LB" }
wgi_ge_upper = { dataset = "wgi", series = "GOV_WGI_GE.SC_UB" }
wgi_rq = { dataset = "wgi", series = "GOV_WGI_RQ.SC" }
wgi_rq_lower = { dataset = "wgi", series = "GOV_WGI_RQ.SC_LB" }
wgi_rq_upper = { dataset = "wgi", series = "GOV_WGI_RQ.SC_UB" }
wgi_rl = { dataset = "wgi", series = "GOV_WGI_RL.SC" }
wgi_rl_lower = { dataset = "wgi", series = "GOV_WGI_RL.SC_LB" }
wgi_rl_upper = { dataset = "wgi", series = "GOV_WGI_RL.SC_UB" }
wgi_cc = { dataset = "wgi", series = "GOV_WGI_CC.SC" }
wgi_cc_lower = { dataset = "wgi", series = "GOV_WGI_CC.SC_LB" }
wgi_cc_upper = { dataset = "wgi", series = "GOV_WGI_CC.SC_UB" }
cpia = { dataset = "wdi", series = "IQ.CPA.IRAI.XQ" }
spi = { dataset = "wdi", series = "IQ.SPI.OVRL" }
lpi = { dataset = "wdi", series = "LP.LPI.OVRL.XQ" }
hdi = { dataset = "hdr", series = "hdi" }
cpi = { dataset = "cpi", series = "cpi_score" }
