      in June 2025; a genuine, verified positive (the nationalisation itself) found
      through the same search discipline as SDN/MLI/BFA, alongside a genuinely
      mixed item (the Niger-Benin oil pipeline's real revenue and real fragility)
    iteration_count: 1
    last_updated: '2026-08-10'
    next_action: 'EXPAND: follow whether Bazoum''s detention resolves after his
      presidential term ended in April 2026 without resignation, and whether the
      ICSID order blocking the Somair uranium stockpile sale is litigated further;
      check whether the oil pipeline has suffered further attacks/closures and
      whether CNPC debt repayment is on track; check the ACLED Tillabéri death
      toll trend past ~1,300-of-1,939 (2025); check whether extreme poverty kept
      falling past 51%->49% (2023-2024); check if Pillar C has gained coverage;
      keep AES facts consistent with MLI and BFA'
  MAR:
    name: Morocco
    region: North
    first_pass: false
    reason: tenth backlog country -- the corpus's first stable monarchy, and a
      genuine framing-balance counterweight after a run of negative-leaning Sahel
      records; distinct colonial history (dual French/Spanish protectorate) whose
      still-unresolved Western Sahara dispute is the one African decolonisation
      case still legally open (Morocco left the OAU 1984-2017 over exactly this
      dispute); a genuine positive (AMO health coverage 42%->88%) found deliberately
      alongside the Gen Z 212 protesters' own healthcare grievances rather than
      presented as resolving them
    iteration_count: 1
    last_updated: '2026-08-10'
    next_action: 'EXPAND: follow whether Gen Z 212 resumes street protests or
      stays in the courts, and how the 2,400+ pending prosecutions are resolved;
      follow whether the AMO 100%-by-2030 target stays on track past 88% (Dec
      2025); check whether Algeria/Polisario respond further to UN Security
      Council Resolution 2797, and clarify Germany''s position on the autonomy
      plan (not found this run); check whether the Al Haouz earthquake recovery
      plan''s 5-year, $11.7B target is on schedule; check if Pillar C has gained
      coverage'
  MDG:
    name: Madagascar
    region: Islands
    first_pass: false
    reason: eleventh backlog country -- fills the Islands gap (only MUS previously
      represented out of 5 island backlog states); distinct colonial history (an
      independent Merina monarchy conquered by France in 1896, not a protectorate);
      a live, dramatic current-events thread -- the October 2025 CAPSAT-backed coup
      that ousted Andry Rajoelina, the same military unit that installed him in
      2009 -- and a genuine positive (the January 2026 mining-moratorium lift)
      found and placed deliberately rather than manufactured
    iteration_count: 1
    last_updated: '2026-08-10'
    next_action: 'EXPAND: follow whether Randrianirina''s transition roadmap stays
      on schedule (constitutional referendum June 2027, presidential election
      October 2027); follow the mining-moratorium lift''s actual investment
      conversion and whether 2025''s 3.2% growth recovers; check whether Pillars
      E and G get fresh post-crisis data (this record''s reference year, 2023,
      predates the October 2025 coup entirely); check whether Rajoelina''s
      stripped citizenship has further legal consequences; check if Pillar C has
      gained coverage'
  NAM:
    name: Namibia
    region: South
    first_pass: false
    reason: twelfth backlog country -- fills Southern Africa's biggest gap (only
      ZAF and BWA previously done of 5 in the region); the only backlog country
      colonized by two different powers in sequence (Germany, then South Africa),
      including the Herero and Nama genocide (1904-1908), the first genocide of
      the 20th century, formally recognised by Germany only in 2021; strongest
      governance pillar recorded in this corpus so far, deliberately balanced
      against a genuinely unresolved current fact (a 2023 reparations lawsuit
      still undecided as of mid-2026) rather than treating 2021 recognition as
      closure
    iteration_count: 1
    last_updated: '2026-08-10'
    next_action: 'EXPAND: follow whether Namibia''s High Court ever rules on the
      Ovaherero/Nama lawsuit against the 2021 Germany reconciliation agreement;
      follow whether the Hyphen green-hydrogen project recovers from RWE''s
      September 2025 withdrawal and whether the $250M green-industrialisation
      target converts to investment; check whether Gini gets fresh measurement;
      check whether Pillars E/F/G (thin, 2-4 of 4-5 measured) gain coverage;
      check if Pillar C has gained coverage'
