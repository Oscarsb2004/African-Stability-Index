pending_format_proposals:
- asi/narrative/schema.py validate() checks historical.overview_citations and key_periods[].citations
  but has no check for a colonial_legacy_citations field, even though colonial_legacy is a
  substantial prose block making citable claims. Consider adding the same check_refs() call
  used for overview. Raised during MUS CREATE run (2026-08-09), not applied.
meta_notes:
- '2026-08-09: system built; no research runs yet. First nine designated in `backlog` with
  `first_pass: true`.'
- '2026-08-09: MUS CREATE run complete (12 sources opened and verified; 3 blocked narrative_check.py
  --links with HTTP 403 bot-detection, not dead links -- confirmed manually). Found and fixed
  a real bug in narrative_check.py: local SSL cert verification was failing against valid
  HTTPS sites (same root cause as the documented 01_pull.py SSL fix), which made every citation
  look unreachable. Also found the schema has no colonial_legacy_citations check -- MUS record
  populates that field anyway for consistency; logged as a pending format proposal rather
  than silently editing schema.py mid-content-run.'
- '2026-08-09: GHA CREATE run complete (11 sources opened and verified). Confirms the link-checker
  fix from the MUS run: same 403 bot-detection pattern on allafrica and IMF, correctly downgraded
  to warnings, not errors. One length warning caught by the validator (pillars.G at 72 words,
  8 short of the 80 floor) -- fixed by adding a real fact (rural/northern electrification
  gap) rather than padding. Next: Algeria (DZA), also CREATE.'
- '2026-08-09: DZA CREATE run complete (13 sources opened and verified: 5 Wikipedia, 4 news,
  3 academic/think-tank, 1 official US State Dept). This is the country the manual review
  queue specifically flagged (item 9a: rank 9th-45th across methods) -- the research confirmed
  the mechanism directly: Pillar F scores 4.4/100 (near-zero, 3/4 indicators DIRECTLY measured,
  not imputed), which crushes the non-compensatory geometric mean (rank 45) while PCA discounts
  the same pillar because it loads inversely against the general stability factor (rank 9).
  Both methods are internally correct; they disagree only on how much weight a catastrophic
  outlier pillar should carry. Also found and flagged a genuine data-provenance issue: the
  displaced_persons indicator (65.7/1000, looks alarming) is a REGIONAL ESTIMATE, not Algeria''s
  own measured value -- flagged explicitly in pillars.E rather than left to mislead a reader.
  Link checker: 2 more bot-blocked domains (france24, bloomberg) confirmed real, same pattern
  as MUS/GHA runs -- the fix is holding across a growing set of domains.'
- '2026-08-09: COD CREATE run complete (14 sources opened and verified). First run with a
  genuine dead link caught: narrative_check.py --links correctly flagged a World Bank PDF
  (documents1.worldbank.org) as a real HTTP 404, independently confirmed via curl -- this
  is different from the MUS/GHA/DZA 403 bot-detection pattern; here the resource is actually
  gone. Replaced with a working citation for the same claim rather than removing the claim,
  since the underlying fact (DRC ~70% of global cobalt supply) is well corroborated elsewhere.
  First run to trigger the balance warning as a TRUE POSITIVE: 0 positive / 1 negative / 3
  mixed recent items, left as-is rather than forced to a nicer ratio -- this is exactly the
  scenario the blueprint anticipates ("if genuinely none, write that finding into balance.note"),
  and the note names two real structural counterweights (23-year +14.7-point score improvement;
  the 2019 first peaceful transfer of power) that fall outside the recent window without pretending
  they belong inside it. Also notable: Pillar F is DRC''s HIGHEST-scoring pillar (78.4) for
  the same underlying reason Algeria''s is its lowest (4.4) -- co2_pc as a wealth-proxy artifact,
  in mirror image. Worth keeping in mind for future countries: extreme Pillar F scores in
  either direction likely trace to the same methodological pattern, not a real environmental
  story.'
- '2026-08-09: SOM CREATE run complete (13 sources opened and verified). Corrects the expectation
  set after the DZA run: SOM is NOT the sparsest-coverage case either. Like COD, only Pillar
  C is greyed (1/8 measured); A/B/D/E/G all clear the RELIABLE tier despite several individual
  indicators being regional-mean or carried-forward estimates -- an important distinction
  made explicit in pillars.B and pillars.E: the INDEX trusts these numbers (enough measured
  coverage to clear the reliability bar) even though the VALUES themselves are catastrophic.
  Reliability tier and score severity are independent axes; conflating them would misrepresent
  what greying means. Genuine positive counterweight found and used at full weight: Somaliland
  (self-governing, unrecognised, same ISO3 as Somalia in this index) held a free/fair/peaceful
  election in Nov 2024 -- used as recent.primary, not downgraded to a footnote, with an honest
  caveat in pillars.A that it is not reflected in the national-level WGI scores the index
  actually measures. Balance came out 1 positive / 3 negative / 0 mixed -- did not trigger
  the "0 positive" warning (that rule is specifically about zero positives with nonzero negatives,
  not about negative-skew generally) and was not forced toward it either. Cleanest run yet
  on the link checker: 13/13 citations resolved on the first attempt, zero 403s, zero 404s
  -- so the fix does not create false positives on healthy runs, which matters as much as
  catching real problems.'
- '2026-08-09: BWA CREATE run complete (14 sources opened and verified; 1 blocked narrative_check.py
  --links with HTTP 403 -- CDC, same bot-detection pattern as before, cross-checked against
  an independent academic source (PMC 95-95-95 review) rather than taken on faith). First
  first-pass country with a genuinely positive-skewed recent record, and the metaprompt held
  up under it: the record does not read as hagiography because two real counterweights were
  found and given full weight rather than softened -- (1) the Pula Fund, Botswana''s sovereign-wealth
  evidence for avoiding the resource curse, shrank from ~$1.8B (2018) to ~$142M (Aug 2024)
  under sustained budget deficits, and (2) the San/Basarwa land-rights dispute remains unresolved
  since the 1990s despite a 2006 court victory, with a Dec 2022 Court of Appeal ruling still
  denying land access. Also traced the CKGR dispute to a specific colonial-era mechanism not
  previously used in this corpus: the 1899 Native Reserves Proclamation demarcated tribal
  land for eight recognised Tswana polities but never allocated the San a reserve, because
  their land use did not fit the Tswana-organised system -- a genuine EXPAND of context/colonial_history.yaml
  rather than a restatement of the "light footprint, Khama, diamonds" story it already tells.
  Pillar F (37.1, thin) is genuinely different from the DZA/COD co2_pc wealth-proxy pattern
  flagged in earlier notes: Botswana''s near-total coal-fired electricity generation is a
  real, current vulnerability, not a scoring artifact of poverty -- worth remembering that
  the wealth-proxy pattern is a recurring risk to check for, not an assumption to apply automatically.
  One fact flagged rather than guessed at: Pillar E''s female intentional-homicide rate (8.32/100k,
  carried forward) scores 0.0, and no dedicated source was found to explain it -- left as an
  explicit next_action rather than speculated on. Balance: 2 positive / 1 negative / 1 mixed.
  Next country: Nigeria (NGA) -- largest population, federal, mixed signals across pillars;
  expect this to be a genuinely different shape again (a large, heterogeneous federation rather
  than a single national story).'
- '2026-08-09: NGA CREATE run complete (12 sources opened and verified: 4 Wikipedia, 5 news,
  2 academic/think-tank, 1 official). Confirmed the "mixed signals across pillars" reason
  for choosing this country directly in the data: Pillar A (governance) 38.7, D (health) 39.1,
  and E (security) 36.6 are all weak and, unlike SOM/COD, FULLY and freshly measured -- 6/6,
  5/5, and 4/4 respectively -- so the severity is not a coverage artifact here, it is a
  directly-evidenced crisis. Pillar F (71.5) again shows the co2_pc wealth-proxy pattern
  flagged after DZA/COD, this time confirmed rather than ruled out (contrast BWA, where the
  same low-F-score instinct turned out to be wrong): Nigeria is a major oil producer/exporter
  with one of the index''s lowest per-capita emissions, because ~45-50% of the population has
  no electricity access at all. The lesson from BWA holds either way -- check the mechanism
  each time, do not assume the pattern in either direction. Cleanest link check of the corpus
  so far: 12/12 citations resolved on the first attempt, zero 403s, zero 404s. Balance came
  out 1 positive / 2 negative / 1 mixed, genuinely difficult rather than manufactured -- the
  one clear positive (Oct 2023 Supreme Court unanimously rejecting both opposition election
  challenges) was placed in `extended` rather than `primary` since it is a judicial event, not
  an ongoing development, and `balance.note` says explicitly that it does not offset the
  severity of the food-insecurity, security, and Rivers State items. Next country: Rwanda (RWA)
