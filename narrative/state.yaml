    name: Burkina Faso
    region: West
    first_pass: false
    reason: eighth backlog country -- completes the AES/ECOWAS-exit pair alongside
      MLI (Niger remains); accounted for ~1/4 of all extremist attacks worldwide in
      2024 per the Global Terrorism Index; the sharpest disconnect yet in this corpus
