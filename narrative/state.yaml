blueprint_version: 1
created: '2026-08-09'
note: The work queue for the narrative layer. Every country appears exactly once, either in
  `countries` (has a record) or in `backlog` (does not yet). Nothing is allowed to be forgotten
  by omission.
rotation:
  policy: create -> expand -> expand -> AUDIT, then audit every 4th run
  why: An iterative loop whose instructions update themselves trends toward 'add more detail'
    forever. The scheduled audit is the only thing pushing the other way.
  forced_audit_trigger: any single run inflating citation count by more than 50%
models:
  create_expand: claude-sonnet-5
  audit: claude-opus-5
  mechanical: claude-haiku-4-5-20251001
  why: Sonnet is the best cost/quality for web-grounded writing and does the bulk. Audit is
    where the strongest reasoning earns its cost, because detecting one's own fabrication
    is harder than producing it. Haiku handles link liveness and formatting.
