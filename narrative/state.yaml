  EGY:
    name: Egypt
    region: North
    first_pass: false
    reason: fourth backlog country -- North Africa's second major economy, filling a
      gap where DZA was the region's only record; the corpus's lowest-ever Pillar F
      score (8.7, reliably measured), driven by a still-unfolding colonial-legacy
      water dispute (GERD) rather than a data artefact; first genuinely all-negative
