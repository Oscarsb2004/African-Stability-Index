    reason: ninth backlog country -- completes the AES/ECOWAS-exit trio alongside
      MLI and BFA; Niger's own first-ever civilian-to-civilian democratic transfer
      (Bazoum, 2021) makes the 2023 coup a sharper rupture than in its AES
      partners; clearest six-decade extraction-imbalance case yet (Orano held 63%
