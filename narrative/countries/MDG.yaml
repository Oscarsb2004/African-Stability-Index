  next_action: >
    EXPAND: (1) follow whether Randrianirina's transition roadmap stays
    on schedule (national consultations through Jan 2027, constitutional
    referendum June 2027, presidential election October 2027), or slips
    the way several other regional transitions have; (2) follow the
    mining-moratorium lift past Jan 2026 -- how many of the 1,600+
