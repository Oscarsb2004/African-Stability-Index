balance:
  n_positive: 1
  n_negative: 1
  n_mixed: 2
  note: >
    The October 2025 coup is coded negative at full weight -- at least
    22 people killed and an unelected military transition are not
    softened by the fact that the protests it capped were a genuine,
    popular response to real hardship. The mining-moratorium lift is
    coded positive because it is a real, substantial, independently
    verifiable economic reform with a documented existing track record
    (Ambatovy's $3.9B), regardless of the transitional government's own
    lack of an electoral mandate -- the same standard this corpus has
    applied to other unelected governments' verified policy actions
    (BFA's SOPAMIB nationalisation, NER's Somair nationalisation). The
    transition roadmap and the citizenship-stripping are both coded
    mixed: the former is a real, dated commitment that still leaves a
    two-year gap without elected government, and the latter is a
    striking accountability moment that does not, on its own, resolve
    anything about how the transition itself will govern.
