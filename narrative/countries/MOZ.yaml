balance:
  n_positive: 1
  n_negative: 2
  n_mixed: 1
  note: >
    The post-election crackdown and the preceding assassinations are
    both coded negative at full weight, not softened by the genuine
    compliance and economic developments placed alongside them. The
    FATF grey-list exit is coded positive because it is a real,
    independently verified achievement, credited on its own terms
    rather than discounted because it occurred during a severe
    political crisis -- the same standard this corpus applies to other
    governments' verified actions during periods of documented
    instability. The LNG project's resumption is coded mixed rather
    than positive: the investment and revenue potential are real, but
    this record cannot credit it as an unqualified gain when the
    security crisis that halted it for four and a half years remains,
    at most, only partially addressed.
