balance:
  n_positive: 0
  n_negative: 3
  n_mixed: 1
  note: >
    Every primary item in this record is negative, and this record does
    not manufacture a counterweight it did not find: the GERD dispute,
    the currency and debt crisis, and the uncompetitive 2023 election are
    each independently documented, severe, and current. The one item
    coded mixed -- the Rafah crossing situation -- is placed there
    because Egypt's own stated position and the crossing's actual
    function genuinely diverged for reasons partly outside Egypt's
    control, not because this record is straining to find something
    positive to report. Real structural strengths do exist and are
    documented in full elsewhere in this record -- Pillar D's health
    outcomes are the strongest in the corpus so far, and Pillar G's
    infrastructure access is near-universal -- but neither rises to the
    level of a "recent development" the blueprint's primary/extended
    format is built to track, so they are not forced into this section
    to offset the negative recent record. A record can be structurally
    strong in places and have a genuinely all-negative recent news cycle
    at the same time; this one does.
