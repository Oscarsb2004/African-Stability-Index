balance:
  n_positive: 1
  n_negative: 1
  n_mixed: 2
  note: >
    The Gen Z 212 protests are coded negative at full weight -- three
    people killed by security forces, 2,400+ criminal prosecutions, and
    a still-unresolved youth-unemployment crisis are not softened to
    make room for other items. The AMO health-coverage expansion is
    coded positive because it is a genuine, independently verifiable,
    substantial achievement (42% to 88% coverage), placed deliberately
    alongside the Gen Z 212 protesters' own healthcare complaints rather
    than presented as resolving them -- both are true at once. The UN
    Security Council's endorsement of Morocco's autonomy plan and the
    journalist pardons are both coded mixed rather than positive: the
    former is a real diplomatic achievement that does not deliver the
    referendum documented in historical.colonial_legacy, and the latter
    is a real release that left the underlying convictions standing.
