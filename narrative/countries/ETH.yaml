balance:
  n_positive: 1
  n_negative: 2
  n_mixed: 1
  note: >
    GERD is documented as a genuine, substantial positive at full weight
    -- a largely self-financed national achievement that has brought
    Ethiopians together across the same ethnic-federal divides driving
    the negative items elsewhere in this record -- rather than folded
    only into the international dispute it also triggered. That dispute,
    the Amhara/Fano insurgency, and the currency crisis are each
    documented as genuinely severe and current; none is softened to
    offset GERD's positive framing. The TPLF factional split is coded
    mixed rather than negative because it is fundamentally a story about
    the incompleteness of a peace agreement (Pretoria) that did
    genuinely stop a war, not a story with no positive dimension at all.
    This record does not treat Ethiopia's story as either a triumph of
    self-reliant development or a country defined solely by internal
    conflict -- both are true, about the same country, often about the
    same institutions, sometimes about the same dam.
