recent:
  primary:
    - headline: "Al-Shabaab launches major offensive, threatens Mogadishu"
      date: 2025-02-20
      summary: >
        Al-Shabaab launched "Operation Ramadan" on 20 February 2025 in
        Hirshabelle State, reversing years of government territorial gains
        from a 2022 counteroffensive. By July 2025 the group had recaptured
        the towns of Sabiid and Anole near Mogadishu, and in March 2025 it
        targeted President Hassan Sheikh Mohamud's motorcade directly with
        a bomb attack that killed four people; the president was unharmed.
      why_it_matters: >
        The direct cause of the weak Pillar E score and the clearest
        illustration that the 2011-2022 gains against Al-Shabaab were
        reversible rather than settled.
      news_url: "https://thesoufancenter.org/intelbrief-2025-july-24/"
      wikipedia_url: "https://en.wikipedia.org/wiki/Somali_Civil_War_(2009%E2%80%93present)"
      sentiment: negative
    - headline: "Somaliland holds a free, fair, and peaceful presidential election"
      date: 2024-11-13
      summary: >
        Somaliland's fourth direct presidential election, on 13 November
        2024, was won by opposition candidate Abdirahman Mohamed Abdullahi
        with 63.92% of the vote against incumbent Muse Bihi Abdi's 34.81%.
        International observation missions, including from University
        College London and the Brenthurst Foundation, found no serious
        irregularities and characterised the vote as free, fair and
        credible, resulting in a peaceful transfer of power.
      why_it_matters: >
        A genuine democratic success story within the same territory the
        index scores as Somalia, though Somaliland's internationally
        unrecognised status means this achievement is not separately
        reflected in national-level governance indicators.
      news_url: "https://theconversation.com/somaliland-elections-whats-at-stake-for-independence-stability-and-shifting-power-dynamics-in-the-horn-of-africa-242131"
      wikipedia_url: "https://en.wikipedia.org/wiki/2024_Somaliland_presidential_election"
      sentiment: positive
    - headline: "Drought and conflict push millions toward crisis-level hunger"
      date: 2025-02-01
      summary: >
        The UN and World Food Programme warned in February 2025 that
        drought, conflict and high food prices could push 4.4 million
        people -- close to a quarter of the population -- into
        crisis-level hunger (IPC Phase 3 or above) by mid-2025, after 2024
        food production came in 45% below the long-term average.
        Humanitarian funding has fallen far short of need: only about 29%
        of the 2025 response plan was funded, and by April 2026 that had
        fallen further to around 15%.
      why_it_matters: >
        Explains the severity of the food-insecurity and displacement
        figures elsewhere in this record, and the widening gap between
        documented need and the funding available to meet it.
      news_url: "https://news.un.org/en/story/2025/02/1160521"
      wikipedia_url: ""
      sentiment: negative
  extended:
    - headline: "Climate displacement compounds conflict displacement"
      date: 2025-11-01
      summary: >
        Amnesty International reported in November 2025 that thousands of
        Somalis displaced by drought and other climate shocks were being
        failed by both national authorities and the international
        community, with inadequate shelter, water and protection in
        informal displacement settlements. The report distinguishes
        climate-driven displacement from the conflict-driven displacement
        covered under Pillar E, though the two increasingly overlap in
        practice.
      why_it_matters: >
        A second, distinct driver behind Somalia's directly-measured
        displacement figure of 210 per 1,000 population -- one of the
        highest in the world.
      news_url: "https://www.amnesty.org/en/latest/news/2025/11/somalia-thousands-of-climate-displaced-individuals-being-failed-by-authorities-and-the-international-community-new-report/"
      wikipedia_url: ""
      sentiment: negative

