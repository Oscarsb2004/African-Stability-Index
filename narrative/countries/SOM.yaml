balance:
  n_positive: 1
  n_negative: 3
  n_mixed: 0
  note: >
    The Somaliland election is a genuine, well-documented positive
    counterweight to an otherwise severe national picture, but it should
    not be read as offsetting the crises measured elsewhere: it occurred in
    a self-governing northern territory that maintains a separate
    administration from the Mogadishu-based government the rest of this
    record describes, and its results do not feed into the national-level
    governance indicators the index scores. Nothing was omitted to force
    this balance -- three of four recent items are negative because the
    underlying situation (renewed Al-Shabaab territorial gains, drought,
    and a severe humanitarian funding shortfall) is genuinely severe and
    worsening through 2025-2026. A further structural counterweight worth
    naming even though it falls outside the "recent" window: the
    equal-weight composite score rose from 26.8 to 34.3 (+7.5) between 2000
    and 2023, so Somalia's multi-decade trajectory is not straightforwardly
    worse today than 23 years ago, even though the last two years
    specifically have been difficult.
