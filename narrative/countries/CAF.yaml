balance:
  n_positive: 1
  n_negative: 3
  n_mixed: 0
  note: >
    The disputed third term and the two Wagner-atrocity items are each
    independently severe, current, and well documented, and none is
    softened to make room for the positive item. The Kimberley Process
    reform is coded positive at full weight because it is a genuine,
    independently verifiable policy change with a real economic
    mechanism (150,000-300,000 artisanal miners' livelihoods), not
    manufactured to offset the rest of the record -- the same standard
    applied to other verified reforms by governments with severe
    governance records elsewhere in this corpus (BFA's SOPAMIB, NER's
    Somair, MDG's mining-moratorium lift). That the same mining sector
    also hosts Wagner-linked extraction is stated plainly in Pillar B
    rather than left for a reader to reconcile alone.
