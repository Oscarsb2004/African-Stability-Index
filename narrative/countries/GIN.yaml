      Moussa Dadis Camara's Presidential Guard massacred at least 150
      opposition supporters gathered in a Conakry stadium on 28
      September 2009 and raped more than 100 women, in what Human
      Rights Watch determined was premeditated.
    url: "https://www.hrw.org/news/2009/10/27/guinea-september-28-massacre-was-premeditated"
