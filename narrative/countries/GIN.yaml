    description: >
      Special forces commander Mamady Doumbouya overthrew President
      Alpha Condé in a September 2021 coup, ending Condé's
      constitutionally-engineered third term amid deadly protests
      against it.
    url: "https://en.wikipedia.org/wiki/2021_Guinean_coup_d'%C3%A9tat"
    direction: mixed
  - year: 2025
