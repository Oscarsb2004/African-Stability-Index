balance:
  n_positive: 1
  n_negative: 2
  n_mixed: 1
  note: >
    Doumbouya's self-authored path to the presidency and Camara's
    pardon are both coded negative at full weight, not softened by the
    genuine Simandou milestone documented alongside them. Simandou's
    first shipment is coded positive because it is a real, concrete,
    verifiable event decades in the making, independent of the
    political severity documented in Pillar A -- the same standard this
    corpus applies to crediting a genuine economic achievement without
    letting political conduct discount it. The bauxite export record is
    coded mixed rather than positive: the growth is real, but this
    record's own colonial_legacy section gives direct historical reason
    to withhold judgment on whether mineral revenue reaches beyond the
    mining sector itself.
