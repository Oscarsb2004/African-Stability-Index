    type: independence
    title: "Guinea votes 'Non' and gains immediate independence"
    description: >
      Guinea voted 95% against Charles de Gaulle's proposed French
      Community on 28 September 1958, the only French African colony to
      reject it outright, and declared full independence on 2 October
      1958, prompting France to retaliate by withdrawing officials and
      destroying infrastructure.
