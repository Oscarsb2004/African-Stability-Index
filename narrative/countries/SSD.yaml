balance:
  n_positive: 1
  n_negative: 2
  n_mixed: 1
  note: >
    Machar's arrest/treason-charge item and the Jonglei-offensive item
    are kept as two distinct negatives rather than merged into one,
    because they document different things: the first is an
    institutional and political collapse, the second is its
    battlefield consequence, weeks apart and separately verifiable.
    The oil-pipeline resumption is coded positive at full weight
    because it is a real, concrete, verifiable economic recovery,
    independent of the political crisis unfolding at the same time --
    the same standard this corpus applies to crediting a genuine
    achievement without letting surrounding turmoil discount it -- but
    its own fragility (it depends on a security agreement between
    Sudan's warring SAF and RSF, not South Sudan's own government) is
    stated plainly rather than glossed over. The December 2026 election
    date is coded mixed, not positive: a firm date exists for a vote
    South Sudan has never held, but the record does not treat a
    scheduled date as an achievement when the unity government whose
    signatories set it has since collapsed.
