    direction: improve
  - year: 1981
    type: constitutional
    title: "PAIGC splits into PAICV after Guinea-Bissau's coup"
    description: >
      Following a November 1980 coup in Guinea-Bissau that deeply
      angered Cape Verde, the shared PAIGC liberation movement split
      into separate national parties; the Cape Verdean branch became
      the PAICV, ending the planned political union between the two
      countries.
