  model_used: claude-sonnet-5

historical:
  overview: >
    The Cape Verde islands were uninhabited when Portuguese sailors
    arrived in 1462, and were settled specifically as a slave-trading
    transhipment hub and plantation economy -- 513 years of Portuguese
    rule, the longest colonial period recorded anywhere in this
    corpus, surpassing Sao Tome and Principe's own 490 years. The
    mixing of enslaved Africans and Portuguese settlers produced
    Kriolu, a distinctive Atlantic creole culture and language. Amilcar
    Cabral, himself Cape Verdean, co-founded the PAIGC in 1956 to
    fight for the joint liberation of Guinea-Bissau and Cape Verde;
    Cape Verde received independence on 5 July 1975 under PAIGC
    secretary-general Aristides Pereira, with a formal union between
    the two states still planned. That union collapsed after a
    November 1980 coup in Guinea-Bissau, deeply resented in Cape
    Verde; the PAIGC split, and its Cape Verdean branch became the
    PAICV. Cape Verde ended one-party rule in September 1990 and held
    its first multiparty elections in January 1991 -- the first
    sub-Saharan one-party state to do so -- with the Movement for
    Democracy (MpD) winning and PAICV peacefully ceding power. The two
    parties have alternated power ever since (1991, 2001, 2016, and
    again on 17 May 2026, when PAICV won 37 of 72 seats to unseat an
    MpD government that had ruled since 2016), a consistency that
    makes Cape Verde Freedom House's highest-ranked democracy in
    Africa. Tourism and diaspora remittances (roughly 12% of GDP, with
    Portugal-based Cape Verdeans alone sending a record 52 million
    euros in 2025) now anchor an economy that grew an estimated 7.2%
    in 2024, even as chronic water scarcity forces the country to
    depend on energy-intensive, largely fossil-fuel-powered
    desalination.
  overview_citations: [c1, c2, c3, c4, c5, c9]
  colonial_legacy: >
    context/colonial_history.yaml is explicit about a distinction this
    record honours directly: Cape Verde's strong composite score
    reflects three and a half decades of post-independence multiparty
    stability under PAICV/MpD alternation since 1991, not a colonial
    legacy of good institutions. The islands were uninhabited before
    Portuguese settlement in 1462 and were populated specifically to
    serve the slave trade, first as a transhipment hub moving captive
    Africans onward to the Americas, and later as a plantation economy
    in its own right -- a colonial mechanism combining both roles that
    this corpus has not documented together elsewhere. At 513 years,
    Cape Verde's colonial period is the longest recorded in this
    corpus, surpassing Sao Tome and Principe's own 490 years. The same
    1956-founded PAIGC that fought to liberate Cape Verde also fought
    for Guinea-Bissau's independence in a single movement, envisioning
    one post-colonial state; the 1980 coup that deposed Luis Cabral in
    Guinea-Bissau, and the resulting split of PAIGC into separate
    national parties, is the specific event this record's own history
    shows Cape Verde's side of -- a rupture Guinea-Bissau's own record,
    researched immediately prior in this corpus, documents from the
    other side.
  colonial_legacy_citations: [c1, c3]
  key_periods:
    - title: "Slave-trade settlement and 513 years of Portuguese rule"
      period: "1462-1975"
      summary: >
        The Cape Verde islands were uninhabited when Portuguese
        sailors arrived in 1462 and were settled specifically as a
        slave-trading transhipment hub and plantation economy. The
        mixing of enslaved Africans and Portuguese settlers produced
        Kriolu, a distinctive Atlantic creole culture and language,
        over what became the longest colonial period recorded
        anywhere in this corpus at 513 years.
      citations: [c1]
    - title: "Independence and the collapse of the planned union with Guinea-Bissau"
      period: "1975-1981"
      summary: >
        Cape Verde received independence from Portugal on 5 July 1975
        under PAIGC secretary-general Aristides Pereira, with a formal
        political union with Guinea-Bissau still planned under the
        same liberation movement. A November 1980 coup in
        Guinea-Bissau, deeply resented in Cape Verde, ended that plan;
        the PAIGC split, and its Cape Verdean branch became the
        PAICV.
      citations: [c2, c3]
    - title: "The 1991 multiparty transition"
      period: "1990-1991"
      summary: >
        Cape Verde ended one-party PAICV rule in September 1990 and
        held its first multiparty elections in January 1991 -- the
        first sub-Saharan African one-party state to do so. The
        Movement for Democracy (MpD) won, and PAICV peacefully ceded
        power, beginning a pattern of competitive alternation that has
        continued for over three decades.
      citations: [c4]
    - title: "Continued democratic alternation"
      period: "1991-2026"
      summary: >
        PAICV and MpD have alternated power in 1991, 2001, 2016 and
        again on 17 May 2026, when PAICV won 37 of 72 seats to unseat
        an MpD government that had ruled since 2016. This consistency
        has made Cape Verde Freedom House's highest-ranked democracy
        in Africa.
      citations: [c5, c6]

pillars:
  A:
    summary: >
      All six World Governance Indicators are directly measured this
      year, and the aggregate (84.1) is the third-highest Pillar A score in this corpus, behind Seychelles (88.2) and Mauritius (86.2) -- Voice and Accountability (93.0) and Political
      Stability (90.4) are both near the scale's ceiling. That
      strength is not a colonial inheritance but a specifically
      post-independence achievement: Cape Verde ended one-party rule
      in 1990, and PAICV and MpD have peacefully alternated power four
      times since, most recently on 17 May 2026, when PAICV won an
      absolute majority to unseat an MpD government that had governed
      since 2016.
    drivers:
      - "all 6 WGI indicators directly measured; aggregate (84.1) the third-highest Pillar A score in this corpus, behind SYC (88.2) and MUS (86.2)"
      - "Voice and Accountability (93.0) and Political Stability (90.4) both near the scale's ceiling"
      - "a specifically post-independence achievement, not a colonial inheritance: PAICV and MpD have peacefully alternated power four times since 1991, most recently 17 May 2026 (see recent developments)"
    citations: [c5, c6]
  B:
    summary: >
      GDP growth, GDP per capita, inflation and domestic credit, all
      freshly measured, are strong for this corpus -- domestic credit
      (100.0) is at the scale's ceiling. Gini, a regional-mean
      estimate rather than a direct measurement, is comparatively
      strong regardless. This pillar's 2023 reference year understates
      continued strength: tourism arrivals reached an estimated 1.18
      million in 2025 (up 16.5% year-on-year), and diaspora
      remittances -- roughly 12% of GDP -- hit a record, with
      Portugal-based Cape Verdeans alone sending 52 million euros in
      2025, up 53% on the prior year.
    drivers:
      - "GDP growth, GDP per capita, inflation, domestic credit all fresh, strong for this corpus; domestic credit (100.0) at the scale's ceiling; Gini comparatively strong (regional-mean estimate)"
      - "2023 reference year understates continued strength: tourism arrivals reached an estimated 1.18 million in 2025, up 16.5% year-on-year"
      - "diaspora remittances (~12% of GDP) hit a record, with Portugal-based Cape Verdeans alone sending EUR52M in 2025, up 53% on the prior year (see recent developments)"
    citations: [c7, c8]
  D:
    summary: >
      Four of the pillar's five indicators are directly measured this
      year, and the aggregate is strong: life expectancy (97.2) and
      infant mortality (95.2) are both near the scale's ceiling.
      Handwashing-facility access and severe food insecurity are
      similarly strong. Safely managed drinking water, the pillar's
      only regional-mean estimate, is comparatively weak by contrast
      -- a specific gap this record connects directly to the chronic
      water scarcity documented in Pillar F, not a data-coverage
      artefact. Four of the pillar's five indicators are current.
    drivers:
      - "4 of 5 indicators directly measured; life expectancy (97.2) and infant mortality (95.2) both near the scale's ceiling"
      - "handwashing-facility access and severe food insecurity similarly strong (fresh)"
      - "safely managed drinking water comparatively weak by contrast (regional-mean estimate) -- connects directly to the chronic water scarcity documented in Pillar F, not a data-coverage artefact; 4 of 5 indicators current"
    citations: [c9]
  E:
    summary: >
      Political Stability and Rule of Law, both fresh and shared with
      Pillar A, are both strong -- among the highest readings recorded
      in this corpus. Intentional homicide, carried forward rather
      than fresh, is comparatively weak by contrast, a specific and
      genuine vulnerability this record does not let the pillar's
      otherwise strong governance readings obscure: Cape Verde has
      become an entrenched cocaine trans-shipment hub between South
      America and Europe, with local money laundering documented
      through Praia's real estate and hospitality sectors. Displaced
      persons, a regional-mean estimate, is more middling. Only two of
      the pillar's four indicators are current.
    drivers:
      - "Political Stability and Rule of Law (shared with Pillar A) both strong, among the highest readings recorded in this corpus"
      - "intentional homicide comparatively weak by contrast (carried forward, not fresh) -- a genuine vulnerability: Cape Verde has become an entrenched cocaine trans-shipment hub, with laundering documented through Praia's real estate and hospitality sectors"
      - "displaced persons more middling (regional-mean estimate); only 2 of 4 indicators current (see recent developments)"
    citations: [c10, c15]
  F:
    summary: >
      This is Cabo Verde's weakest pillar by a wide margin, the
      clearest vulnerability underneath an otherwise exceptional
      composite score. Freshwater withdrawal, carried forward, stands
      at nearly 60% of internal renewable resources -- severe,
      reflecting chronic water scarcity across low-rainfall, riverless
      volcanic islands that forces reliance on energy-intensive
      desalination. Electricity generation from fossil sources, also
      carried forward, is weak at nearly 82%, meaning that same
      desalination runs overwhelmingly on imported fossil fuel rather
      than the solar and wind resources the government has begun
      exploring. CO2 emissions per capita and agricultural land share,
      both fresh, are more middling. Only two of the pillar's four
      indicators are current.
    drivers:
      - "Cabo Verde's weakest pillar by a wide margin, the clearest vulnerability underneath an otherwise exceptional composite score"
      - "freshwater withdrawal nearly 60% of internal renewable resources (carried forward) -- severe, reflecting chronic water scarcity on low-rainfall, riverless volcanic islands that forces reliance on energy-intensive desalination"
      - "electricity generation nearly 82% fossil-fuel (carried forward) -- that same desalination runs overwhelmingly on imported fossil fuel rather than the solar/wind resources being explored; CO2 pc and agricultural land more middling (fresh); only 2 of 4 indicators current"
    citations: [c11, c12]
  G:
    summary: >
      Electricity access, at 98.60% of the population and freshly
      measured, is near-universal. Basic drinking water access, also
      fresh, is strong. Government Effectiveness and Control of
      Corruption, shared with Pillar A, are both strong, Control of
      Corruption (87.9) near the scale's ceiling. Social protection
      coverage, a regional-mean estimate rather than a direct
      measurement, is comparatively weak by contrast. Four of the
      pillar's five indicators are current, describing infrastructure
      access consistent with the country's own exceptional Pillar A score,
      though social protection remains the one clear structural gap.
    drivers:
      - "electricity access 98.60% of the population (fresh) -- near-universal; basic drinking water strong (fresh)"
      - "Government Effectiveness and Control of Corruption (shared with Pillar A) both strong, Control of Corruption (87.9) near the scale's ceiling"
      - "social protection comparatively weak by contrast (regional-mean estimate); 4 of 5 indicators current -- infrastructure access consistent with the country's own exceptional Pillar A score, though social protection remains a clear structural gap"
    citations: [c13]

recent:
  primary:
    - headline: "PAICV wins absolute majority, ending a decade of MpD government in a peaceful power transfer"
      date: 2026-05-17
      summary: >
        The African Party for the Independence of Cabo Verde (PAICV)
        won 37 of 72 seats in the 17 May 2026 parliamentary election,
        unseating the Movement for Democracy (MpD) after a decade in
        power. PAICV leader Francisco Carvalho was named
        prime-minister-designate. The transfer was Cape Verde's fourth
        peaceful alternation in power since the country's 1991
        multiparty transition.
      why_it_matters: >
        Directly explains Pillar A's record-setting score and confirms
        Cape Verde's status as the corpus's clearest case of
        institutionalised democratic competition, credited on the same
        terms this record applies to every other genuine achievement
        -- verified rather than assumed.
      news_url: "https://english.news.cn/africa/20260530/60c29f52a2074e21a5d4252bf3184711/c.html"
      wikipedia_url: "https://en.wikipedia.org/wiki/2026_Cape_Verdean_parliamentary_election"
      sentiment: positive
    - headline: "Cape Verde emerges as a key cocaine trans-shipment hub between South America and Europe"
      date: 2025-09-01
      summary: >
        Cape Verde's 2025 Organized Crime Index profile documents
        cocaine trafficking as an entrenched and growing criminal
        market, with the archipelago serving as a logistics and
        trans-shipment hub for South American cocaine -- particularly
        from Colombia, Peru, Brazil and Bolivia -- destined for
        Europe. Foreign criminal networks, including Brazil's Primeiro
        Comando da Capital, launder proceeds locally through Praia's
        real estate, hospitality and construction sectors.
      why_it_matters: >
        A genuine vulnerability this record does not let Cape Verde's
        otherwise exceptional governance scores obscure -- the same
        discipline this corpus applied to Seychelles' own
        heroin-addiction finding beneath a comparably strong composite
        score.
      news_url: "https://ocindex.net/assets/downloads/2025/english/ocindex_profile_cabo_verde_2025.pdf"
      wikipedia_url: ""
      sentiment: negative
    - headline: "Cape Verde reaches 99% birth registration through its Autentika digital ID platform"
      date: 2026-06-01
      summary: >
        Cape Verde reached 99% birth registration in June 2026 after
        linking civil registration and identity systems through its
        Autentika digital platform, part of a government strategy to
        digitise 60% of public services by 2026. The African
        Development Bank financed the associated TechPark CV
        innovation hub with EUR45.5 million of its EUR51.85 million
        total cost, aiming to diversify an economy still heavily
        dependent on tourism.
      why_it_matters: >
        A genuine, measurable institutional achievement, credited on
        its own terms as part of an explicit strategy to reduce
        tourism dependency rather than only announced as an
        aspiration.
      news_url: "https://techafricanews.com/2026/05/04/cape-verde-launches-national-data-and-ai-strategies-to-modernize-public-administration/"
      wikipedia_url: ""
      sentiment: positive
  extended:
    - headline: "Diaspora remittances hit a record, with Portugal-based Cape Verdeans alone sending EUR52 million in 2025"
      date: 2025-12-01
      summary: >
        Portugal-based Cape Verdeans sent a record EUR52 million home
        in 2025, a 53% increase on the prior year, part of a
        remittance flow that accounts for roughly 12% of GDP and funds
        food, school fees, medical care and housing for tens of
        thousands of families across the islands.
      why_it_matters: >
        A genuine and concrete flow of resources directly improving
        household welfare, though the same dependence on remittances
        -- like the tourism dependence documented elsewhere in this
        record -- is a structural exposure to conditions in
        destination countries this record does not treat as fully
        resolved.
      news_url: "https://theportugalpost.com/posts/cape-verdean-diaspora-sends-record-52-million-home-from-portugal-in-2025"
      wikipedia_url: ""
      sentiment: mixed
    - headline: "Chronic water scarcity deepens as Santiago Island's desalination project moves toward construction"
      date: 2025-11-01
      summary: >
        Cape Verde's low and irregular rainfall, absence of major
        rivers, and high evaporation rates continue to force reliance
        on energy-intensive desalination, powered largely by
        fossil-fuel thermal plants; a new desalination and
        water-supply project for Santiago Island, with two plants
        designed to produce a combined 15,000 cubic metres daily, is
        expected to begin construction in November 2025.
      why_it_matters: >
        The concrete, current form of the structural vulnerability
        Pillar F's own carried-forward freshwater-withdrawal figure
        already documents -- a genuine problem the government is
        actively building toward addressing, not yet resolved.
      news_url: "https://reportersonline.nl/cape-verdes-water-and-electricity-crisis-the-hidden-costs-of-development/"
      wikipedia_url: ""
      sentiment: negative

