balance:
  n_positive: 2
  n_negative: 2
  n_mixed: 1
  note: >
    The May 2026 election and the digital-governance achievement are
    kept as two distinct positives rather than merged, because they
    document different domains -- electoral competition and
    institutional service delivery -- and both are real, verified
    outcomes rather than announcements. The cocaine trans-shipment
    finding is credited at full negative weight specifically because
    it sits beneath an otherwise exceptional composite score, the same
    discipline this corpus applied to Seychelles' own heroin-addiction
    finding: a strong aggregate must never be allowed to imply that no
    severe problem exists underneath it. The remittances item is coded
    mixed rather than positive, because the same dependence that
    delivers real household welfare is also a structural exposure to
    conditions in Portugal and other destination countries, a tension
    this record does not resolve into a single verdict. The
    water-scarcity item is kept distinct from Pillar F's own prose
    because it documents a specific, dated, ongoing infrastructure
    response (the Santiago project) rather than only the underlying
    indicator.
