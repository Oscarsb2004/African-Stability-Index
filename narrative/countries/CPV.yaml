    title: "First multiparty election ends one-party rule"
    description: >
      Cape Verde held its first multiparty elections in January 1991,
      the first sub-Saharan African one-party state to do so. The
      Movement for Democracy (MpD) won, and PAICV peacefully ceded
      power.
    url: "https://en.wikipedia.org/wiki/1991_Cape_Verdean_parliamentary_election"
    direction: improve
  - year: 2026
    type: election
    title: "PAICV returns to power in a peaceful alternation"
    description: >
      PAICV won 37 of 72 seats in the 17 May 2026 parliamentary
      election, unseating an MpD government that had ruled since 2016,
      Cape Verde's fourth peaceful alternation in power since 1991.
