balance:
  n_positive: 1
  n_negative: 2
  n_mixed: 1
  note: >
    The election item and the Thiam-exclusion item are kept as two
    distinct negatives rather than merged into one, because they
    document different mechanisms of the same pattern: an election
    result, and the specific pre-election legal maneuver that shaped
    who could contest it. The Transcao cocoa plant is credited at full
    positive weight, independent of the same year's political
    controversies -- the same standard this corpus applies to
    crediting a genuine economic achievement without letting
    surrounding political conduct discount it. Gbagbo's continued
    exclusion is coded mixed rather than negative: his international
    acquittal is a real, verified fact, and this record does not
    assert that his domestic conviction was necessarily political
    rather than legitimate, only that the tension between the two
    outcomes is itself worth stating plainly.
