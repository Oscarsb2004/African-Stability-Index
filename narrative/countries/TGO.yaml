  model_used: claude-sonnet-5

historical:
  overview: >
    Germany colonized Togoland from 1884 until World War I, when
    Britain and France divided it between their own administrations
    as League of Nations mandates: French Togo in the east, British
    Togoland in the west, governed as an extension of the
    neighbouring Gold Coast. On 9 May 1956, a UN-supervised plebiscite
    asked British Togoland's residents whether to join the
    soon-to-be-independent Gold Coast or remain a trust territory
    pending French Togo's own future; 58% voted for union, and
    British Togoland became part of Ghana at Ghana's independence on
    6 March 1957 -- splitting the Ewe people, who had campaigned
    instead for a single reunified Ewe state, permanently between two
    different countries. French Togo became independent on 27 April
    1960 under President Sylvanus Olympio. On 13 January 1963,
    Olympio was assassinated outside the American embassy in Lomé by
    soldiers led by Étienne Eyadéma, a French army veteran Olympio
    had refused to enlist in Togo's own military. Eyadéma seized full
    power himself in a bloodless coup in January 1967 and ruled for
    38 years, until his death in February 2005. The military
    immediately installed his son, Faure Gnassingbé, in violation of
    the constitution; international pressure forced an election
    within two months, which Gnassingbé won and has held power ever
    since. In May 2024, Gnassingbé signed a new constitution
    converting Togo to a parliamentary system, and in May 2025 he was
    sworn in as the country's first "President of the Council of
    Ministers," a new, term-limit-free office that now holds Togo's
    real executive power.
  overview_citations: [c1, c2, c3, c5, c6]
  colonial_legacy: >
    context/colonial_history.yaml records that Germany's Togoland was
    divided between France and Britain after WWI, and that the
    Gnassingbé family has ruled since 1967 -- one of Africa's
    longest-lasting dynastic political systems. The schema entry does
    not spell out how directly that colonial partition shaped the
    country's present borders: British Togoland, administered as an
    extension of the Gold Coast rather than as its own territory, was
    never reunified with French Togo. Instead, a 1956 plebiscite --
    opposed by the Ewe-based Togoland Congress, which wanted a single
    reunified Ewe state -- attached it permanently to newly
    independent Ghana, splitting the Ewe people between two different
    post-colonial states along a line Germany, not any Togolese or
    Ghanaian community, had originally drawn. Modern Togo's western
    border with Ghana is that same colonial partition line, made
    permanent by a vote the affected population's own preferred
    outcome lost. The Gnassingbé dynasty's persistence since 1967 --
    most recently entrenched further by 2024's conversion to a
    parliamentary system -- has unfolded entirely within the smaller,
    partitioned Togo that plebiscite produced.
  colonial_legacy_citations: [c1]
  key_periods:
    - title: "Partition after WWI and the 1956 plebiscite"
      period: "1884-1957"
      summary: >
        Germany's Togoland was divided between France and Britain as
        League of Nations mandates after WWI. A UN-supervised
        plebiscite on 9 May 1956 asked British Togoland's residents
        whether to join the Gold Coast; 58% voted for union, splitting
        the Ewe people permanently between British Togoland (joining
        Ghana in 1957) and French Togo, over the Ewe-based Togoland
        Congress's own objections.
      citations: [c1]
    - title: "Independence, Olympio's assassination, and Eyadéma's coup"
      period: "1960-1967"
      summary: >
        French Togo became independent on 27 April 1960 under
        President Sylvanus Olympio. On 13 January 1963, Olympio was
        assassinated outside the American embassy in Lomé by soldiers
        led by Étienne Eyadéma. Eyadéma seized full power in a
        bloodless coup in January 1967 and began a 38-year rule.
      citations: [c2, c3]
    - title: "The Gnassingbé dynasty's succession"
      period: "2005"
      summary: >
        Eyadéma died in February 2005 after 38 years in power. The
        military immediately installed his son, Faure Gnassingbé, in
        violation of the constitution; international pressure forced
        an election within two months, which Gnassingbé won,
        beginning two decades of continuous rule.
      citations: [c3]
    - title: "The 2024 constitutional overhaul"
      period: "2024-2025"
      summary: >
        In May 2024, Gnassingbé signed a new constitution converting
        Togo from a presidential to a parliamentary system. Following
        an April 2024 parliamentary election his party won by a wide
        margin, Gnassingbé was sworn in on 3 May 2025 as the new,
        term-limit-free "President of the Council of Ministers," the
        office now holding Togo's real executive power.
      citations: [c5, c6]

pillars:
  A:
    summary: >
      All six World Governance Indicators are directly measured this
      year, and the aggregate is weak -- Government Effectiveness
      (39.7) and Voice and Accountability (45.0) are both
      particularly poor. That weakness has deepened since this
      pillar's 2023 reference year: in May 2024, President Faure
      Gnassingbé signed a new constitution converting Togo from a
      presidential to a parliamentary system, and in May 2025 he was
      sworn in as "President of the Council of Ministers" -- a new,
      term-limit-free office that now holds the executive power the
      presidency formally held, while the presidency itself became
      largely ceremonial. Opposition and international observers have
      called the change a "constitutional coup."
    drivers:
      - "all 6 WGI indicators directly measured; Government Effectiveness (39.7) and Voice and Accountability (45.0) both particularly poor"
      - "May 2024: new constitution converts Togo to a parliamentary system; May 2025: Gnassingbé sworn in as 'President of the Council of Ministers', a new term-limit-free office holding real executive power"
      - "opposition and international observers have called the change a 'constitutional coup' (see recent developments)"
    citations: [c5, c6]
  B:
    summary: >
      GDP growth, GDP per capita, inflation and domestic credit, all
      freshly measured, are comparatively decent for this corpus.
      Gini, carried forward, is comparatively strong. This pillar's
      2023 reference year understates a genuine recent acceleration:
      the economy grew 6.3% in 2025, and coffee and cocoa exports
      rose roughly 50% in the 2024-2025 season. The Port of Lomé, the
      only sub-Saharan African port ranked in Lloyd's List's global
      top 100, handled 2.06 million TEUs in 2024, up 8% -- real
      infrastructure underpinning this growth rather than a
      coincidence alongside it.
    drivers:
      - "GDP growth, GDP per capita, inflation, domestic credit all fresh, comparatively decent for this corpus; Gini comparatively strong (carried forward)"
      - "2023 reference year understates a genuine recent acceleration: economy grew 6.3% in 2025; coffee and cocoa exports rose ~50% in the 2024-2025 season"
      - "Port of Lomé, the only sub-Saharan African port in Lloyd's List's global top 100, handled 2.06M TEUs in 2024 (+8%) -- real infrastructure underpinning this growth"
    citations: [c10, c11]
  D:
    summary: >
      All five indicators are directly measured this year, and the
      aggregate is weak: life expectancy, at 62.74 years, and infant
      mortality are both comparatively poor, and handwashing-facility
      access and safely managed drinking water are similarly weak.
      Severe food insecurity, by contrast, is comparatively low for
      this corpus, closer to Mauritius than to Togo's own Sahel-belt
      neighbours. Five of the pillar's five indicators are current, a
      fully-measured pillar whose weakness is not a data-coverage
      artefact, unlike several thinner pillars elsewhere in this
      record.
    drivers:
      - "all 5 indicators directly measured; life expectancy and infant mortality both comparatively poor; handwashing access and safely managed water similarly weak"
      - "severe food insecurity comparatively low for this corpus, the pillar's one clear strength"
      - "5 of 5 indicators current -- a fully-measured pillar; the weakness is not a data-coverage artefact"
    citations: [c3]
  E:
    summary: >
      Political Stability and Rule of Law, both fresh and shared
      with Pillar A, are middling. Displaced persons, at 2.19 per
      1,000 and directly measured, is comparatively low, well below
      the region's conflict-driven averages elsewhere in this corpus.
      Intentional homicide, estimated from regional peers rather than
      measured directly, is more middling. Three of the pillar's four
      indicators are current, though this pillar's 2023 reference
      year predates the deadly crackdown on the June 2025 M66
      protests documented under recent developments, in which at
      least seven people died, including a minor, with some bodies
      recovered from lagoons.
    drivers:
      - "Political Stability and Rule of Law (shared with Pillar A) both middling, fresh"
      - "displaced persons comparatively low (fresh, directly measured); intentional homicide more middling (regional-mean estimate)"
      - "3 of 4 indicators current; 2023 reference year predates the deadly June 2025 M66 protest crackdown (see recent developments): at least 7 dead"
    citations: [c7, c8]
  F:
    summary: >
      CO2 emissions per capita, freshly measured, score comparatively
      well, but the carried-forward electricity-generation figure
      complicates a clean-energy reading: nearly 80% of Togo's own
      power still comes from fossil sources, so the low emissions
      reading reflects a small, energy-poor economy more than a
      decarbonised grid, closer to Sao Tome and Principe's
      small-economy pattern elsewhere in this corpus than to
      Lesotho's genuine hydropower case. Agricultural land share,
      also fresh, is extensive. Freshwater withdrawal, carried
      forward, is very low relative to renewable resources. Only two
      of the pillar's four indicators are current.
    drivers:
      - "CO2 pc scores comparatively well (fresh), but electricity generation nearly 80% fossil-fuel (carried forward) -- reflects a small, energy-poor economy, not a decarbonised grid"
      - "closer to STP's small-economy pattern than to LSO's genuine hydropower case elsewhere in this corpus"
      - "agricultural land extensive (fresh); freshwater withdrawal very low relative to renewable resources (carried forward); only 2 of 4 indicators current"
    citations: [c10]
  G:
    summary: >
      Electricity access, at just under 60% of the population and
      freshly measured, is thin. Basic drinking water access, also
      fresh, is similarly weak. Government Effectiveness and Control
      of Corruption, shared with Pillar A, are both poor. Social
      protection coverage, carried forward rather than fresh, is the
      pillar's weakest figure, reflecting how little of the growth
      documented in Pillar B has yet reached formal safety-net
      programmes. Four of the pillar's five indicators are current,
      describing a state whose institutional weakness (Pillar A)
      extends directly into the infrastructure it can deliver.
    drivers:
      - "electricity access just under 60% of the population (fresh) -- thin; basic drinking water similarly weak (fresh)"
      - "Government Effectiveness and Control of Corruption (shared with Pillar A) both poor; social protection the pillar's weakest figure (carried forward)"
      - "4 of 5 indicators current -- institutional weakness (Pillar A) extends directly into infrastructure delivery"
    citations: [c5]

recent:
  primary:
    - headline: "Gnassingbé becomes 'President of the Council of Ministers' under a new constitution"
      date: 2025-05-03
      summary: >
        President Faure Gnassingbé, in power since 2005, was sworn in
        on 3 May 2025 as Togo's first "President of the Council of
        Ministers" -- a new executive office created by the May 2024
        constitution that replaced Togo's presidential system with a
        parliamentary one. The role carries no term limit and was
        awarded to the leader of the National Assembly's majority
        party, while the presidency itself, now filled by Jean-Lucien
        Savi de Tové, became largely ceremonial.
      why_it_matters: >
        The Gnassingbé family has now held power continuously since
        1967; this is the corpus's most procedurally sophisticated
        entrenchment mechanism yet -- converting the entire system of
        government, rather than merely amending a term-limit clause
        -- to keep the same leader in office indefinitely.
      news_url: "https://english.news.cn/africa/20250503/3f2c407e84a542e18d5eee26597f8fbb/c.html"
      wikipedia_url: "https://en.wikipedia.org/wiki/Faure_Gnassingb%C3%A9"
      sentiment: negative
    - headline: "Deadly crackdown on protests against the constitutional overhaul"
      date: 2025-06-28
      summary: >
        The M66 Citizens' Movement organized nationwide protests on
        6, 26, 27 and 28 June 2025 against the 2024 constitutional
        overhaul, rising living costs, and the arrest of government
        critics. Security forces killed at least seven people,
        including a minor, with some bodies recovered from lagoons;
        the government later issued international arrest warrants
        for M66's exiled organizers and described the protests as
        "acts of subversion" comparable to terrorism.
      why_it_matters: >
        Directly explains Pillar E's thin, dated reading and
        demonstrates the scale of domestic opposition to the same
        constitutional change Pillar A identifies as this year's
        central governance event.
      news_url: "https://allafrica.com/stories/202507020038.html"
      wikipedia_url: "https://en.wikipedia.org/wiki/2025_Togolese_Gen_Z_protests"
      sentiment: negative
    - headline: "Coffee and cocoa exports jump 50% as the Port of Lomé cements its regional lead"
      date: 2025-09-30
      summary: >
        Togo's coffee and cocoa exports rose by roughly 50% in the
        2024-2025 marketing season -- cocoa from 11,182 to 24,000
        tonnes, coffee from 2,618 to 4,400 tonnes -- following
        government development plans to improve smallholder
        productivity and processing. The growth came alongside a
        strong year for the Port of Lomé, which handled 2.06 million
        TEUs in 2024, an 8% increase, remaining the only sub-Saharan
        African port ranked in Lloyd's List's global top 100.
      why_it_matters: >
        A genuine, verifiable economic gain credited independent of
        the political crisis unfolding the same year, and the same
        cocoa economy this record's colonial_legacy traces back to
        the German and French plantation era.
      news_url: "https://www.togofirst.com/en/agriculture/2909-17170-togo-s-coffee-and-cocoa-exports-jump-50-in-2024-2025-season"
      wikipedia_url: ""
      sentiment: positive
  extended:
    - headline: "Delayed parliamentary election hands Gnassingbé's party the majority that enabled the power shift"
      date: 2024-04-29
      summary: >
        Togo held parliamentary elections on 29 April 2024, delayed
        from December 2023 after the same National Assembly extended
        its own mandate. Gnassingbé's ruling UNIR party won a large
        majority, which the new constitution -- adopted the previous
        month -- used to select him as President of the Council of
        Ministers the following year. Opposition parties and
        observers questioned both the delay and the vote's
        competitiveness.
      why_it_matters: >
        The single election result that made the entire 2024-2025
        constitutional transition possible, illustrating how a
        parliamentary majority, not a popular presidential vote, now
        determines who holds Togo's real executive power.
      news_url: "https://www.africanews.com/2024/04/01/togo-after-public-outcry-president-gnassingbe-orders-constitutional-reform-back-to-parliam/"
      wikipedia_url: ""
      sentiment: mixed

