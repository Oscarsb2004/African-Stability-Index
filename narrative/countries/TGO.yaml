balance:
  n_positive: 1
  n_negative: 2
  n_mixed: 1
  note: >
    The constitutional-overhaul item and the protest-crackdown item
    are kept as two distinct negatives, not merged into one, because
    they document different things: the first is an institutional
    mechanism (a new, term-limit-free office), the second is a
    specific, dateable episode of lethal state violence against
    people opposing it, weeks apart and separately verifiable. The
    cocoa/coffee export growth and Port of Lomé figures are credited
    at full positive weight, independent of the political crisis
    unfolding the same year -- the same standard this corpus applies
    to crediting a genuine economic achievement without letting
    surrounding political conduct discount it. The April 2024
    parliamentary election is coded mixed rather than positive: an
    election did occur, but this record does not treat the vote that
    enabled the whole entrenchment mechanism as an achievement in its
    own right.
