balance:
  n_positive: 1
  n_negative: 2
  n_mixed: 1
  note: >
    The renewed Ethiopia-Eritrea war tension and the ongoing national-
    service crackdown are both coded negative at full weight, not
    softened by anything else in this record. The UN's 2025 health and
    nutrition findings are coded positive because they are genuine,
    UN-verified, and independently significant -- this record does not
    discount them just because Eritrea's governance record is severe;
    a closed and repressive state can still deliver real immunisation
    and nutrition outcomes, and crediting that plainly is more honest
    than either ignoring it or treating it as somehow suspect by
    association. The Bisha mining story is coded mixed rather than
    positive because its real economic growth and its documented
    forced-labour entanglement are inseparable in the reporting this
    record found -- one does not cancel the other.
