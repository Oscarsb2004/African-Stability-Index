  iso3: MWI
  name: Malawi
  last_updated: 2026-08-11
  iteration_count: 1
  next_action: >
    EXPAND: (1) follow whether the Mutharika government's
    government-to-government fuel deal (signed under Chakwera)
    actually eases the forex/fuel crisis; (2) follow whether Mutharika,
    now 85, signals any succession plan given his age; (3) follow
    whether the severe food-insecurity figure improves with fresh
    measurement; (4) check whether Pillars E/F carried-forward and
    regional-mean indicators gain fresh coverage; (5) check if Pillar
