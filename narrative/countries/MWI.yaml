balance:
  n_positive: 2
  n_negative: 1
  n_mixed: 1
  note: >
    This record leans more positive than most of this corpus's
    recent entries because the evidence genuinely supports it: two
    separate, independently verifiable removals of a sitting
    government through legitimate means (the 2020 court-ordered rerun
    and the 2025 ballot-box defeat) are each credited at full positive
    weight, not merged into one event or softened by the country's
    severe poverty documented elsewhere in this record. The
    forex/fuel crisis is coded a full negative given its direct,
    well-documented economic harm. The government-to-government fuel
    deal is coded mixed rather than positive: a genuine attempt at a
    fix, but one whose success this record cannot yet credit, since it
    depends on a different government from the one that signed it.
