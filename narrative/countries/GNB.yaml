    title: "Coup ends the planned union with Cape Verde"
    description: >
      Prime Minister Joao Bernardo Vieira toppled President Luis
      Cabral in a bloodless coup on 14 November 1980, drawing on
      tension between mainland Guinea-Bissauans and Cape Verdeans;
      Cape Verde formally separated from the planned union in January
      1981.
    url: "https://en.wikipedia.org/wiki/1980_Guinea-Bissau_coup_d'%C3%A9tat"
    direction: deteriorate
  - year: 2025
