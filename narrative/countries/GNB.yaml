    description: >
      Portugal formally recognised Guinea-Bissau's independence on 10
      September 1974, a year after the PAIGC's unilateral declaration,
      following one of Africa's most militarily successful anti-
      colonial guerrilla campaigns.
    url: "https://www.britannica.com/place/Guinea-Bissau/Independence"
    direction: improve
  - year: 1980
