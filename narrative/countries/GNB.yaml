    description: >
      Amilcar Cabral, founder of the PAIGC and leader of the joint
      liberation struggle for Guinea-Bissau and Cape Verde, was
      assassinated in Conakry on 20 January 1973, reportedly amid an
      internal rift between mainland and Cape Verdean party members,
      eight months before Guinea-Bissau's independence.
