    title: "Soldiers arrest President Embalo in the ninth post-independence coup"
    description: >
      Soldiers arrested President Umaro Sissoco Embalo on 26 November
      2025, days before official results of a disputed election were
      due, installing a military transitional government targeting
      elections on 6 December 2026.
