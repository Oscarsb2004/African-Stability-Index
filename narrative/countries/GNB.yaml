balance:
  n_positive: 1
  n_negative: 3
  n_mixed: 0
  note: >
    The coup and the ECOWAS suspension/rejection are kept as two
    distinct primary negatives rather than merged, because they
    document different actors and domains -- a domestic military
    seizure of power, and a separate, external regional-accountability
    response to it. The PAIGC exclusion is kept as a distinct extended
    negative rather than folded into the coup item, because it is the
    specific procedural mechanism that preceded and helped legitimise
    (in the junta's own telling) the coup that followed, not merely
    background to it. The cashew-harvest item is credited at full
    positive weight because it is a real, measured outcome (metric
    tonnes moved, a specific year-on-year increase) rather than only a
    stated target -- the same standard this corpus applies to crediting
    genuine achievements independent of the surrounding political
    collapse, most recently applied to DJI's renewable-energy
    achievement researched immediately prior.
