balance:
  n_positive: 1
  n_negative: 1
  n_mixed: 2
  note: >
    This record leans less severe than several of its recent
    neighbours in the corpus because the evidence genuinely supports
    it: Zambia's two peaceful electoral transfers (1991, 2021) and the
    2024 debt restructuring are real, verifiable achievements credited
    at full weight rather than softened into "mixed" by default. The
    Sino-Metals disaster is coded a full negative given its severity
    and direct harm to over half the country's water supply. The
    Lungu funeral dispute and the 13 August 2026 election are both
    coded mixed rather than forced into positive or negative: the
    former is a genuinely unresolved conflict between institutions and
    a private family, and the latter's outcome was not yet known at
    the time of this record's research -- this record states plainly
    what is and is not yet known rather than predicting a result.
