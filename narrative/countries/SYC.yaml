balance:
  n_positive: 2
  n_negative: 1
  n_mixed: 1
  note: >
    The election result and the floating solar groundbreaking are two
    independently verifiable positive developments, credited
    separately rather than merged, since they document unrelated
    domains (political transition, energy infrastructure) in the same
    period. The heroin crisis is coded a full negative rather than
    softened: Seychelles' exceptional composite score, driven largely
    by governance and economic strength, does not on its own reveal a
    public-health and security crisis of this scale, and this record
    treats naming it as more accurate than letting the country's
    overall strength imply the absence of any severe problem. The
    tourism-record item is coded mixed rather than positive: real,
    verifiable growth sits beside a genuine and unresolved
    sustainability tension for a small-island ecosystem, and this
    record does not credit growth without naming its cost.
