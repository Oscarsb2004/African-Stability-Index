balance:
  n_positive: 2
  n_negative: 1
  n_mixed: 1
  note: >
    Kenya's recent record is genuinely mixed in a way this record does
    not resolve into a single verdict: the same June 2024 event (the
    storming of Parliament) is both a story of democratic responsiveness
    -- a leaderless youth movement forcing a president to reverse fiscal
    policy -- and a story of deadly state violence, which is exactly why
    it is coded mixed rather than assigned to either extreme. The 2025
    recurrence, with people still missing as of 2026, is documented as a
    negative in its own right rather than folded into 2024's mixed
    framing, because the abductions and unresolved deaths are a distinct,
    ongoing harm. The renewable-energy achievement and the Major
    Non-NATO Ally designation are both real and substantial, and are not
    softened to make the governance story read as more uniformly
    negative than the evidence supports -- Kenya's international standing
    and its domestic accountability problems are not the same axis, and
    both are true.
