recent:
  primary:
    - headline: "Botswana Democratic Party loses power after 58 years"
      date: 2024-11-01
      summary: >
        In the 30 October 2024 general election, the ruling Botswana
        Democratic Party was reduced to just 4 of 61 directly elected
        seats, down from 38 in 2019, amid a diamond-market downturn that
        had slowed growth to a projected 1% and pushed unemployment to 27%.
        The opposition Umbrella for Democratic Change, led by Harvard-
        educated human rights lawyer Duma Boko, won 36 seats; President
        Mokgweetsi Masisi conceded within two days, saying "we got it wrong
        big time in the eyes of the people," and Boko was sworn in on 1
        November 2024.
      why_it_matters: >
        The first change of governing party since independence, and the
        clearest recent evidence behind Pillar A's high governance score.
      news_url: "https://www.aljazeera.com/news/2024/11/1/botswanas-ruling-party-loses-power-after-six-decades-early-results-show"
      wikipedia_url: "https://en.wikipedia.org/wiki/2024_Botswana_general_election"
      sentiment: positive
    - headline: "Botswana becomes first high-HIV-burden country to reach WHO gold-tier status"
      date: 2025-05-01
      summary: >
        In May 2025 Botswana became the first high-HIV-burden country, and
        the first in Africa, to achieve WHO's gold-tier certification for
        eliminating mother-to-child transmission of HIV, following the 2002
        Masa programme that made it the first country in sub-Saharan Africa
        to offer free antiretroviral therapy to all citizens. HIV
        prevalence had reached roughly 28% in the early 2000s; by 2022
        Botswana had met the UNAIDS 95-95-95 treatment targets ahead of the
        global 2030 deadline.
      why_it_matters: >
        Directly explains the life-expectancy recovery documented under
        Pillar D, from roughly 46-47 years at the epidemic's peak to over
        69 today.
      news_url: "https://www.cdc.gov/global-hiv-tb/php/success-stories/a-global-first-botswana-achieves-gold-tier-status-protecting-mothers-and-infants.html"
      wikipedia_url: ""
      sentiment: positive
    - headline: "Diamond downturn empties the Pula Fund and reshapes the De Beers partnership"
      date: 2025-02-25
      summary: >
        Facing a prolonged diamond-market downturn and competition from
        lab-grown stones, Botswana signed a renegotiated sales agreement
        with De Beers in February 2025: the state's Okavango Diamond
        Company will sell 30% of Debswana's output directly, rising to 50%
        by 2035, and Debswana's mining licences were extended 25 years. The
        deal followed the government drawing down the Pula Fund, its
        diamond-revenue sovereign wealth fund, from roughly $1.8 billion in
        2018 to about $142 million by August 2024 to cover budget deficits.
      why_it_matters: >
        A live test of whether Botswana's resource-governance model,
        credited with avoiding the commodity "resource curse," holds up
        under a sustained demand shock.
      news_url: "https://www.debeersgroup.com/about-us/case-studies/2025/strengthening-our-partnership-with-botswana"
      wikipedia_url: "https://en.wikipedia.org/wiki/Debswana"
      sentiment: mixed
  extended:
    - headline: "Botswana Court of Appeal again denies San family land access"
      date: 2022-12-01
      summary: >
        In December 2022 Botswana's Court of Appeal denied a San (Basarwa)
        family permission to bury a relative on ancestral land inside the
        Central Kalahari Game Reserve, despite a 2006 High Court ruling
        that the community's 1997-2005 evictions had been unlawful and
        unconstitutional. The government has separately cemented over the
        community's water borehole, and the family has taken the case to
        international human-rights bodies including the African Commission
        on Human and Peoples' Rights.
      why_it_matters: >
        Shows the limits of Pillar A's strong governance score: a court
        victory nearly two decades old has not translated into enforced
        land rights.
      news_url: "https://www.fairplanet.org/story/the-forced-eviction-of-botswanas-indigenous-people/"
      wikipedia_url: "https://en.wikipedia.org/wiki/Central_Kalahari_Game_Reserve"
      sentiment: negative

