historical:
  overview: >
    Britain established the Bechuanaland Protectorate in March 1885,
    primarily as a strategic buffer against Boer and German territorial
    expansion rather than for resource extraction; colonial administration
    was based across the border in South Africa (first Vryburg, then
    Mafeking) until 1965, and the territory's Tswana polities retained
    substantial internal self-governance under indirect rule. The path to
    independence was not smooth: Seretse Khama's 1948 marriage to Ruth
    Williams, a white Englishwoman, split opinion within his own Bamangwato
    people and led Britain to exile him from the territory between 1950 and
    1956 rather than risk destabilising relations with apartheid-era South
    Africa. Khama returned, renounced his claim to the Bamangwato
    chieftaincy, and led the newly formed Botswana Democratic Party to a
    landslide victory in the 1965 pre-independence election, becoming the
    country's first president at independence on 30 September 1966. The
    Botswana he inherited was desperately poor -- roughly 90% of the
    population lived in absolute poverty and literacy stood near 25% -- but
    diamond-bearing kimberlite discovered at Orapa in the 1960s, and the
    1969 formation of Debswana as an equal 50-50 joint venture between the
    government and De Beers, transformed the economy within a generation
    into one of the fastest-growing in the world. The Botswana Democratic
    Party governed continuously for 58 years, making Botswana one of
    Africa's most durable multiparty democracies, until the October 2024
    general election ended that run: amid a diamond-market downturn and
    rising unemployment, the BDP was reduced to just 4 of 61 seats, and
    opposition leader Duma Boko was sworn in as president on 1 November
    2024 -- the country's first peaceful transfer of governing power since
    independence.
  overview_citations: [c1, c2, c3, c4, c5]
  colonial_legacy: >
    context/colonial_history.yaml credits Botswana's light colonial
    footprint and preserved Tswana institutions for its post-independence
    trajectory. That framework, however, was built around exactly eight
    recognised Tswana polities: the 1899 Native Reserves Proclamation, later
    amended, demarcated tribal reserve land for the Bamangwato, Bakwena,
    Bangwaketse, Batawana, Bakgatla, Bamalete and others, with each
    reserve's paramount chief (kgosi) retaining real authority over land
    allocation under indirect rule. The San (Basarwa), whose hunter-gatherer
    land use did not map onto this Tswana-organised reserve system, were
    never allocated a reserve of their own and consequently held no land
    rights the colonial administration would recognise or enforce. That
    omission is not merely historical: it is the direct ancestor of the
    Central Kalahari Game Reserve dispute, since land the colonial state
    never formally granted the San was available for the post-independence
    government to declare a wildlife reserve in 1961 and later defend as
    state land against San habitation claims through forced relocations in
    1997, 2002 and 2005. The institutional strength most often credited to
    Botswana's colonial inheritance was built on a land-tenure framework
    that structurally excluded one community from the outset.
  colonial_legacy_citations: [c2, c14, c11]
  key_periods:
    - title: "Bechuanaland Protectorate and the road to independence"
      period: "1885-1966"
      summary: >
        Britain declared the Bechuanaland Protectorate in March 1885
        primarily to block Boer and German expansion rather than to extract
        resources; administration was based across the border in South
        Africa until 1965, and eight Tswana tribal reserves retained real
        self-governance under indirect rule. Seretse Khama's 1948 marriage
        to Ruth Williams triggered a succession crisis serious enough that
        Britain exiled him from the territory between 1950 and 1956; he
        returned, renounced his chieftaincy claim, and led the newly formed
        Botswana Democratic Party to a landslide in the 1965 pre-independence
        election, becoming the first president at independence on 30
        September 1966.
      citations: [c2, c1]
    - title: "Diamond discovery and the Debswana model"
      period: "1966-1980s"
      summary: >
        Botswana entered independence as one of the world's poorest
        countries, with roughly 90% of the population in absolute poverty.
        Diamond-bearing kimberlite discovered at Orapa in the 1960s led to
        the 1969 formation of Debswana as an equal 50-50 joint venture
        between the government and De Beers. Diamond revenue, channelled
        partly into the Pula Fund sovereign wealth fund established in
        1994, financed rapid infrastructure and human-capital investment
        and made Botswana one of the fastest-growing economies in the world
        through the 1980s.
      citations: [c3, c1, c6]
    - title: "Democratic consolidation and the HIV/AIDS crisis"
      period: "1980s-2000s"
      summary: >
        The Botswana Democratic Party governed continuously and the country
        held regular multiparty elections throughout the period without the
        interruptions common elsewhere on the continent, building one of
        Africa's most durable democratic records. That institutional
        strength coexisted with a catastrophic public health crisis: HIV
        prevalence reached roughly 28% by the early 2000s, among the
        highest ever recorded, and life expectancy collapsed to around
        46-47 years at the epidemic's peak. In 2002 Botswana became the
        first country in sub-Saharan Africa to launch a national programme
        -- Masa -- providing free antiretroviral therapy to all citizens.
      citations: [c9, c8]
    - title: "Diamond downturn and the 2024 change of government"
      period: "2022-2025"
      summary: >
        A global downturn in demand for mined diamonds, compounded by
        competition from lab-grown stones, slowed Botswana's GDP growth
        from 5.5% in 2022 to a projected 1% in 2024 and pushed unemployment
        to 27%; the Pula Fund shrank from roughly $1.8 billion in 2018 to
        about $142 million by August 2024 as the government drew on it to
        cover budget deficits. In the October 2024 general election the
        Botswana Democratic Party, in power since independence, was reduced
        to 4 of 61 seats; opposition leader Duma Boko was sworn in as
        president on 1 November 2024, and outgoing president Mokgweetsi
        Masisi conceded that "we got it wrong big time in the eyes of the
        people."
      citations: [c7, c6, c4, c5]

pillars:
  A:
    summary: >
      All six governance indicators are directly measured, and Botswana
      scores among the strongest in the index on each: Political Stability,
      Government Effectiveness, Regulatory Quality, Rule of Law, Control of
      Corruption and Voice and Accountability all place well above the
      African median, consistent with 58 years of uninterrupted multiparty
      rule that ended, without violence, in the October 2024 election. That
      election is itself the strongest recent evidence for the score: an
      incumbent party reduced to 4 of 61 seats conceded within two days and
      handed power to the opposition, the first such transfer since
      independence. The pillar's institutional strength has a documented
      limit, however: the San (Basarwa) minority has pursued a land-rights
      claim against the state since the 1990s, and despite a 2006 High
      Court ruling in their favour, a December 2022 Court of Appeal
      decision still denied a San family permission to bury a relative on
      ancestral land inside the Central Kalahari Game Reserve.
    drivers:
      - "all 6 governance indicators directly measured, among the strongest in the index"
      - "Oct 2024 election: incumbent conceded within two days after losing 90% of its seats, first transfer of power since independence"
      - "San/Basarwa land-rights dispute unresolved since the 1990s despite a 2006 court victory; Dec 2022 ruling still denied land access"
    citations: [c4, c5, c11, c12]
  B:
    summary: >
      GDP per capita (PPP) scores near the top of the index and GDP growth,
      despite a recent slowdown, still scores above the African median.
      That headline strength sits over a narrow base: diamonds account for
      roughly 80% of export revenue and about a third of government income,
      and the 2023-2025 downturn in global diamond demand, worsened by
      competition from lab-grown stones, slowed growth to a projected 1%
      for 2024 and pushed unemployment to 27%. The Pula Fund -- the
      clearest institutional evidence Botswana avoided the commodity
      "resource curse" -- shrank from roughly $1.8 billion in 2018 to about
      $142 million by August 2024 as government deficits drew it down, a
      live test of whether that institutional strength holds under
      sustained fiscal pressure. Domestic credit to the private sector
      remains thin. Gini was not measured this year.
    drivers:
      - "GDP per capita near the top of the index; growth score still above median despite the 2024 slowdown"
      - "diamonds ~80% of exports, ~1/3 of government revenue -- deep commodity concentration"
      - "Pula Fund fell from ~$1.8B (2018) to ~$142M (Aug 2024) -- a real stress test of the resource-curse-avoidance story"
      - "domestic credit to private sector thin; Gini not measured this year"
    citations: [c5, c6, c7, c3]
  D:
    summary: >
      Life expectancy above 69 years and safely managed drinking-water
      access above 63% both score well, and both are recent achievements
      rather than constants: life expectancy was roughly 46-47 years as
      recently as 2000-2001, at the peak of an HIV/AIDS epidemic that
      reached close to 28% adult prevalence, among the highest ever
      recorded. Botswana's 2002 Masa programme was the first free,
      universal antiretroviral therapy programme in sub-Saharan Africa, and
      by 2022 the country had met the UNAIDS 95-95-95 treatment targets; in
      May 2025 it became the first high-HIV-burden country to reach WHO's
      "gold tier" status for eliminating mother-to-child HIV transmission.
      Infant mortality, while improved, still scores only moderately, and
      severe food insecurity scores poorly -- affecting roughly a quarter
      of the population, consistent with the drought conditions documented
      under Pillar F. One of five indicators was not measured this year.
    drivers:
      - "life expectancy recovered from ~46-47 (2000-01, HIV peak) to 69+ today"
      - "May 2025: first high-HIV-burden country to reach WHO gold-tier status on mother-to-child transmission"
      - "infant mortality moderate; severe food insecurity poor (~26% of population), tied to drought"
    citations: [c8, c9]
  E:
    summary: >
      Political Stability and Absence of Violence, the pillar's most
      current indicator, scores among the highest in the index, consistent
      with Botswana's record of peaceful elections and the orderly 2024
      transfer of power. The rest of the pillar is less reassuring on
      closer inspection: the female intentional-homicide rate, carried
      forward rather than freshly measured, scores at the very bottom of
      the index's scale -- a striking figure this record could not further
      explain without a dedicated source and flags for the next research
      pass rather than guessing at a cause. The overall intentional-homicide
      rate is likewise carried forward, and internally displaced persons
      data is entirely absent, which is unsurprising for a country without
      active internal conflict but means this pillar's strong headline
      score rests on aging sub-indicators as much as on the current
      Political Stability figure.
    drivers:
      - "Political Stability freshly measured, among the highest in the index"
      - "female homicide rate scores at the bottom of the scale (carried-forward data) -- flagged, not yet explained"
      - "overall homicide rate carried forward; IDP data entirely absent"
    citations: [c4]
  F:
    summary: >
      Only two of four indicators were freshly measured this year.
      Botswana's electricity generation is overwhelmingly fossil-fuel
      dependent -- almost entirely coal-fired, per the carried-forward
      figure -- which is a genuine vulnerability rather than an index
      artifact: unlike the CO2-per-capita "wealth proxy" pattern documented
      elsewhere in this project (methodology/METHODOLOGY_REVIEW.md), where
      the very poorest countries score artificially well simply for lacking
      industry, Botswana's own per-capita emissions are comparatively high
      for the region, and its coal dependence is a real, current
      energy-transition risk. Agricultural land share, freshly measured, is
      moderate. Freshwater withdrawal is carried forward despite drought
      being an acute and worsening pressure: the government declared
      2022/23 a severe agricultural drought year, and while above-average
      2025 rainfall eased some conditions, it brought flooding and crop
      damage of its own.
    drivers:
      - "only 2 of 4 indicators freshly measured"
      - "electricity generation almost entirely fossil-fuel (coal) -- a genuine vulnerability, not the usual wealth-proxy artifact"
      - "freshwater withdrawal carried forward despite active, worsening drought pressure"
      - "2025 brought flooding after the 2022/23 drought -- rainfall increasingly unpredictable, not simply drier"
    citations: [c10]
  G:
    summary: >
      Electricity access at 76% and basic drinking-water access above 91%
      both score well and sit among the stronger infrastructure profiles in
      the index, consistent with decades of diamond-revenue-financed public
      investment. Handwashing-facility coverage, estimated from regional
      peers rather than measured directly, scores markedly lower, pointing
      to a gap between basic and higher-quality service delivery similar to
      the pattern documented in Pillar D's water indicators. Social
      protection and labour programme coverage was not measured this year,
      leaving a real evidence gap for a country whose 2024 election was won
      substantially on promises to expand exactly this kind of coverage --
      doubling the minimum wage and improving social services were central
      UDC campaign pledges.
    drivers:
      - "electricity access 76%, basic water access 91.7% -- both strong"
      - "handwashing coverage (regional-mean estimate) markedly weaker -- basic vs quality-of-service gap"
      - "social protection coverage unmeasured, notable given it was a central 2024 campaign issue"
    citations: [c5]

