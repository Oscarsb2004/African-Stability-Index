balance:
  n_positive: 2
  n_negative: 1
  n_mixed: 1
  note: >
    This record leans more positive than several prior countries in this
    pass, consistent with Botswana's genuinely strong composite scores
    across most pillars -- but the balance is not manufactured. The diamond
    downturn driving the 2024 election result is real and ongoing, coded
    mixed rather than positive because it combines a democratic success
    (peaceful transfer of power) with a genuine economic shock (a
    near-empty sovereign wealth fund and 27% unemployment). The San/Basarwa
    land-rights case is a decades-old, still-unresolved failure of the same
    governance institutions Pillar A scores highly, and is documented at
    full weight -- negative, not softened -- rather than folded quietly
    into the otherwise positive framing of Botswana's institutional story.
