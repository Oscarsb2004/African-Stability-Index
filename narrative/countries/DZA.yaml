balance:
  n_positive: 1
  n_negative: 1
  n_mixed: 2
  note: >
    The recent record skews toward genuine concerns rather than being forced
    even: a disputed election, continued prosecution of online political
    speech, and fiscal strain from falling hydrocarbon prices, against one
    clearly positive development (gas-export growth) and one genuinely mixed
    one (the Sansal pardon amid continued arrests). Nothing was softened to
    balance this -- Pillar F's near-zero score and Pillar A's weak Voice and
    Accountability score are the two most negative pillar readings in this
    country's record, and both are real. Structural counterweights worth
    naming even though they fall outside the "recent" window: the 2019 Hirak
    was one of the largest sustained peaceful protest movements in the
    region's recent history, and Algeria's health outcomes (Pillar D) are
    among the strongest in the index, both a reminder that hydrocarbon rents
    have bought genuine welfare gains even where they have not bought
    accountable government.
