  - year: 1960
    type: independence
    title: "Nigeria gains independence"
    description: >
      Nigeria became independent from Britain on 1 October 1960 as a
      federation of regions still shaped by the uneven indirect-rule
      system imposed after the 1914 amalgamation.
    url: "https://en.wikipedia.org/wiki/History_of_Nigeria"
