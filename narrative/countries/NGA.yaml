  - year: 1967
    type: conflict
    title: "Biafra declares independence; civil war begins"
    description: >
      The Eastern Region declared independence as Biafra in May 1967
      following anti-Igbo pogroms and a dispute over control of the
      region's oil fields; the resulting civil war killed between 500,000
      and three million people before Biafra's surrender in January 1970.
    url: "https://en.wikipedia.org/wiki/Nigerian_Civil_War"
    direction: deteriorate
  - year: 1999
