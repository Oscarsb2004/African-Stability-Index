balance:
  n_positive: 1
  n_negative: 2
  n_mixed: 1
  note: >
    Nigeria's recent record is genuinely difficult rather than balanced,
    and this record does not manufacture evenness: two of three
    recent.primary items are negative (a deepening food-insecurity crisis,
    a converging northeast/northwest security emergency) and the third is
    mixed rather than positive (Rivers State's federal emergency rule,
    resolved but still a real federalism strain). The one clear positive
    -- the Supreme Court's unanimous, seven-justice rejection of both
    opposition challenges to the 2023 election -- is real and placed at
    full weight in extended rather than primary, since it is a judicial
    event rather than the kind of ongoing development the primary slots
    are meant to track. Nigeria's institutions functioning under strain is
    a genuine, documented counterweight; it does not offset the severity
    of what the other three items describe, and this record does not
    pretend it does.
