balance:
  n_positive: 1
  n_negative: 1
  n_mixed: 2
  note: >
    The corruption protests are coded negative at full weight -- a real,
    current public-confidence crisis, not softened by the economic
    figures documented in the same period. The revenue-growth claim is
    coded positive because the underlying numbers ($612M to $825M) are
    genuine and independently verifiable, even though their political
    interpretation is contested; this record separates the fact from the
    argument about what the fact means. The War and Economic Crimes
    Court's mandate renewal and its more consultative director
    appointment are both coded mixed: each is a real institutional step
    forward, and neither has yet produced what more than two decades of
    Liberians affected by the civil wars have been waiting for -- an
    actual prosecution.
