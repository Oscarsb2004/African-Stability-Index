balance:
  n_positive: 2
  n_negative: 1
  n_mixed: 1
  note: >
    South Africa's recent record genuinely skews more positive than most
    of this corpus, and that is not softened or rebalanced to look more
    even: the 2024 election produced a real, peaceful transfer of
    governing power for the first time since 1994, and Eskom's turnaround
    is a real, sustained, independently reported infrastructure recovery.
    The one negative primary item -- the Trump administration's rupture
    with South Africa -- is documented with the same rigour applied
    throughout this project: the real costs (30% tariffs, G20 exclusion)
    are reported alongside the specific factual claim (a coordinated
    "white genocide") that independent South African crime data and two
    official inquiries do not support. This record does not treat every
    claim in that dispute as equally credible, and does not let the
    dispute's prominence overstate its place in South Africa's overall
    trajectory, which the underlying pillar scores -- among the strongest
    in this corpus outside Pillars E and F -- do not support reading as a
    country in crisis.
