      summary: >
        King Béhanzin resisted French encroachment after 1889, but
        French forces occupied the capital Abomey in November 1892
        after a two-year military campaign. Béhanzin surrendered at
        Ouidah -- the same port his kingdom's slave trade had passed
        through -- in January 1894, ending Dahomey's sovereignty.
      citations: [c1]
    - title: "Kérékou's Marxist rule and the 1990 National Conference"
      period: "1972-1991"
      summary: >
        Mathieu Kérékou seized power in a 1972 coup and declared
        Marxism-Leninism the state ideology in 1974. Economic collapse
        and popular protest forced him to convene a National
        Conference in February 1990, the first of its kind in Africa,
        which stripped him of most power and set a template other
        Francophone African states soon copied. Kérékou lost the March
        1991 election and left office peacefully.
