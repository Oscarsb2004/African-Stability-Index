historical:
  overview: >
    The Kingdom of Dahomey, centred on Abomey, was itself a major
    participant in the transatlantic slave trade for over two
    centuries, exporting captives through the port of Ouidah in
    exchange for firearms that fuelled further wars of capture; King
    Gezo accepted a British-imposed treaty ending the trade only in
    1852. Dahomey's army included the Agojie, an elite corps of
    thousands of women soldiers Europeans called the "Dahomey
    Amazons." King Béhanzin resisted French encroachment after 1889,
    but French forces occupied the capital Abomey in November 1892,
    and Béhanzin surrendered at Ouidah -- the same port his kingdom's
    slave trade had passed through -- in January 1894. Benin gained
    independence from France in 1960 and endured a decade of coups
    before Mathieu Kérékou seized power in 1972 and declared
    Marxism-Leninism the state ideology in 1974, renaming the country
    the People's Republic of Benin. Economic collapse and popular
    protest forced Kérékou to convene a National Conference in
    February 1990, the first of its kind in Africa, which stripped him
    of most power and set a template other Francophone African states
    soon copied for their own transitions. Kérékou lost the 1991
    election and left office peacefully, then won back the presidency
    democratically in 1996, serving two further terms. Patrice Talon,
    a cotton-industry businessman, became president in 2016 and, after
    surviving a foiled coup attempt in December 2025, honoured Benin's
    two-term limit and stepped down in May 2026 -- succeeded by his own
    finance minister, Romuald Wadagni, who won an April 2026 election
    the main opposition party was unable to contest at all.
  overview_citations: [c1, c3, c4, c5, c7]
  colonial_legacy: >
    context/colonial_history.yaml already states plainly what many
    colonial-history entries in this corpus soften: the Kingdom of
    Dahomey was itself a major participant in the slave trade before
    French conquest, not simply a victim of it, and French rule then
    reorganised the same coercive labour patterns through forced
    porterage and taxation rather than introducing them. The schema
    entry also names the Dahomey Gap -- a savanna corridor breaking
    the West African forest belt -- as a specific geographic reason
    this stretch of coast was among the most heavily raided for
    Atlantic slave exports: the gap gave both African and European
    traders easier access inland than the dense forest covering
    neighbouring coastlines did. That two-sided history is worth
    stating honestly rather than resolving into either a simple victim
    or simple perpetrator narrative: Dahomey's kings profited from and
    organised the trade using an army built partly around it, and
    French conquest in 1894 ended Dahomey's sovereignty specifically by
    defeating the same state that trade had helped make militarily
    powerful in the first place.
  colonial_legacy_citations: [c1]
