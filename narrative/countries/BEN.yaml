balance:
  n_positive: 1
  n_negative: 2
  n_mixed: 1
  note: >
    The coup-attempt item and the January 2026 legislative-exclusion
    item are kept as two distinct negatives rather than merged into
    one, because they document different mechanisms of institutional
    strain within the same transition period -- one violent and
    reversed within hours, one procedural and sustained across two
    separate votes. The Cotonou port growth is credited at full
    positive weight, independent of the political turbulence
    documented alongside it -- the same standard this corpus applies to
    crediting a genuine economic achievement without letting
    surrounding political conduct discount it. Talon's own handover is
    coded mixed rather than negative or positive: this record credits
    his genuine adherence to the two-term limit he strengthened, a real
    and comparatively rare choice among regional peers, without
    letting that choice imply the resulting election was itself
    competitive.
