pillars:
  A:
    summary: >
      All six World Governance Indicators are directly measured this
      year, and the aggregate is moderate -- Regulatory Quality (63.2)
      and Political Stability (63.2) are the least weak, Rule of Law
      (59.9) the most severe. That moderate reading understates a
      genuine current test: on 7 December 2025, soldiers briefly
      announced they had overthrown President Patrice Talon before
      loyalist forces, backed by Nigerian air power and French special
      forces, restored control within hours, and Talon himself stepped
      down on schedule the following May after two constitutionally
      limited terms -- succeeded, however, by his own finance minister
      in an election opposition parties were structurally excluded
      from.
    drivers:
      - "all 6 WGI indicators directly measured; Regulatory Quality (63.2) and Political Stability (63.2) the least weak, Rule of Law (59.9) the most severe"
      - "7 Dec 2025: a coup attempt against Talon was foiled within hours by loyalist forces backed by Nigerian air power and French special forces"
      - "Talon stepped down on schedule in May 2026 after two terms -- succeeded by his own finance minister in an election opposition parties were structurally excluded from (see recent developments)"
    citations: [c5, c7]
  B:
    summary: >
      GDP growth, GDP per capita, inflation and domestic credit, all
      freshly measured, are comparatively decent for this corpus --
      GDP growth (64.9) is comparatively strong. Gini, carried
      forward, is comparatively strong too. This pillar's 2023
      reference year understates continued acceleration: the
      Autonomous Port of Cotonou handled 6.7 million tonnes of cargo
      in the first half of 2025 alone, a 63% increase over the same
      period in 2024, cementing Benin's role as a regional logistics
      hub for landlocked neighbours including Niger and Burkina Faso.
    drivers:
      - "GDP growth, GDP per capita, inflation, domestic credit all fresh, comparatively decent for this corpus; GDP growth (64.9) comparatively strong"
      - "Gini comparatively strong (carried forward)"
      - "2023 reference year understates continued acceleration: Port of Cotonou handled 6.7M tonnes in H1 2025 alone, a 63% increase over H1 2024"
    citations: [c10]
  D:
    summary: >
      All five indicators are directly measured this year, and the
      aggregate is Benin's weakest pillar: handwashing-facility
      access, at just 12.39% of the population, is among the lowest
      recorded anywhere in this corpus. Life expectancy and infant
      mortality are both comparatively poor. Severe food insecurity
      and safely managed drinking water are similarly weak. Five of
      the pillar's five indicators are current, a fully-measured
      pillar whose weakness is not a data-coverage artefact, sitting
      awkwardly beside Pillar B's comparatively strong economic growth
      and the port expansion documented under recent developments.
    drivers:
      - "all 5 indicators directly measured; handwashing-facility access just 12.39% of the population -- among the lowest recorded anywhere in this corpus"
      - "life expectancy and infant mortality both comparatively poor; severe food insecurity and safely managed drinking water similarly weak"
      - "5 of 5 indicators current -- Benin's weakest pillar, and the weakness is not a data-coverage artefact"
    citations: [panel]
  E:
    summary: >
      Displaced persons, at 0.62 per 1,000 and directly measured, is
      among the lowest recorded anywhere in this corpus, a sharp
      contrast with several coastal and Sahel-belt neighbours. Political
      Stability and Rule of Law, both fresh and shared with Pillar A,
      are comparatively decent. Intentional homicide, estimated from
      regional peers rather than measured directly, is more middling.
      Three of the pillar's four indicators are current, though none
      of them capture the December 2025 coup attempt documented under
      recent developments, since this pillar's 2023 reference year
      predates it.
    drivers:
      - "displaced persons 0.62/1,000 (fresh, directly measured) -- among the lowest recorded anywhere in this corpus"
      - "Political Stability and Rule of Law (shared with Pillar A) both comparatively decent, fresh"
      - "intentional homicide more middling (regional-mean estimate); 3 of 4 indicators current, though none capture the December 2025 coup attempt (see recent developments)"
    citations: [c5]
  F:
    summary: >
      Electricity generation from fossil sources, carried forward at
      96.60%, is severe and Benin's weakest single reading -- among
      the most fossil-dependent electricity mixes recorded anywhere in
      this corpus. CO2 emissions per capita, freshly measured, are
      comparatively low, though this reflects overall energy poverty
      as much as any clean-energy achievement, since electricity
      access itself reaches barely over half the population.
      Freshwater withdrawal, also carried forward, is very low
      relative to renewable resources. Agricultural land share, fresh,
      is more middling. Only two of the pillar's four indicators are
      current.
    drivers:
      - "electricity generation 96.60% fossil-fuel (carried forward) -- Benin's weakest single reading, among the most fossil-dependent electricity mixes recorded anywhere in this corpus"
      - "CO2 pc comparatively low (fresh), but reflects energy poverty as much as achievement -- electricity access (Pillar G) reaches barely over half the population"
      - "freshwater withdrawal very low relative to renewable resources (carried forward); agricultural land more middling (fresh); only 2 of 4 indicators current"
    citations: [c10]
  G:
    summary: >
      Electricity access, at 57% of the population and freshly
      measured, is moderate. Basic drinking water access, also fresh,
      is comparatively decent. Government Effectiveness and Control of
      Corruption, shared with Pillar A, are middling. Social
      protection coverage, carried forward, is severe -- among the
      lowest recorded anywhere in this corpus. Four of the pillar's
      five indicators are current, describing infrastructure access
      that has not kept pace with the port-driven economic growth
      documented in Pillar B, nor with Pillar A's comparatively decent
      governance scores.
    drivers:
      - "electricity access 57% of the population (fresh) -- moderate; basic drinking water comparatively decent (fresh)"
      - "Government Effectiveness and Control of Corruption (shared with Pillar A) middling; social protection severe (carried forward) -- among the lowest recorded anywhere in this corpus"
      - "4 of 5 indicators current -- infrastructure access has not kept pace with the port-driven economic growth documented in Pillar B"
    citations: [panel]

recent:
  primary:
    - headline: "Soldiers briefly announce Talon's overthrow before loyalist forces regain control"
      date: 2025-12-07
      summary: >
        Soldiers led by Lieutenant Colonel Pascal Tigri announced on
        national television on 7 December 2025 that they had
        overthrown President Patrice Talon, following an attack on his
        Cotonou residence. Loyalist forces, backed by the Nigerian air
        force and French special forces, restored control within
        hours; the government requested and received an ECOWAS
        Standby Force deployment, and around 30 people, mostly
        soldiers, were jailed in connection with the plot by
        mid-December.
      why_it_matters: >
        Directly explains Pillar A's severity and Pillar E's thin
        coverage of a genuinely current threat, and demonstrates that
        even Benin's comparatively stable governance record faced a
        real, near-successful challenge just months before a scheduled
        transfer of power.
      news_url: "https://www.france24.com/en/africa/20251216-benin-jails-30-people-with-links-to-thwarted-coup-attempt-legal-sources-say"
      wikipedia_url: "https://en.wikipedia.org/wiki/2025_Beninese_coup_attempt"
      sentiment: negative
    - headline: "Talon steps down on schedule, but his handpicked successor wins 94% in an election with no real opposition"
      date: 2026-04-13
      summary: >
        President Patrice Talon honoured Benin's two-term
        constitutional limit and stepped down on 24 May 2026, having
        repeatedly ruled out amending the constitution to extend his
        rule -- a notable departure from several regional peers. His
        finance minister and chosen successor, Romuald Wadagni, won
        the 12 April 2026 presidential election with more than 94% of
        the vote after the main opposition party, the Democrats,
        failed to gather enough signatures to field a candidate at
        all, following its own complete loss of parliamentary seats in
        a January 2026 vote. International observers characterised the
        contest as neither free nor fair.
      why_it_matters: >
        A genuine two-sided outcome: Talon respected the term limit he
        himself had strengthened, avoiding the entrenchment pattern
        documented elsewhere in this corpus (TGO, CMR, GAB), but the
        succession delivered continuity of power to his own ally
        rather than a genuine political alternation, since no credible
        opposition candidate was ever able to compete.
      news_url: "https://www.aljazeera.com/news/2026/4/13/government-candidate-wadagni-on-course-to-win-benin-presidential-vote"
      wikipedia_url: "https://en.wikipedia.org/wiki/2026_Beninese_presidential_election"
      sentiment: mixed
    - headline: "Port of Cotonou cargo volume jumps 63% in the first half of 2025"
      date: 2025-07-01
      summary: >
        The Autonomous Port of Cotonou handled 6.7 million tonnes of
        cargo between January and June 2025, a 63% increase over the
        same period in 2024, reinforcing Benin's role as a regional
        logistics hub for landlocked neighbours including Niger and
        Burkina Faso, both already documented in this corpus.
      why_it_matters: >
        A concrete, verifiable economic achievement credited
        independent of the political turbulence documented alongside
        it, and a modern echo of the same coastal-access role Ouidah
        once played in the transatlantic economy this record's
        colonial_legacy documents.
      news_url: "https://www.ecofinagency.com/news-infrastructures/1409-48662-benin-cotonou-port-handles-6-7-million-tons-in-h1-2025-despite-q2-slowdown"
      wikipedia_url: ""
      sentiment: positive
  extended:
    - headline: "Opposition loses every parliamentary seat in January 2026 legislative election"
      date: 2026-01-18
      summary: >
        Benin's governing coalition won every seat in the National
        Assembly in a January 2026 legislative election, after the
        main opposition party, the Democrats, failed to clear the 20%
        national vote-share threshold required to enter parliament at
        all. Voter turnout was itself modest, reflecting a
        widely-shared sense among observers that the outcome was not
        genuinely in doubt.
      why_it_matters: >
        The direct precursor to the presidential election's own
        opposition exclusion three months later, showing the pattern
        was structural and sustained rather than a single election's
        anomaly, and leaving the incoming government facing no
        organised opposition in either chamber of government.
      news_url: "https://www.aljazeera.com/news/2026/1/18/benin-opposition-loses-all-parliamentary-seats-provisional-results-show"
      wikipedia_url: ""
      sentiment: negative

