balance:
  n_positive: 2
  n_negative: 1
  n_mixed: 1
  note: >
    This record leans positive deliberately, not by omission: The
    Gambia has the strongest governance pillar and one of the only
    positively-signed Political Stability readings recorded anywhere in
    this corpus, and the January 2026 domestic Junglers trial is a
    genuine, hard-won accountability milestone credited at full weight.
    The TRRC implementation gap is coded negative at full weight rather
    than softened by that same recovery -- roughly 60 of 304
    recommendations completed after four years is a real and current
    failure, not merely a footnote to an otherwise positive story.
    Barrow's broken transitional-term promise and outreach to Jammeh's
    old party are coded mixed: a real democratic continuity (he won a
    genuine, contested election) alongside a real erosion of the
    principle that got him elected in the first place.
