balance:
  n_positive: 1
  n_negative: 2
  n_mixed: 1
  note: >
    The June 2021 crackdown-accountability item and the 2023
    no-parties-permitted election are kept as two distinct negatives
    rather than merged into one, because they document different
    things: a specific episode of lethal state violence and its
    continuing impunity, and the permanent structural mechanism that
    excludes any electoral path to change the government at all. The
    HIV treatment achievement is credited at full positive weight,
    independent of the severe governance record documented elsewhere
    in this record -- the same standard this corpus applies to
    crediting a genuine public-health achievement without letting
    surrounding political conduct discount it. The sugar-revenue item
    is coded mixed rather than positive: real export growth sits
    beside a fiscal deficit that widened more than fivefold in the
    same period, and this record credits neither in isolation.
