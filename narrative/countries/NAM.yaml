balance:
  n_positive: 1
  n_negative: 1
  n_mixed: 2
  note: >
    Nandi-Ndaitwah's election is coded positive at full weight -- a
    genuine, competitive democratic milestone, decided in court rather
    than around it. The unresolved High Court reparations lawsuit is
    coded negative, not softened by Namibia's otherwise strong
    governance scores: it is a real, ongoing, multi-year failure to
    resolve a documented historical wrong, and this record states that
    plainly rather than treating Germany's 2021 recognition as closure.
    The RWE withdrawal and the green-industrialisation target are both
    coded mixed: the former is a genuine setback that does not erase
    Namibia's other real economic strengths, and the latter is a real
    government commitment that does not yet have a delivered outcome to
    point to.
