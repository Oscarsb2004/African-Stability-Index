balance:
  n_positive: 1
  n_negative: 1
  n_mixed: 2
  note: >
    The 2025 election result is coded negative rather than mixed: a
    coup leader winning 90.35% of the vote, in an election shaped by a
    constitution his own transitional government wrote to exclude his
    predecessor, does not meet this record's bar for a credited
    democratic gain, however formally civilian the outcome. The Bongo
    family's exile and in-absentia conviction is coded mixed because
    it genuinely contains both: a peaceful resolution avoiding further
    violence, and a due-process shortfall this record states plainly
    rather than treats as settled. The rainforest valuation is credited
    at full positive weight, independent of the political transition
    documented alongside it -- the same standard this corpus applies to
    crediting a genuine environmental achievement without letting
    surrounding political conduct discount it.
