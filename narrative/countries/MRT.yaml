balance:
  n_positive: 1
  n_negative: 2
  n_mixed: 1
  note: >
    The continued-slavery finding and the migration-crackdown abuses
    are both coded negative at full weight, not softened by the genuine
    gas-revenue and electoral-competitiveness stories placed alongside
    them. Greater Tortue Ahmeyim is coded positive because it is a real,
    verified, substantial new revenue stream, independent of whether
    that revenue is equitably distributed -- a question this record
    does not yet have data to answer. The 2024 election is coded mixed
    rather than positive or negative: Abeid's strong showing is a real,
    unforced sign of political opening, and his fraud allegation is
    real and unresolved; this record states both without adjudicating
    between them.
