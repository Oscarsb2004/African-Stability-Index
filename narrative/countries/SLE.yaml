balance:
  n_positive: 1
  n_negative: 2
  n_mixed: 1
  note: >
    The November 2023 attack and the repeated flooding are both coded
    negative at full weight, not softened by the genuine positives
    documented alongside them. Bio's ECOWAS chairmanship is coded
    positive because it is a real, substantial diplomatic achievement,
    credited independent of the domestic governance concerns raised
    elsewhere in this record -- the same standard this corpus applies
    to crediting a genuine gain without erasing a genuine problem. Feed
    Salone is coded mixed rather than positive because the investment
    is real but the crisis it targets remains genuinely severe and
    ongoing; this record does not yet have evidence the programme has
    resolved what it set out to address.
