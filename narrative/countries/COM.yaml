balance:
  n_positive: 1
  n_negative: 2
  n_mixed: 1
  note: >
    Azali's consolidated fourth term and Cyclone Chido's exposure of the
    Mayotte migration entanglement are both coded negative at full
    weight, not softened by the genuine solar-energy achievement placed
    alongside them. The solar plant is coded positive because it is a
    real, substantial, verifiable step toward reducing the 100%
    fossil-fuel electricity generation documented in Pillar F,
    independent of the severe governance record documented in Pillar A
    -- the same standard this corpus applies elsewhere (NAM's Noor-style
    reasoning, ZWE's ZiG currency) to crediting a real achievement
    without letting political severity discount it. The vanilla/clove
    crisis and the government's consultative response are coded mixed:
    the crisis is real and current, and the response is a genuine
    institutional step whose actual effectiveness this record does not
    yet have evidence to judge either way.
