balance:
  n_positive: 1
  n_negative: 2
  n_mixed: 1
  note: >
    The ECOWAS withdrawal and the JNIM fuel blockade are each
    independently severe and current, directly explaining Pillars A and
    E's weak scores, and neither is softened here. The one positive item
    -- Goulamina, Mali's first lithium mine, shipping its first exports
    in June 2025 -- was not obvious on first pass; the initial draft of
    this record had no positive item at all until a further search
    surfaced it, consistent with this project's practice of searching
    again before accepting an all-negative record rather than treating a
    country's overall severity as a reason to stop looking. It also
    resolved a genuine puzzle this record had flagged: Pillar D's
    near-ceiling severe-food-insecurity score, which initially seemed
    hard to reconcile with Pillar E's near-bottom security score, is
    plausibly explained by the same strong 2025 harvest that helped drive
    the lithium-adjacent growth figures in Pillar B. The Barrick Gold
    settlement is coded mixed rather than positive, because a $430
    million payment secured through employee detentions and a CEO arrest
    warrant is a real fiscal win for a government under severe strain,
    but not an unambiguous governance achievement -- documented as what
    it is, a coercive renegotiation with a real financial outcome, not
    framed as either a triumph or purely as extortion.
