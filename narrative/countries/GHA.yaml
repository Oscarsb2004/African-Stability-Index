balance:
  n_positive: 2
  n_negative: 1
  n_mixed: 1
  note: >
    The recent record includes a genuine, unresolved setback (the galamsey
    environmental crisis, the main driver of the index's weak Environmental
    pillar) alongside genuine achievements: a peaceful, decisive election
    with a historic first female vice-president, and a December 2025
    government restriction on forest-reserve mining. The completed
    Eurobond restructuring is coded mixed rather than positive because it
    represents recovery from a 2022 default, not the absence of a crisis.
    Nothing was omitted to force this balance -- it is the mix found in
    reporting from late 2024 through early 2026. Ghana's uninterrupted
    democratic alternation since 1992 (see historical.key_periods) is a
    further structural counterweight that falls outside the "recent" window
    but belongs in the honest picture.
