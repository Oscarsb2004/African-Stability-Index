balance:
  n_positive: 1
  n_negative: 3
  n_mixed: 0
  note: >
    The election result and the debt crisis are kept as two distinct
    primary negatives rather than merged, because they document
    different domains -- a fraudulent, unbroken political entrenchment,
    and a separate, severe fiscal crisis rooted in oil dependency
    rather than governance conduct specifically. The disputed-turnout
    item is kept as a distinct extended entry rather than folded into
    the election item itself, because it is a specific, independently
    documented statistical anomaly (67.57% to 84.99% despite a boycott
    and visibly empty polling stations), not merely restating the
    result. The TotalEnergies investment is credited at full positive
    weight because it is a real, concrete commitment, not merely an
    announcement -- the same standard this corpus applies to crediting
    genuine achievements independent of the surrounding political and
    fiscal conduct, even though it reinforces rather than resolves the
    oil dependency Pillar B's own weak growth score documents.
