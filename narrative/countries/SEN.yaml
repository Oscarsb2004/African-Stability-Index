balance:
  n_positive: 1
  n_negative: 2
  n_mixed: 1
  note: >
    The 2024 election-crisis-resolution item is credited at full
    positive weight because the evidence genuinely supports it: a
    leader's attempt to postpone an election was reversed entirely
    through domestic courts and civic pressure, and the opposition
    candidate who benefited took office peacefully. The hidden-debt
    scandal and the Faye-Sonko split are kept as two distinct
    negatives rather than merged into one, because they document
    different things at different times -- a discovery about the
    previous government, and a rupture within the current one. The
    Sangomar oil boom is coded mixed rather than positive: the
    production success is real, but this record does not credit
    revenue management achievements the same government has not yet
    demonstrated, given the hidden-debt scandal documented in the same
    period.
