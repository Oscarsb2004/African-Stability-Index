        Senghor.
      citations: [c1, c2]
    - title: "Senghor's voluntary resignation and the Diouf-Wade transition"
      period: "1980-2000"
      summary: >
        Senghor voluntarily resigned on 31 December 1980, a rarity
        among African leaders, transferring power to his chosen
        successor Abdou Diouf. In 2000, Diouf lost a free and fair
        election to opposition leader Abdoulaye Wade, Senegal's second
        peaceful transfer of power and its first between parties.
      citations: [c3]
    - title: "Sall's third-term ambiguity and the Sonko crisis"
      period: "2012-2023"
      summary: >
        Macky Sall defeated Wade's own controversial third-term bid in
        2012, then spent his final years facing the same accusation:
        sustained ambiguity over a third term of his own, met by mass
        protests, the 2021 and 2023 arrests of opposition leader
        Ousmane Sonko, and dozens of deaths.
      citations: [c4]
    - title: "The 2024 constitutional crisis and Faye's election"
      period: "2024"
      summary: >
        President Sall abruptly postponed the scheduled 25 February
        2024 election and moved to extend his own term; Senegal's
        Constitutional Council overturned the move on 15 February, and
        Sall complied. Bassirou Diomaye Faye, released from prison
        under a political amnesty, won the rescheduled election on 24
        March 2024 and was sworn in as Africa's youngest elected
        president.
      citations: [c5, c6, c7]

pillars:
  A:
    summary: >
      All six World Governance Indicators are directly measured this
      year, and the aggregate is comparatively strong for this corpus, though third of Senegal's six scored pillars -- Government
      Effectiveness (71.7) and Voice and Accountability (70.7) are
      both comparatively high. That strength reflects a democracy
      tested severely and repeatedly since this pillar's 2023
      reference year: President Macky Sall's ambiguity over a third
      term, and his brief February 2024 attempt to postpone the
      election outright, produced the corpus's sharpest recent test of
      institutional resilience -- one Senegal's Constitutional Council
      and its citizens ultimately won, documented in full under recent
      developments.
    drivers:
      - "all 6 WGI indicators directly measured; Government Effectiveness (71.7) and Voice and Accountability (70.7) both comparatively high -- comparatively strong for this corpus, though third of six here"
      - "2023 reference year predates the corpus's sharpest recent institutional-resilience test: Sall's Feb 2024 attempt to postpone the election outright"
      - "the Constitutional Council overturned the postponement and the election proceeded (see recent developments) -- though the reform government it produced has since fractured (also recent developments)"
    citations: [c5, c7]
  B:
    summary: >
      GDP growth, GDP per capita, inflation and domestic credit, all
      freshly measured, are comparatively decent for this corpus.
      Gini, carried forward, is comparatively strong. This pillar's
      2023 reference year predates both a genuine boom and a genuine
      crisis documented under recent developments: Senegal's Sangomar
      offshore oil field, which began production in 2024, helped drive
      7.8% GDP growth in 2025, even as an official audit found the
      previous government had concealed billions of dollars in debt,
      pushing the real public debt burden above 130% of GDP.
    drivers:
      - "GDP growth, GDP per capita, inflation, domestic credit all fresh, comparatively decent for this corpus; Gini comparatively strong (carried forward)"
      - "2023 reference year predates a genuine boom: Sangomar offshore oil field (began production 2024) helped drive 7.8% GDP growth in 2025"
      - "also predates a genuine crisis: an official audit found the previous government concealed billions in debt, pushing real public debt above 130% of GDP (see recent developments)"
    citations: [c12, c8]
  D:
    summary: >
      All five indicators are directly measured this year, and the aggregate is comparatively strong in absolute terms, though only fifth of Senegal's six scored pillars: severe food
      insecurity, at just 4.00% of the population, is among the lowest
      recorded anywhere in this corpus. Life expectancy and infant
      mortality are both comparatively decent. Handwashing-facility
      access and safely managed drinking water are more middling,
      leaving room for improvement even in an otherwise comparatively strong pillar. Five of the pillar's five indicators
      are current, a fully-measured pillar consistent with Senegal's
      reliable-tier composite score overall.
    drivers:
      - "all 5 indicators directly measured; severe food insecurity just 4.00% of the population -- among the lowest recorded anywhere in this corpus"
      - "life expectancy and infant mortality both comparatively decent; handwashing access and safely managed water more middling"
      - "5 of 5 indicators current -- a fully-measured pillar consistent with Senegal's reliable-tier composite score"
    citations: [c1]
  E:
    summary: >
      Displaced persons, at 0.46 per 1,000 and directly measured, is
      among the lowest recorded anywhere in this corpus, a sharp
      contrast with several West African neighbours documented
      elsewhere in this corpus. Political Stability and Rule of Law,
      both fresh and shared with Pillar A, are comparatively strong.
      Intentional homicide, estimated from regional peers rather than
      measured directly, is more middling. Three of the pillar's four
      indicators are current, a comparatively strong and comparatively
      well-measured pillar even after the political turbulence
      documented under recent developments.
    drivers:
      - "displaced persons 0.46/1,000 (fresh, directly measured) -- among the lowest recorded anywhere in this corpus"
      - "Political Stability and Rule of Law (shared with Pillar A) both comparatively strong, fresh"
      - "intentional homicide more middling (regional-mean estimate); 3 of 4 indicators current -- comparatively strong even after the political turbulence documented under recent developments"
    citations: [c5]
  F:
    summary: >
      Electricity generation from fossil sources, freshly measured at
      86.03%, is Senegal's weakest reading and, unlike some
      wealth-proxy cases elsewhere in this corpus, a directly current
      rather than carried-forward figure -- Senegal's own power still
      runs almost entirely on imported and domestic fossil fuel even
      as its new Sangomar and Greater Tortue Ahmeyim offshore fields,
      documented in Pillar B, primarily export rather than power the
      domestic grid. CO2 emissions per capita, also fresh, are more
      middling. Freshwater withdrawal, carried forward, is
      comparatively high. Agricultural land share, fresh, is more
      middling. Three of the pillar's four indicators are current.
    drivers:
      - "electricity generation 86.03% fossil-fuel (fresh, not carried forward) -- Senegal's weakest reading; the new Sangomar/GTA offshore fields (Pillar B) primarily export rather than power the domestic grid"
      - "CO2 pc more middling (fresh); freshwater withdrawal comparatively high (carried forward)"
      - "agricultural land more middling (fresh); 3 of 4 indicators current"
    citations: [c12]
  G:
    summary: >
      Electricity access, at 74% of the population and freshly
      measured, is comparatively decent for this corpus. Basic
      drinking water access, also fresh, is comparatively strong.
      Government Effectiveness and Control of Corruption, shared with
      Pillar A, are both comparatively high. Social protection
      coverage, the pillar's only carried-forward figure, is more
      middling, an area future EXPAND passes should watch for fresh
      measurement. Four of the pillar's five indicators are current,
      describing infrastructure access that has kept pace with Pillar
      A's comparatively strong governance.
    drivers:
      - "electricity access 74% of the population (fresh) -- comparatively decent for this corpus; basic drinking water comparatively strong (fresh)"
      - "Government Effectiveness and Control of Corruption (shared with Pillar A) both comparatively high; social protection the pillar's only carried-forward figure, more middling"
      - "4 of 5 indicators current -- infrastructure access has kept pace with Pillar A's comparatively strong governance"
    citations: [c1]

recent:
  primary:
    - headline: "Constitutional Council overturns Sall's election postponement; Faye rises from prison to presidency in 20 days"
      date: 2024-03-24
      summary: >
        President Macky Sall's 3 February 2024 attempt to postpone the
        presidential election and extend his own term to December 2024
        triggered mass protests and international condemnation;
        Senegal's Constitutional Council ruled the postponement
        unconstitutional on 15 February, and Sall complied. Bassirou
        Diomaye Faye, released from prison on 14 March along with his
        mentor Ousmane Sonko under a political amnesty, won the
        rescheduled 24 March election in the first round with 54.3% of
        the vote and was sworn in on 2 April 2024 as Africa's youngest
        elected president, just 20 days after his release.
      why_it_matters: >
        The sharpest test yet of Senegal's democratic institutions in
        this corpus's West Africa records, and the rare case where a
        leader's attempt to entrench power was reversed entirely
        through domestic legal and civic pressure rather than a coup
        or foreign intervention.
      news_url: "https://www.aljazeera.com/features/2024/4/2/from-prisoner-to-president-in-20-days-senegals-diomaye-faye-takes-office"
      wikipedia_url: "https://en.wikipedia.org/wiki/Bassirou_Diomaye_Faye"
      sentiment: positive
    - headline: "Audit reveals the previous government concealed billions in debt"
      date: 2024-09-01
      summary: >
        An audit ordered by President Faye and announced in September
        2024 found the Sall government had concealed roughly $7-13
        billion in public debt, pushing Senegal's real debt burden
        above 130% of GDP -- nearly double what had been officially
        reported. An IMF delegation confirmed the findings in March
        2025, with IMF official Edward Gemayel stating there had been
        "a very deliberate decision to underreport the debt during the
        preceding years."
      why_it_matters: >
        A direct vindication of the reform mandate Faye was elected
        on, but also the source of a fiscal crisis serious enough to
        eventually fracture his own governing coalition, documented in
        the next item.
      news_url: "https://en.wikipedia.org/wiki/Senegal_hidden_debt_scandal"
      wikipedia_url: ""
      sentiment: negative
    - headline: "Faye fires Sonko as prime minister after months of tension over the debt crisis"
      date: 2026-05-22
      summary: >
        President Faye dismissed Prime Minister Ousmane Sonko -- his
        own political mentor, who had endorsed his 2024 candidacy --
        and dissolved the government on 22 May 2026, after months of
        rising tension over how to handle the debt crisis. Sonko's own
        PASTEF party responded by having him elected speaker of
        parliament days later, and announced it would not join Faye's
        new government, led by economist Ahmadou Al Aminou Lo.
      why_it_matters: >
        A genuine fracture within the same reform movement this record
        credits for Senegal's 2024 democratic resilience, raising real
        questions about the coalition's durability just over two years
        after taking power.
      news_url: "https://www.aljazeera.com/news/2026/5/23/senegals-president-faye-sacks-pm-sonko-and-dissolves-government"
      wikipedia_url: "https://en.wikipedia.org/wiki/Ousmane_Sonko"
      sentiment: negative
  extended:
    - headline: "Sangomar oil field delivers a bumper first full year of production"
      date: 2026-01-12
      summary: >
        Senegal's offshore Sangomar oil field, which began production
        in June 2024, produced 36.1 million barrels in 2025,
        outstripping projections, while the Greater Tortue Ahmeyim gas
        project ramped up supply to the domestic market. The Faye
        government has pledged to place a share of hydrocarbon revenue
        into stabilisation funds for future generations and has
        launched audits of contracts signed under the previous
        administration.
      why_it_matters: >
        A real, verifiable production success arriving the same period
        as the hidden-debt revelations documented elsewhere in this
        record, testing whether a government that campaigned on fiscal
        transparency can manage a new resource windfall more
        transparently than its predecessor managed existing debt.
      news_url: "https://www.semafor.com/article/01/12/2026/senegals-oil-output-enjoys-bumper-year-in-2025"
      wikipedia_url: ""
      sentiment: mixed

