historical:
  overview: >
    France colonized Senegal from 1677, one of its oldest African
    possessions; Dakar served as the capital of French West Africa,
    and Gorée Island's slave house, though historians debate its exact
    scale, became a symbol of the Atlantic slave trade. From the 19th
    century, residents of the Quatre Communes -- Saint-Louis, Gorée,
    Rufisque and Dakar -- held French citizenship rights unusual for
    colonial Africa. Léopold Sédar Senghor, a poet and co-founder of
    the Négritude movement, led Senegal to independence in 1960 and
    governed for two decades before voluntarily resigning on 31
    December 1980, a rarity among African leaders, transferring power
    to his chosen successor Abdou Diouf. In 2000, Diouf lost a free
    and fair election to opposition leader Abdoulaye Wade, Senegal's
    second peaceful transfer of power and its first between parties.
    Macky Sall defeated Wade's own controversial third-term bid in
    2012, then spent his final years in office facing the same
    accusation: sustained ambiguity over whether he would seek a third
    term himself, met by mass protests, the 2021 and 2023 arrests of
    opposition leader Ousmane Sonko, and dozens of deaths. On 3
    February 2024, Sall abruptly postponed the scheduled election and
    moved to extend his own term; Senegal's Constitutional Council
    overturned the move on 15 February, and Sall complied. Bassirou
    Diomaye Faye, released from prison alongside Sonko under a
    political amnesty on 14 March, won the rescheduled election on 24
    March 2024 and was sworn in on 2 April as Africa's youngest
    elected president, twenty days after his release.
  overview_citations: [c1, c2, c3, c4, c5, c6, c7]
  colonial_legacy: >
    context/colonial_history.yaml already notes Senegal's unusual
    centrality in French colonial administration -- Dakar as the
    capital of French West Africa, and the Quatre Communes granting
    some Senegalese French citizenship from the 19th century, decades
    before any comparable right existed elsewhere in French Africa.
    That partial, selectively-extended citizenship is a genuinely
    different colonial mechanism from most of this corpus: rather than
    uniform exclusion, France created a small class of colonial
    subjects with real, if limited, political standing, and Senegalese
    politicians used those Quatre Communes institutions -- a
    functioning, if constrained, electoral tradition -- to build the
    negotiating leverage that made Senegal's 1960 transition to
    independence unusually peaceful compared to Guinea's punitive
    rupture or Algeria's war, both documented elsewhere in this corpus.
    Léopold Sédar Senghor's 1980 voluntary resignation, transferring
    power to a chosen successor rather than dying in office or being
    deposed, set a precedent of institutional continuity this record's
    Pillar A score and its 2024 democratic resilience both plausibly
    trace back to -- a colonial-era electoral tradition, however
    limited and unequal in its own time, that outlasted the colonial
    power that created it.
  colonial_legacy_citations: [c1, c2]
