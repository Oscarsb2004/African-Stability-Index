  - year: 1960
    type: independence
    title: "Independence from France"
    description: >
      Senegal gained independence from France on 20 August 1960 under
      poet-president Léopold Sédar Senghor, following an unusually
      peaceful transition built on decades of Quatre Communes electoral
      experience.
    url: "https://en.wikipedia.org/wiki/Senegal"
    direction: improve
  - year: 1980
    type: constitutional
    title: "Senghor voluntarily resigns"
    description: >
      Léopold Sédar Senghor voluntarily resigned as president on 31
      December 1980, a rarity among African leaders, transferring
      power to his chosen successor Abdou Diouf.
    url: "https://en.wikipedia.org/wiki/L%C3%A9opold_S%C3%A9dar_Senghor"
    direction: improve
  - year: 2024
    type: election
    title: "Faye elected after Sall's postponement attempt is overturned"
    description: >
      Senegal's Constitutional Council overturned President Sall's
      attempt to postpone the presidential election on 15 February
      2024. Bassirou Diomaye Faye, freshly released from prison, won
      the rescheduled 24 March election and was sworn in as Africa's
      youngest elected president.
    url: "https://www.aljazeera.com/features/2024/4/2/from-prisoner-to-president-in-20-days-senegals-diomaye-faye-takes-office"
    direction: improve
  - year: 2026
    type: constitutional
    title: "Faye sacks Sonko and dissolves the government"
    description: >
      President Faye dismissed Prime Minister Ousmane Sonko and
      dissolved the government on 22 May 2026 amid rising tension over
      the debt crisis, fracturing the coalition that had won the 2024
      election together.
    url: "https://www.aljazeera.com/news/2026/5/23/senegals-president-faye-sacks-pm-sonko-and-dissolves-government"
