balance:
  n_positive: 1
  n_negative: 2
  n_mixed: 1
  note: >
    The disputed-election item and Tchiroma's exile/Paris-complaint
    item are kept as two distinct negatives rather than merged into
    one, because they document different things at different times: a
    single disputed election result, and a still-unresolved
    accountability question that continued escalating for nearly a
    year afterward. The malaria-vaccine gain is credited at full
    positive weight, independent of the same year's political crisis
    -- the same standard this corpus applies to crediting a genuine
    public-health or economic achievement without letting surrounding
    political conduct discount it. The April 2026 ceasefire is coded
    mixed rather than positive: a real, if brief, moment of
    de-escalation that collapsed within days does not meet the bar
    this record sets for a credited gain, but is not simply another
    instance of the conflict's ordinary violence either.
