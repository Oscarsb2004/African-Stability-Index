balance:
  n_positive: 1
  n_negative: 2
  n_mixed: 1
  note: >
    The HRW-documented atrocities and the scale of the terrorism crisis
    are each independently severe and current, and neither is softened
    to make room for the positive item. Gold production's record 2025
    figure is genuine and substantial, not manufactured to offset the
    rest of the record -- it is placed in primary at full weight because
    it is a real, current, verified development, the same standard
    applied to every negative item here. The Traoré government's
    invocation of Sankara is coded mixed rather than positive because it
    is a rhetorical and political framing choice, not itself a verified
    outcome, and this record does not treat a government's stated
    self-image as equivalent to a documented achievement.
