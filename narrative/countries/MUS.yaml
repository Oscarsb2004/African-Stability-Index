balance:
  n_positive: 1
  n_negative: 1
  n_mixed: 2
  note: >
    Recent developments are a genuine mix rather than uniformly negative:
    peaceful resolution of the six-decade Chagos sovereignty dispute
    (positive) and a landslide, undisputed election (mixed -- positive as a
    governance outcome, but the near-total opposition wipeout is itself a
    concern) sit alongside a wiretapping scandal that strained press freedom
    (negative) and rising public debt (mixed). Nothing was omitted to force
    a different balance; this is the mix found in reporting from mid-2024
    through mid-2025. Two further structural counterweights are worth
    naming even though they fall outside the "recent" window: Mauritius's
    post-1980s economic diversification (see historical.key_periods) is
    among the most-cited development successes on the continent, and its
    uninterrupted multiparty electoral record since 1968 is likewise
    unusual in the region.
