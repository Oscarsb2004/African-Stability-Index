recent:
  primary:
    - headline: "Alliance du Changement wins landslide election, ending a decade of MSM government"
      date: 2024-11-10
      summary: >
        The opposition Alliance du Changement, led by former prime minister
        Navin Ramgoolam, won 60 of 62 directly elected seats on 10 November
        2024, on a turnout of 79%, the highest since 2010. The outgoing
        Alliance Lepep, led by Pravind Jugnauth, retained no directly
        elected seats. Ramgoolam was sworn in as prime minister on 13
        November, returning to the office he last held in 2014.
      why_it_matters: >
        A peaceful, decisive transfer of power reinforces the
        electoral-turnover record the index's governance pillar measures,
        though the near-total opposition wipeout has itself raised questions
        about parliamentary scrutiny.
      news_url: "https://www.aljazeera.com/news/2024/11/10/mauritius-election-amid-wiretapping-scandal-whats-at-stake"
      wikipedia_url: "https://en.wikipedia.org/wiki/2024_Mauritian_general_election"
      sentiment: mixed
    - headline: "Wiretapping scandal and brief social media suspension precede November 2024 election"
      date: 2024-10-15
      summary: >
        Leaked phone recordings implicating politicians, officials,
        journalists and diplomats began circulating from mid-October 2024;
        Prime Minister Jugnauth alleged the recordings were AI-manipulated,
        which journalists disputed. Citing national security, the
        government suspended access to major social media platforms from 31
        October, reversing the ban after roughly 24 hours following public
        and press-freedom objections. The episode dominated the final weeks
        of the election campaign.
      why_it_matters: >
        The episode exposed institutional strain around surveillance and
        press freedom even in a state whose formal governance indicators
        score highly.
      news_url: "https://www.timeslive.co.za/news/africa/2024-11-01-mauritius-suspends-social-media-until-after-election-amid-wiretapping-scandal/"
      wikipedia_url: "https://en.wikipedia.org/wiki/2024_Mauritian_social_media_ban"
      sentiment: negative
    - headline: "UK and Mauritius sign treaty returning sovereignty over the Chagos Archipelago"
      date: 2025-05-22
      summary: >
        The United Kingdom and Mauritius signed a treaty on 22 May 2025
        transferring sovereignty of the Chagos Archipelago to Mauritius,
        resolving a dispute dating to Britain's 1965 detachment of the
        territory. The UK retains use of the Diego Garcia military base
        under a lease of at least 99 years, paying Mauritius roughly $136
        million annually. The agreement followed a 2019 ICJ advisory opinion
        that found continued UK administration unlawful.
      why_it_matters: >
        Resolves the most direct unfinished colonial-era territorial claim
        affecting Mauritius, six decades after the original detachment (see
        historical.colonial_legacy).
      news_url: "https://commonslibrary.parliament.uk/research-briefings/cbp-10273/"
      wikipedia_url: "https://en.wikipedia.org/wiki/Chagos_Archipelago_sovereignty_dispute"
      sentiment: positive
  extended:
    - headline: "IMF presses Mauritius to reduce public debt as growth is expected to slow"
      date: 2025-06-18
      summary: >
        The IMF's 2025 Article IV consultation found Mauritian public debt
        had reached 86% of GDP by mid-2025 after fiscal loosening, and
        recommended consolidation. Inflation eased to 2.5% by March 2025
        from 7% in 2023, and reserves rose, but the IMF forecast growth
        slowing to 2.8% in 2026 from 3.2% in 2025 as reduced Middle East
        tourism demand weighs on the economy.
      why_it_matters: >
        Fiscal risk is not directly captured by the index's economic
        indicators, which score current growth and credit access rather
        than debt sustainability.
      news_url: "https://www.imf.org/en/news/articles/2025/06/18/pr-25204-mauritius-imf-concludes-2025-article-iv-consultation"
      wikipedia_url: ""
      sentiment: mixed

