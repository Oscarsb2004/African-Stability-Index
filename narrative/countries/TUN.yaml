  last_updated: 2026-08-11
  iteration_count: 1
  next_action: >
    EXPAND: (1) follow whether Saied's government sees further prime
    ministerial turnover or any stabilisation; (2) follow whether the
    2025 solar milestone converts into measurable progress toward the
    35%-clean-energy-by-2030 target; (3) follow whether tourism
