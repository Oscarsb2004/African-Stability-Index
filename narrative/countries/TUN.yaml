balance:
  n_positive: 1
  n_negative: 2
  n_mixed: 1
  note: >
    The re-election item and the prime-minister-dismissal item are
    kept as two distinct negatives rather than merged into one,
    because they document different things: an electoral process that
    eliminated real opposition, and a pattern of governing instability
    that has persisted despite -- and arguably because of -- the same
    concentration of power. The Kairouan solar plant is credited at
    full positive weight, independent of the same period's political
    and economic crisis -- the same standard this corpus applies to
    crediting a genuine infrastructure achievement without letting
    surrounding political conduct discount it. The 2022 constitutional
    referendum is coded mixed rather than negative: it is the direct
    legal instrument of the reversal Pillar A documents, but this
    record treats the referendum's own contested legitimacy (an
    opposition boycott, roughly 30% turnout) as a distinct fact worth
    stating on its own terms rather than folding entirely into the
    2021 self-coup item.
