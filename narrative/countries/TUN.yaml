  - year: 2010
    type: conflict
    title: "The Jasmine Revolution begins"
    description: >
      Mohamed Bouazizi's self-immolation on 17 December 2010 ignited
      nationwide protests against Ben Ali's authoritarian rule, the
      first uprising of the Arab Spring; Ben Ali fled the country on
      14 January 2011.
    url: "https://en.wikipedia.org/wiki/Mohamed_Bouazizi"
    direction: improve
  - year: 2015
    type: constitutional
    title: "National Dialogue Quartet wins the Nobel Peace Prize"
    description: >
      The National Dialogue Quartet -- the trade union UGTT, employers'
      organization UTICA, the Tunisian League of Human Rights, and the
      National Bar Association -- won the 2015 Nobel Peace Prize for
      mediating Tunisia's democratic transition following the 2014
      constitution.
    url: "https://en.wikipedia.org/wiki/2021_Tunisian_self-coup"
    direction: improve
  - year: 2021
    type: coup
    title: "Saied's self-coup suspends parliament"
    description: >
      President Kais Saied dismissed the government, suspended
      parliament, and revoked lawmakers' immunity on 25 July 2021, in
      what is widely described as a constitutional self-coup that
      ended Tunisia's post-2011 democratic transition.
    url: "https://en.wikipedia.org/wiki/2021_Tunisian_self-coup"
    direction: deteriorate
  - year: 2024
    type: election
    title: "Saied re-elected after jailing nearly all opposition"
    description: >
      President Kais Saied won a second term on 6 October 2024 in an
      election held after nearly all potential opponents were jailed,
      exiled, or barred from running.
    url: "https://www.npr.org/2024/10/08/g-s1-26834/tunisia-kais-saied-election-2024-arab-spring"
