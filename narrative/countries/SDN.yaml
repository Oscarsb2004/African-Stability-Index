balance:
  n_positive: 1
  n_negative: 3
  n_mixed: 0
  note: >
    Sudan's recent record is severe by any honest measure, and this
    record does not pretend otherwise: three of four primary/extended
    items are negative, each independently documented and current
    (El Fasher's fall, the formal genocide determination, and the famine
    now affecting more than half the population). The one positive item,
    the Emergency Response Rooms, was not manufactured to satisfy this
    project's balance requirement -- it was found through the same
    search discipline applied to every country in this corpus, and it
    earns its place on the evidence: 11.5 million people helped, six
    international awards and nominations, a genuinely substantial
    civilian response to total state collapse. It is documented honestly,
    including the real risks its volunteers face from both warring
    parties, rather than as an uncomplicated feel-good counterweight to
    the rest of this record.
