balance:
  n_positive: 1
  n_negative: 2
  n_mixed: 1
  note: >
    The oil-production collapse and the ICJ's rejection of Equatorial
    Guinea's mansion claim are both coded negative at full weight, not
    softened by the genuine social-development item placed alongside
    them. The UNICEF-backed child protection strategy is coded positive
    because it is real, verifiable, and independently significant given
    how little social data this country otherwise publishes -- crediting
    it plainly is more honest than treating every development in a
    kleptocracy as suspect by association. The gas-megaproject push is
    coded mixed rather than positive: the investment is real, but this
    record has direct, documented reason (the Obiang family's oil-era
    enrichment) to withhold judgment on whether it will broaden
    development or simply repeat the pattern.
