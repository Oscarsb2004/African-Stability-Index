balance:
  n_positive: 1
  n_negative: 2
  n_mixed: 1
  note: >
    The refugee-influx item and the election item are kept as two
    distinct negatives rather than merged into one, because they
    document different domains -- an external humanitarian shock
    Burundi did not cause, and a domestic governance failure it did.
    The coffee-sector recovery is credited at full positive weight,
    independent of the governance and refugee crises documented
    alongside it -- the same standard this corpus applies to crediting
    a genuine economic gain without letting surrounding political
    conduct discount it. Rwasa's national-conference call is coded
    mixed rather than positive: it demonstrates that some space for
    domestic dissent still exists, but the record does not treat an
    unanswered call for reform, issued days before an election with no
    real opposition, as an achievement in its own right.
