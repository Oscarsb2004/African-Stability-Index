balance:
  n_positive: 1
  n_negative: 2
  n_mixed: 1
  note: >
    Angola's recent record is genuinely mixed rather than balanced by
    design: two of three primary items are negative (the July 2025 fuel
    protests, the escalating Cabinda conflict) and the third -- the 2027
    succession question -- is coded mixed because real political
    competition and real governance risk are both true at once. The one
    clear positive, the 2022 election's historic narrowing of the MPLA's
    margin, is placed in extended because it is now three years old
    rather than a current development, but it is not omitted: it is the
    structural fact that explains why UNITA's 2027 positioning (documented
    in primary) is credible rather than symbolic. Nothing here is
    softened to make Angola's oil wealth read as straightforward success,
    and nothing is sharpened to make the Cabinda conflict read as
    representative of the whole country.
