recent:
  primary:
    - headline: "Rwanda-backed M23 rebels capture Goma; UN documents thousands of Rwandan troops"
      date: 2025-01-27
      summary: >
        M23 rebels, alongside an estimated 4,000-7,000 Rwandan Defence
        Force soldiers according to UN experts, captured Goma, the
        provincial capital of DRC's North Kivu, in a rapid offensive
        between 23-27 January 2025 that killed an estimated 2,900-3,000
        people. A UN Group of Experts report finalised in April 2025
        documented at least 6,000 Rwandan troops deployed on Congolese
        territory, providing training, logistics and sophisticated
        weaponry, and concluded Rwanda exercised strategic command and
        control over M23.
      why_it_matters: >
        Directly explains Pillar E's externally-driven weakness and the
        international sanctions and diplomatic pressure that followed
        through 2025-2026.
      news_url: "https://www.npr.org/2025/01/26/nx-s1-5275358/rwanda-backed-rebels-claim-to-have-seized-key-city-in-congo"
      wikipedia_url: "https://en.wikipedia.org/wiki/2025_Goma_offensive"
      sentiment: negative
    - headline: "Washington Accords signed, then violated within days as M23 seizes Uvira"
      date: 2025-12-16
      summary: >
        Presidents Kagame and Tshisekedi signed the Washington Accords for
        Peace and Prosperity on 4 December 2025, witnessed by US President
        Trump, committing Rwanda to troop withdrawal and an end to M23
        support. Rwandan-backed M23 forces captured Uvira, DRC's last
        major government-held city in South Kivu, on 9-10 December -- days
        after signing -- before withdrawing unilaterally on 16 December
        under US pressure, with Rwanda's troop deployment estimated by US
        officials at 5,000-7,000 at the time.
      why_it_matters: >
        Shows both a genuine, high-level diplomatic achievement and its
        immediate practical limits -- the peace framework exists, but
        enforcement so far has depended on ad hoc pressure rather than the
        accords' own terms holding automatically.
      news_url: "https://www.aljazeera.com/news/2025/12/13/residents-emerge-in-dr-congos-tense-uvira-after-m23-rebel-takeover"
      wikipedia_url: ""
      sentiment: mixed
    - headline: "US sanctions Rwandan military commanders over Washington Accords violations"
      date: 2026-03-02
      summary: >
        The US Treasury sanctioned the Rwanda Defence Force and four
        senior commanders on 2 March 2026 for supporting M23's operations
        in eastern DRC in violation of the Washington Accords, blocking
        their US-based assets. Human Rights Watch said M23's territorial
        gains "would have been impossible without the Rwandan military's
        direct operational involvement." Rwanda's government called the
        sanctions "one-sided," arguing they ignored DRC violations and the
        presence of the FDLR, a remnant of the 1994 genocidal forces, in
        the conflict zone.
      why_it_matters: >
        The clearest current evidence of Rwanda's deteriorating
        international standing over the DRC conflict, documented here
        alongside Rwanda's own stated justification rather than only the
        accusation against it.
      news_url: "https://www.hrw.org/news/2026/03/03/us-sanctions-rwandan-army-commanders"
      wikipedia_url: ""
      sentiment: negative
  extended:
    - headline: "Rwanda's parliament remains the world's most female, 63.8% of seats"
      date: 2024-07-15
      summary: >
        Women won 63.8% of seats in Rwanda's Chamber of Deputies in the
        July 2024 elections, extending the country's decades-long position
        as the global leader in women's parliamentary representation --
        more than double the worldwide average of roughly 27% and well
        above the constitutional floor of 30%. The 2003 constitution's
        gender quota, adopted alongside the country's post-genocide
        reconstruction, is the specific mechanism behind the result.
      why_it_matters: >
        A genuine, internationally verified counterweight to the same July
        2024 election cycle's Voice-and-Accountability weaknesses
        documented under Pillar A -- both are real, and neither cancels
        the other out.
      news_url: "https://intelpoint.co/insights/63-8-of-rwandas-parliament-are-women-as-of-2024-highest-in-the-world/"
      wikipedia_url: ""
      sentiment: positive

