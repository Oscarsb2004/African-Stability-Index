balance:
  n_positive: 1
  n_negative: 2
  n_mixed: 1
  note: >
    Rwanda is the first first-pass country where strong quantitative
    scores and a difficult political record pull in different directions,
    and this record does not resolve that tension by picking a side.
    Pillar A's five strong governance indicators and Pillar B's genuine
    growth story are real and documented at full weight; so is the sixth
    governance indicator's weakness, the barring of Kagame's leading
    challengers, and Rwanda's documented military role in the DRC conflict
    that dominates the recent record. The one item coded positive --
    Rwanda's world-leading share of women in parliament -- is placed in
    `extended` because it is genuinely a different axis from the Voice and
    Accountability weakness documented under Pillar A, not a rebuttal of
    it; the two coexist in the same record because both are true. Nothing
    here is softened to make the growth story read as uncomplicated
    success, and nothing is sharpened to make the DRC conflict read as the
    whole picture.
