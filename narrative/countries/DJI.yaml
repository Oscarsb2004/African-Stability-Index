balance:
  n_positive: 1
  n_negative: 3
  n_mixed: 1
  note: >
    The election and the Doraleh arbitration ruling are kept as two
    distinct primary negatives rather than merged, because they
    document different domains -- political entrenchment via a
    constitutional age-limit removal, and a separate, adjudicated
    contract-enforcement failure with its own multi-year litigation
    history. The drought/malnutrition item is kept as a distinct
    extended negative rather than folded into Pillar D's own prose,
    because it is a specific, dated humanitarian development this
    pillar's 2023 reference year does not and cannot capture. The
    renewable-energy item is credited at full positive weight because
    it is a real, measured shift (roughly 80% of current electricity
    generation) rather than only a stated target, the same standard
    this corpus applies to crediting genuine achievements independent
    of surrounding political conduct. The economic-resilience item is
    coded mixed rather than positive or negative, because growth
    holding up and port traffic declining are both true and pull in
    different directions -- this record does not resolve that tension
    into a single verdict.
