balance:
  n_positive: 1
  n_negative: 2
  n_mixed: 1
  note: >
    The July 2026 term-extension amendment and the disputed 2023
    election are both coded negative at full weight -- neither is
    softened by the genuine currency stabilisation documented alongside
    them. ZiG's single-digit inflation is coded positive because it is a
    real, verified, substantial achievement, independent of the severe
    political record documented elsewhere in this pillar and in Pillar
    A; a government can achieve real monetary stabilisation while also
    extending its own hold on power, and this record states both rather
    than letting one imply the other is less true. Chiwenga's admission
    that 2017 was a coup is coded mixed: a genuine moment of elite
    candour, but one occurring amid his own power struggle with
    Mnangagwa rather than as disinterested testimony.
