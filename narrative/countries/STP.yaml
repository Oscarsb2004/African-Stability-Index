balance:
  n_positive: 1
  n_negative: 1
  n_mixed: 2
  note: >
    This record leans less severe than most of this corpus because
    the evidence genuinely supports it: Pillar A and Pillar E are
    among the strongest recorded anywhere here, and the 2026 election
    is a real, verifiable case of a sitting president losing his own
    party's backing and still winning at the polls, credited at full
    positive weight rather than downgraded to mixed by default. The
    2022 coup attempt is kept as a distinct negative rather than
    folded into the historical key_periods, because the credible
    allegations of custodial killings afterward are a current,
    unresolved accountability question, not only a historical
    security incident. The prime-minister dismissal and the
    economic-recovery/energy-dependence item are both coded mixed on
    the same standard: each contains a real institutional or economic
    gain alongside a genuine, unresolved complication that this record
    does not let the gain overshadow.
