balance:
  n_positive: 1
  n_negative: 2
  n_mixed: 1
  note: >
    The disputed election and the post-election crackdown are both
    coded negative at full weight -- neither is softened by the
    genuine development financing documented alongside them. The World
    Bank's resumed lending is coded positive because it is a real,
    substantial, verified financial commitment to concrete programmes
    (social protection, education, refugee services), independent of
    whether the Bank should have resumed lending at all -- a judgment
    call this record states plainly belongs to the reader, not to a
    sentiment label. The Constitutional Court ruling is coded mixed:
    a genuine partial narrowing of the law alongside its most severe
    provisions surviving intact.
