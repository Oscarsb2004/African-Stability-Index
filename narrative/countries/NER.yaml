balance:
  n_positive: 1
  n_negative: 2
  n_mixed: 1
  note: >
    The Somair nationalisation is coded positive because it is a
    genuine, verified assertion of resource sovereignty ending a
    documented six-decade extraction imbalance -- the same standard
    applied to Burkina Faso's SOPAMIB mining nationalisations and Mali's
    Barrick Gold renegotiation elsewhere in this corpus -- even though
    whether it broadly benefits ordinary Nigeriens is not yet
    demonstrated. The oil pipeline is coded mixed rather than positive
    because its real revenue is inseparable from its real fragility:
    within its first four months of operation it was shut by a
    cross-border political dispute and damaged by a rebel attack.
    Bazoum's detention and the Tillabéri death toll are each
    independently severe and current, and neither is softened to make
    room for the positive item.
