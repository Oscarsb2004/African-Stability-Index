recent:
  primary:
    - headline: "M23 captures Goma and Bukavu in a major escalation"
      date: 2025-01-30
      summary: >
        The Rwandan-backed M23 movement launched a major offensive from 23
        to 30 January 2025, capturing the regional capital Goma, and later
        seized the city of Bukavu. The UN reported thousands of deaths and
        hundreds of thousands of civilians displaced during the escalation,
        one of the most severe since the formal end of the Second Congo War
        in 2003.
      why_it_matters: >
        The direct cause of the weak Pillar E score and a major driver of
        the displacement and food-insecurity figures elsewhere in this
        record.
      news_url: ""
      wikipedia_url: "https://en.wikipedia.org/wiki/2025_Goma_offensive"
      sentiment: negative
    - headline: "Congo and Rwanda sign peace agreement in Washington"
      date: 2025-12-04
      summary: >
        Following a framework initialled by foreign ministers in June and a
        ceasefire agreed in Doha in July, the presidents of DRC and Rwanda
        signed a peace agreement in Washington on 4 December 2025. Fighting
        continued in parts of the east even after the signing, and the deal
        was met with scepticism in rebel-held areas.
      why_it_matters: >
        A genuine diplomatic milestone after the worst fighting since 2003,
        though the gap between a signed agreement and conditions on the
        ground remains wide -- coded mixed rather than positive for that
        reason.
      news_url: "https://www.npr.org/2025/12/03/nx-s1-5628936/drc-rwanda-peace-deal-trump"
      wikipedia_url: ""
      sentiment: mixed
    - headline: "Cobalt price crash forces a pivot to copper"
      date: 2025-06-01
      summary: >
        Cobalt prices fell to a nine-year low near $22,000 per tonne in
        2025 amid global oversupply, prompting major DRC miners to shift
        capital and output toward copper, where demand from electrification
        and AI data centres is keeping prices elevated. The government has
        also imposed cobalt export quotas intended to restrict supply,
        support prices, and encourage domestic processing.
      why_it_matters: >
        Illustrates how exposed Pillar B's strong GDP-growth reading is to
        global commodity swings the country does not control -- the same
        vulnerability documented for Algeria's hydrocarbon exports, in a
        different mineral.
      news_url: "https://oilprice.com/Metals/Commodities/DR-Congos-Cobalt-Miners-Pivot-To-Copper-Amid-Price-Crash.html"
      wikipedia_url: ""
      sentiment: mixed
  extended:
    - headline: "World Bank commits $250 million to Grand Inga hydropower expansion"
      date: 2025-06-01
      summary: >
        The World Bank approved $250 million toward the long-discussed
        Grand Inga hydropower expansion in June 2025, part of a broader push
        to develop DRC's hydroelectric potential -- currently only about 3%
        exploited despite ranking first in Africa. Critics have raised
        concerns about the project's history of cost overruns, displacement,
        and past corruption.
      why_it_matters: >
        A concrete, if modest, step toward closing the electricity-access
        gap that anchors Pillar G's weakness, though the project's decades
        of delay are themselves relevant context.
      news_url: "https://african.business/2025/06/energy-resources/world-bank-commits-250m-to-controversial-inga-dam-scheme"
      wikipedia_url: ""
      sentiment: mixed

events:
  - year: 2003
    type: peace_deal
    title: "Second Congo War formally ends"
    description: >
      A peace agreement signed in 2002 led to the establishment of a
      Transitional Government on 18 July 2003, formally ending Africa's
      World War after an estimated 3.8 million deaths, mostly from disease
      and starvation.
    url: "https://en.wikipedia.org/wiki/Second_Congo_War"
    direction: improve
  - year: 2019
    type: constitutional
    title: "First peaceful transfer of power since independence"
    description: >
      Felix Tshisekedi was inaugurated on 24 January 2019 after the December
      2018 election, the first peaceful transfer of power in DRC's history
      since 1960. The vote count was contested: opposition candidate Martin
      Fayulu and Catholic church observers criticised the result as
      manipulated.
    url: "https://news.un.org/en/story/2019/03/1034971"
    direction: mixed
  - year: 2025
    type: conflict
    title: "M23 captures Goma"
    description: >
      The Rwandan-backed M23 movement captured the regional capital Goma in
      a January 2025 offensive, killing thousands and displacing hundreds
      of thousands of civilians in the most severe escalation since 2003.
    url: "https://en.wikipedia.org/wiki/2025_Goma_offensive"
    direction: deteriorate
  - year: 2025
    type: peace_deal
    title: "DRC-Rwanda peace agreement signed in Washington"
    description: >
      Presidents of DRC and Rwanda signed a peace agreement in Washington on
      4 December 2025, following a June framework and a July ceasefire
      agreed in Doha. Fighting continued in parts of the east after signing.
    url: "https://www.npr.org/2025/12/03/nx-s1-5628936/drc-rwanda-peace-deal-trump"
    direction: mixed

