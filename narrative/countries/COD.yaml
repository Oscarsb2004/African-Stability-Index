balance:
  n_positive: 0
  n_negative: 1
  n_mixed: 3
  note: >
    Unlike the first three countries researched, the recent-developments
    window here has no item that is cleanly positive, and that was not
    smoothed over: the Goma offensive is a genuine, severe setback, and even
    the peace agreements and infrastructure investment are coded mixed
    because implementation on the ground remains incomplete or unproven at
    time of writing. Two structural counterweights are named here rather
    than folded into the recent-items count, because both fall outside the
    "recent" window: first, the equal-weight composite score rose from 25.3
    to 40.0 between 2000 and 2023 (+14.7), a genuine improvement sustained
    even through the worst conflict most low-income countries have
    experienced since the Second World War; second, the January 2019
    inauguration of Felix Tshisekedi was the first peaceful transfer of
    power in DRC's history since 1960 independence, a real democratic
    milestone even though the underlying vote count was disputed (see
    events). Neither counterweight erases the severity of what the recent
    record shows -- it would be dishonest to claim otherwise -- but both
    are part of the fuller picture.
