recent:
  primary:
    - headline: "Chad ends France's military presence after 125 years"
      date: 2025-01-31
      summary: >
        Chad terminated its defence-cooperation agreement with France in
        November 2024, and the last French troops departed by 31 January
        2025 after a formal handover ceremony in N'Djamena, ending a
        continuous French military presence dating to Opération Épervier
        in 1986 and, before that, to the 1900 conquest itself. President
        Mahamat Déby cited France's failure to deliver security results
        and a desire to diversify partnerships, including with Russia,
        Turkey and the UAE; the withdrawal followed similar breaks by
        Mali, Burkina Faso and Niger.
      why_it_matters: >
        The clearest single marker of how much Chad's external
        relationships have changed since Déby's father's death, and a
        direct rupture with the colonial-military relationship documented
        in historical.colonial_legacy.
      news_url: "https://www.newsweek.com/france-military-withdrawal-chad-counterterrrorism-1998902"
      wikipedia_url: ""
      sentiment: mixed
    - headline: "Boko Haram kills dozens of Chadian soldiers in escalating Lake Chad Basin attacks"
      date: 2026-05-05
      summary: >
        A Boko Haram/JAS ambush killed at least 23 Chadian soldiers and
        wounded 26 more on Chad's Barka Tolorom island in the Lake Chad
        region in early May 2026, prompting a national mourning
        declaration -- the latest in an escalating series that killed
        roughly 40 soldiers in October 2024 despite a government
        counteroffensive that concluded in February 2025 claiming to have
        denied the group sanctuary on Chadian territory.
      why_it_matters: >
        Directly explains Pillar E's weak security score and shows the
        limits of Chad's own recent counter-insurgency claims.
      news_url: "https://www.aljazeera.com/news/2026/5/5/boko-haram-attack-kills-23-soldiers-in-chads-lake-chad-region"
      wikipedia_url: ""
      sentiment: negative
    - headline: "Sudanese refugee crisis in Chad tops 1 million amid strained resources"
      date: 2025-12-06
      summary: >
        More than 800,000 Sudanese have crossed into eastern Chad since
        Sudan's civil war began in April 2023, joining Chad's existing
        refugee population of over 1 million, with arrivals in some
        periods exceeding 1,400 people a day and camps such as Adre and
        Tine each hosting well over 200,000 people in conditions with
        severely limited water, food and shelter.
      why_it_matters: >
        The largest single humanitarian pressure on a country already
        scoring poorly across health and infrastructure, and a crisis
        driven entirely by an external conflict Chad did not cause.
      news_url: "https://www.aljazeera.com/gallery/2025/12/6/chad-struggles-as-new-sudanese-refugees-strain-resources-and-infrastructure"
      wikipedia_url: ""
      sentiment: negative
  extended:
    - headline: "Chad secures $20.5 billion toward its $30 billion 'Connexion 2030' development plan"
      date: 2025-11-14
      summary: >
        Chad mobilised $20.5 billion in financing commitments in the
        first year of its Chad Connexion 2030 plan -- roughly two-thirds
        of its $30 billion target -- from 30 international donors
        including the World Bank and African Development Bank, plus $4.1
        billion in private investment, covering energy, agriculture,
        mining and industrialisation. The plan targets 8% average annual
        growth and middle-income status by 2030; S&P separately confirmed
        Chad's sovereign credit rating in March 2026, citing robust growth
        and moderate debt.
      why_it_matters: >
        A genuine, internationally-backed counterweight to the
        Chad-Cameroon pipeline's failed resource-revenue experiment
        documented under Pillar B -- whether this one avoids the same
        outcome is not yet knowable, but the financing commitments
        themselves are real.
      news_url: "https://www.financialafrik.com/en/2025/11/14/chad-connection-2030-country-secures-20-5-billion-and-already-closes-two-thirds-of-the-financing-for-its-national-development-plan/"
      wikipedia_url: ""
      sentiment: positive

