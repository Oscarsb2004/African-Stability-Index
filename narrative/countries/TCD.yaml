balance:
  n_positive: 1
  n_negative: 2
  n_mixed: 1
  note: >
    Chad's index scores are the most uniformly severe of any first-pass
    country, and this record does not manufacture balance it did not
    find: two of three recent.primary items are negative (an escalating
    Boko Haram/JAS insurgency, a refugee crisis Chad did not cause but
    must absorb) and the third, France's military withdrawal, is coded
    mixed because it is a genuine sovereignty milestone bought at the cost
    of an uncertain security partnership going forward. The one positive
    -- $20.5 billion in financing commitments toward the Chad Connexion
    2030 plan -- is real, verified, and placed in extended rather than
    primary because its outcome is not yet known; the Chad-Cameroon
    pipeline was also, at signing, presented as a resource-curse solution,
    and this record does not claim the new plan will avoid that
    precedent, only that the commitments themselves exist. A further
    structural counterweight worth naming even though it falls outside
    the recent window: the equal-weight composite score rose from 31.8 to
    36.0 (+4.1) between 2000 and 2023 -- a modest but real improvement,
    not the flat or worsening trajectory a reader might assume from the
    recent record alone.
