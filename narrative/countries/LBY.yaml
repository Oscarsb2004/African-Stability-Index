  last_updated: 2026-08-11
  iteration_count: 1
  next_action: >
    EXPAND: (1) follow whether the April 2026 unified budget produces
    any further institutional unification, or remains a standalone
    fiscal deal between rival family networks; (2) follow whether the
    UN's three-track roadmap produces an actual election date; (3)
