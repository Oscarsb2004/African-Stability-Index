balance:
  n_positive: 1
  n_negative: 2
  n_mixed: 1
  note: >
    The migrant-abuse report and the Zawiya refinery clashes are kept
    as two distinct negatives rather than merged into one, because
    they document different domains -- systematic human trafficking
    with state involvement, and a specific armed clash threatening
    critical infrastructure. The unified budget is credited at full
    positive weight because it is a real, concrete institutional step,
    not merely an announcement -- the same standard this corpus
    applies to crediting a genuine achievement without waiting for a
    complete resolution first. The UN roadmap's stalled status is
    coded mixed rather than negative: the process itself continues and
    described "fragile momentum," a genuinely uncertain state this
    record does not resolve into either full progress or full failure.
