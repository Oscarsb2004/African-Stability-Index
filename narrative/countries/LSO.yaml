balance:
  n_positive: 1
  n_negative: 1
  n_mixed: 2
  note: >
    The Highlands Water Project item is coded mixed rather than
    positive or negative: the project genuinely underpins Pillar F's
    low emissions and part of Pillar G's electricity access, and
    genuinely supplies South Africa under a binational treaty, but its
    decades-long pattern of inadequate compensation for displaced
    communities is real and ongoing, documented alongside the
    infrastructure achievement rather than omitted from it. The
    constitutional-amendment item is also coded mixed: a court striking
    down executive-friendly constitutional engineering is a genuine
    institutional strength, but it exists only because the amendment
    was attempted in the first place, following a real no-confidence
    threat against the sitting government. The HIV treatment
    achievement is credited at full positive weight independent of
    Pillar D's otherwise weak aggregate score, on the same standard
    already applied to Botswana's own HIV/AIDS achievement elsewhere in
    this corpus.
