balance:
  n_positive: 2
  n_negative: 3
  n_mixed: 0
  note: >
    The election result and the crackdown are kept as two distinct
    negatives rather than merged into one, because they document
    different domains -- a fraudulent process, and a separate,
    still-uninvestigated act of state violence whose scale remains
    genuinely disputed across sources. The CHADEMA disqualification is
    kept as a third, extended-list negative rather than folded into
    the election item, because it is the specific mechanism (party
    banned, leader charged with a capital, non-bailable offence) that
    made the election's lack of a credible challenger possible, not
    merely background to it. Both the hydropower project and the
    gold/tourism export records are credited at full positive weight
    because they are real, concrete, verifiable achievements, not
    merely announcements -- the same standard this corpus applies to
    crediting genuine achievements on their own terms independent of
    the surrounding political conduct, most recently applied to LBY's
    unified budget.
