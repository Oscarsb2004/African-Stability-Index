# Names that do not match the current UN M49 English table exactly, mapped to their code.
# Every entry was checked against the M49 overview table read on 2026-09-26; the M49 name is in the comment.
# An alias for a name that M49 already matches exactly is refused, so this file cannot hide a real match.
# Codes are ISO 3166-1 alpha-3. Areas with no current ISO code use their former ISO 3166-3 code (ANT) or,
# where they never had one, their M49 number (830).

[aliases]
# Spelling in the IPU archive (1 February 2015)
"Bolivia" = "BOL"                                    # Bolivia (Plurinational State of)
"Cote d'Ivoire" = "CIV"                              # Côte d’Ivoire
"Czech Republic" = "CZE"                             # Czechia
"Nauru" = "NRU"                                      # M49 now lists it as "Naoero" (code 520)
"Netherlands" = "NLD"                                # Netherlands (Kingdom of the)
"Swaziland" = "SWZ"                                  # Eswatini
"The F.Y.R. of Macedonia" = "MKD"                    # North Macedonia
"Turkey" = "TUR"                                     # Türkiye
"United Kingdom" = "GBR"                             # United Kingdom of Great Britain and Northern Ireland
"Venezuela" = "VEN"                                  # Venezuela (Bolivarian Republic of)

# Spelling in the official MDG regional groupings document (capture of 2014-10-20)
"Cape Verde" = "CPV"                                 # Cabo Verde
"Central African Rep" = "CAF"                        # Central African Republic
"Channel Islands" = "830"                            # M49 830; no ISO code; absent from the current table
"D. R of the Congo" = "COD"                          # Democratic Republic of the Congo
"Dem Rep of the Congo" = "COD"                       # Democratic Republic of the Congo
"Faeroe Islands" = "FRO"                             # Faroe Islands
"Falkland Is (Malvinas)" = "FLK"                     # Falkland Islands (Malvinas)
"Guinea Bissau" = "GNB"                              # Guinea-Bissau
"Hong Kong SAR of China" = "HKG"                     # China, Hong Kong Special Administrative Region
"Korea, Dem People's Rep of" = "PRK"                 # Democratic People's Republic of Korea
"Korea, Rep of" = "KOR"                              # Republic of Korea
"Lao People's Dem Republic" = "LAO"                  # Lao People's Democratic Republic
"Libyan Arab Jamahiriya" = "LBY"                     # Libya
"Macao SAR of China" = "MAC"                         # China, Macao Special Administrative Region
"Micronesia (Fed States of)" = "FSM"                 # Micronesia (Federated States of)
"Netherland Antilles" = "ANT"                        # dissolved in 2010; former ISO 3166-3 code
"Netherlands Antilles" = "ANT"                       # dissolved in 2010; former ISO 3166-3 code
"Northern Mariana Is" = "MNP"                        # Northern Mariana Islands
"Occupied Palestinian Territory" = "PSE"             # State of Palestine
"Sao Tome & Principe" = "STP"                        # Sao Tome and Principe
"St Vincent & the Grenadines" = "VCT"                # Saint Vincent and the Grenadines
"TFYR of Macedonia" = "MKD"                          # North Macedonia
"The former Yugoslav Republic of Macedonia" = "MKD"  # North Macedonia
"U. Rep of Tanzania" = "TZA"                         # United Republic of Tanzania
"US Virgin Islands" = "VIR"                          # United States Virgin Islands
"United States" = "USA"                              # United States of America
"Venezuela R.B." = "VEN"                             # Venezuela (Bolivarian Republic of)

# Spelling in the UN DESA list of least developed countries (capture of 2014-01-13)
"Dem. Rep of the Congo" = "COD"                      # Democratic Republic of the Congo
"Lao People's Dem. Republic" = "LAO"                 # Lao People's Democratic Republic
"United Rep. of Tanzania" = "TZA"                    # United Republic of Tanzania

# Spelling in the UN-OHRLLS list of landlocked developing countries (capture of 2014-12-31)
"Kyrgystan" = "KGZ"                                  # misspelt in the source; Kyrgyzstan
"Lao People’s Democratic Republic" = "LAO"           # curly apostrophe in the source
"The Former Yugoslav Republic of Macedonia" = "MKD"  # North Macedonia
