# Groups of states that the Data tab compares (P105, P106). 09_explore.py reads this file.
#
# The African Union's eight Regional Economic Communities are the owner's own compilation. It was made for edition 1
# (its asi/core/countries.py) and moved here on 2026-10-20 unchanged. It records current membership, including the
# 2025 withdrawals of Burkina Faso, Mali and Niger from ECOWAS. It is the authority (P106): 09_explore.py checks it
# against Wikidata and reports every disagreement, and changes nothing.
#
# Organisations are named by their Wikidata item, and their members come from the wikidata-states dataset. The rule
# for listing one: it groups some but not all of the 54 states, by region, language, religion, law, a resource,
# trade, or a monetary or customs union, and Wikidata records at least 3 of them as current members. Development
# banks and funds, UN agencies, treaties and military operations are not groupings in this sense. The West African
# Economic and Monetary Union and the Alliance of Sahel States are not listed: Wikidata records fewer than 3 members
# of each (2026-10-20).
#
# Each state counts once in a group. No state is excluded, adjusted or reweighted for being small, an island or
# data-poor (P105).

