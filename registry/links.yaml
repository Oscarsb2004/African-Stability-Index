# The links between states that the site draws (the owner's ruling of 2026-10-23, R5): who backs whom in Africa's
# conflicts. This list is the owner's compilation. Claude drafts each link and its card from named public sources,
# cited and dated; the owner rules on every entry in the pull request that adds it, and merging is the ruling.
#
# A link runs from a backer (`from`, any state, African or not) to the member state where its support is used (`to`),
# naming the armed actor it backs when that is not the state's own government (`actor`). `kind` is one of the kinds
# below. `status` is as the cited source puts it: "confirmed" where a UN body or a government states it as a finding,
# "reported" where a source reports or judges allegations credible; the site draws a confirmed link solid and a
# reported one dashed. `until` closes a link that has ended; the site shows it as historical. A card's `summary` is
# one or two sentences, each fact in it found in a listed source; every source names its publisher, title, address,
# date and the day it was read. Checked by asi/instability/links.py before anything is drawn.
format: asi.links/1

kinds:
  forces: Troops or state forces
  contractors: Mercenaries or private military companies
  arms: Arms, equipment or money
  political: Political or diplomatic backing

links:
  - id: are-sdn-rsf
    from: ARE
    to: SDN
    actor: Rapid Support Forces (RSF)
    conflict: Sudan's war (2023-)
    kind: arms
    status: reported
    since: "2023"
    summary: >-
      The UN Panel of Experts on the Sudan judged credible the allegations that weapons and ammunition reached the
      RSF on cargo flights unloaded several times a week at Am Djarass, in eastern Chad. The United Arab Emirates
      denied any involvement in shipping arms to the RSF.
    sources:
      - publisher: United Nations Security Council, Panel of Experts on the Sudan
        title: Final report of the Panel of Experts on the Sudan (S/2024/65), paragraphs on p. 15
        url: https://docs.un.org/en/S/2024/65
        date: "2024-01-15"
        read: "2026-10-23"

  - id: rwa-cod-m23
    from: RWA
    to: COD
    actor: Mouvement du 23 mars (M23)
    conflict: The war in the eastern DRC (2021-)
    kind: forces
    status: confirmed
    since: "2021"
    summary: >-
      The UN Group of Experts on the DRC estimated that 3,000 to 4,000 Rwanda Defence Force troops were deployed in
      Nyiragongo, Rutshuru and Masisi, and found that Rwanda's de facto control and direction over M23 operations
      makes it liable for the group's actions. Rwanda denies it, and has never acknowledged its troops there.
    sources:
      - publisher: United Nations Security Council, Group of Experts on the Democratic Republic of the Congo
        title: Final report of the Group of Experts on the Democratic Republic of the Congo (S/2024/432), pp. 12-13
        url: https://docs.un.org/en/S/2024/432
        date: "2024-06-04"
        read: "2026-10-23"
      - publisher: Al Jazeera
        title: "Uganda backed M23 in DRC, Rwanda's 'de facto control' on group: UN experts"
        url: https://www.aljazeera.com/news/2024/7/9/uganda-backed-m23-in-drc-rwandas-de-facto-control-on-group-un-experts
        date: "2024-07-09"
        read: "2026-10-23"

  - id: rus-mli
    from: RUS
    to: MLI
    conflict: Mali's war against jihadist and separatist groups (2012-)
    kind: contractors
    status: reported
    since: "2021"
    summary: >-
      Russia's Wagner Group, mercenaries supporting Mali's army, said in June 2025 it would leave after more than
      three and a half years, while Russian mercenaries remain under the Kremlin-backed Africa Corps. A UN
      fact-finding report found strong indications that more than 500 people were killed by Malian troops and foreign
      military personnel at Moura in March 2022.
    sources:
      - publisher: Al Jazeera
        title: Russia's Wagner mercenaries leaving Mali, Africa Corps to remain
        url: https://www.aljazeera.com/news/2025/6/6/russias-wagner-mercenaries-leaving-mali-africa-corps-to-remain
        date: "2025-06-06"
        read: "2026-10-23"
      - publisher: UN News (on the report of the Office of the UN High Commissioner for Human Rights)
        title: "Moura: Over 500 killed by Malian troops, foreign military personnel in 2022 operation"
        url: https://news.un.org/en/story/2023/05/1136607
        date: "2023-05-12"
        read: "2026-10-23"

  - id: eri-eth-tigray
    from: ERI
    to: ETH
    conflict: The war in Tigray (2020-2022)
    kind: forces
    status: confirmed
    since: "2020"
    until: "2022"
    summary: >-
      Eritrea's Defence Forces fought alongside Ethiopia's army in Tigray from November 2020, the joint investigation
      of the Ethiopian Human Rights Commission and the UN's human rights office found. It found reasonable grounds to
      believe that they, like other parties, attacked civilians.
    sources:
      - publisher: Ethiopian Human Rights Commission and Office of the UN High Commissioner for Human Rights
        title: Report of the EHRC/OHCHR Joint Investigation into Alleged Violations Committed by all Parties to the Conflict in the Tigray Region (pp. 6-7)
        url: https://www.ohchr.org/sites/default/files/2021-11/OHCHR-EHRC-Tigray-Report.pdf
        date: "2021-11-03"
        read: "2026-10-23"
