# pillar_coh.yaml — Social Cohesion and Equity (COH)
# Goal: Whether society holds together across its groups: how evenly income and opportunity are shared, and how much strain displacement and fast urban growth put on it.
#
# Edition 2, step 6 (P57, variant B). Every indicator here has one home, this pillar, and falls under its
# umbrella (P58). Step 9 adds non-state conflict (scored) and youth unemployment (descriptive). 5 scored, 4
# descriptive.

- variable_name: gini
  display_name: Gini index
  source: wb_api
  series_code: SI.POV.GINI
  role: descriptive
  polarity: negative
  pillars:
  - COH
  year_start: 2010
  year_end: 2025
  aggregation: most_recent
  justification: Income inequality. Below the admission floor (33 of 54 states) at 2024; descriptive, shown and
    not scored.
  database: wdi
  log_transform: true
  theoretical_bounds:
  - 0
  - 100
- variable_name: non_state_deaths
  display_name: Deaths in non-state conflict (fighting between organised groups), per 100,000 people
  source: ucdp
  series_code: ns_total_deaths_best
  role: scoring
  polarity: negative
  pillars:
  - COH
  year_start: 2015
  year_end: 2025
  aggregation: most_recent
  justification: 'Horizontal cohesion between communities (plan 1.2): UCDP''s best estimate of deaths in fighting
    between organised groups, neither of them a government, inside the country''s borders in the year: the plan''s
    communal violence. A year without it is a measured zero. Edition 2, step 9.'
  database: ucdp
  log_transform: true
  per_capita: 100000
- variable_name: youth_unemployment
  display_name: Unemployment, youth (% of the labour force aged 15 to 24, modelled ILO estimate)
  source: wb_api
  series_code: SL.UEM.1524.ZS
  role: descriptive
  polarity: negative
  pillars:
  - COH
  year_start: 2015
  year_end: 2025
  aggregation: most_recent
  justification: 'The inclusion of youth, which Interpeace names (plan 1.1, 1.2). Shown and not scored: measured
    unemployment is higher in Africa''s richer states, where informal work is rarer, so its direction is contradicted
    (the candidate screen of 2026-10-18).'
  database: wdi
  log_transform: false
- variable_name: refugees_hosted
  display_name: Refugees under the mandate of the UNHCR by country or territory of asylum, per 100,000 people
  source: wb_api
  series_code: SM.POP.RHCR.EA
  role: scoring
  polarity: negative
  pillars:
  - COH
  year_start: 2015
  year_end: 2025
  aggregation: most_recent
  justification: 'Refugees hosted: a strain on services and on relations between hosts and newcomers. UNHCR records
    zeros, so a gap is a gap.'
  database: wdi
  log_transform: true
  per_capita: 100000
- variable_name: slum_population
  display_name: Population living in slums (% of urban population)
  source: wb_api
  series_code: EN.POP.SLUM.UR.ZS
  role: scoring
  polarity: negative
  pillars:
  - COH
  year_start: 2015
  year_end: 2025
  aggregation: most_recent
  justification: How unevenly the city's gains are shared.
  database: wdi
  log_transform: false
  theoretical_bounds:
  - 0
  - 100
- variable_name: female_male_labour
  display_name: Ratio of female to male labor force participation rate (%) (modeled ILO estimate)
  source: wb_api
  series_code: SL.TLF.CACT.FM.ZS
  role: scoring
  polarity: positive
  pillars:
  - COH
  year_start: 2015
  year_end: 2025
  aggregation: most_recent
  justification: How evenly economic opportunity is shared between women and men. Can pass 100, so no theoretical
    bounds.
  database: wdi
  log_transform: false
- variable_name: urban_growth
  display_name: Urban population growth (annual %)
  source: wb_api
  series_code: SP.URB.GROW
  role: scoring
  polarity: negative
  pillars:
  - COH
  year_start: 2015
  year_end: 2025
  aggregation: most_recent
  justification: Fast urban growth strains housing, services and the social fabric of cities.
  database: wdi
  log_transform: false
- variable_name: primary_gpi
  display_name: School enrollment, primary, gender parity index (GPI)
  source: wb_api
  series_code: SE.ENR.PRIM.FM.ZS
  role: descriptive
  polarity: positive
  pillars:
  - COH
  year_start: 2015
  year_end: 2025
  aggregation: most_recent
  justification: 'Gender parity in primary enrolment, folded so that parity scores best. Opportunity shared between
    girls and boys. Edition 2, step 6: variant B (P57) leaves it out; descriptive, shown and not scored.'
  database: wdi
  log_transform: false
  transform: distance_from_parity
  theoretical_bounds:
  - 0
  - 1
- variable_name: secondary_gpi
  display_name: School enrollment, secondary, gender parity index (GPI)
  source: wb_api
  series_code: SE.ENR.SECO.FM.ZS
  role: descriptive
  polarity: positive
  pillars:
  - COH
  year_start: 2015
  year_end: 2025
  aggregation: most_recent
  justification: Gender parity in secondary enrolment, folded so that parity scores best. Below the admission floor
    (33 of 54 states) at 2024; descriptive, shown and not scored.
  database: wdi
  log_transform: false
  transform: distance_from_parity
  theoretical_bounds:
  - 0
  - 1
