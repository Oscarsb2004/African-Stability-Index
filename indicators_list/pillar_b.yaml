# pillar_b.yaml — Economic
# Measures economic performance, poverty, inequality, structural resilience.

- variable_name: gdp_pc_ppp
  display_name: GDP per capita, PPP (current international $)
  source: wb_api
  series_code: NY.GDP.PCAP.PP.CD
  role: scoring
  polarity: positive
  pillars:
  - B
  year_start: 2015
  year_end: 2024
  aggregation: most_recent
  justification: PPP-adjusted GDP per capita is the primary measure of material living
    standards, controlling for price differences across countries. The most direct
    single indicator of economic resilience.
  database: wdi
  log_transform: true
- variable_name: gdp_growth_3yr_avg
  display_name: GDP growth, annual % (3-year average)
  source: wb_api
  series_code: NY.GDP.MKTP.KD.ZG
  role: scoring
  polarity: positive
  pillars:
  - B
  year_start: 2015
  year_end: 2024
  aggregation: average_recent_3
  justification: A 3-year average smooths single-year volatility and reflects the
    recent growth trajectory. Sustained growth signals economic momentum; contraction
    or stagnation signals structural fragility.
  database: wdi
  log_transform: false
- variable_name: inflation_5yr_avg
  display_name: Inflation, consumer prices, annual % (5-year average)
  source: wb_api
  series_code: FP.CPI.TOTL.ZG
  role: scoring
  polarity: negative
  pillars:
  - B
  year_start: 2015
  year_end: 2024
  aggregation: average_recent_5
  justification: Chronic high inflation erodes real wages, destroys savings, and destabilises
    governments. A 5-year average captures structural monetary instability rather
    than isolated supply shocks.
  database: wdi
  log_transform: false
- variable_name: gini
  display_name: Gini index
  source: wb_api
  series_code: SI.POV.GINI
  role: scoring
  polarity: negative
  pillars:
  - B
  year_start: 2010
  year_end: 2024
  aggregation: most_recent
  justification: Income inequality is a structural driver of social tension and political
    instability that GDP alone conceals. Year range extended to 2010 because Gini
    is survey-based and reported infrequently.
  database: wdi
  log_transform: false
- variable_name: domestic_credit_private
  display_name: Domestic credit to private sector (% of GDP)
  source: wb_api
  series_code: FS.AST.PRVT.GD.ZS
  role: scoring
  polarity: positive
  pillars:
  - B
  year_start: 2000
  year_end: 2024
  aggregation: most_recent
  justification: "Domestic credit to the private sector measures financial-sector
    depth: the extent to which banks and other institutions channel savings into
    productive private investment. Deep credit markets let firms and households
    absorb shocks without distress sales or default cascades, which is the
    economic-resilience channel most directly tied to stability. Replaces
    firm_foreign_owned (IC.FRM.FO.ZS) in the 2026 revision for three reasons
    (see methodology/METHODOLOGY_REVIEW.md C3): (1) firm_foreign_owned was the
    only indicator in the index with a NEGATIVE item-rest correlation (-0.10),
    meaning it moved against the rest of Pillar B as polarised; (2) it drew on
    enterprise surveys so infrequent that 20 of 49 countries carried pre-2021
    values, some from 2006; (3) it is conceptually confounded in the African
    context, because extractive-sector FDI concentrates in less stable states,
    so high foreign ownership can signal resource dependence rather than a
    healthy investment climate. Coverage screened before adoption: 53/54
    countries, 51 of them 2018 or later, median year 2024. Source: World Bank
    WDI FS.AST.PRVT.GD.ZS (IMF International Financial Statistics)."
  database: wdi
  log_transform: false
